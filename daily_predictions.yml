name: NBA Props Model — Daily Pipeline

# Three jobs, three cron triggers:
#   14:00 UTC = 9:00 AM ET  — opening lines snapshot (before sharp action)
#   13:00 UTC = 8:00 AM ET  — predictions + grading
#   23:00 UTC = 6:00 PM ET  — closing lines snapshot (post-injury-report)
#
# Timeline:
#   9 AM ET  → snapshot game totals/spreads (opening reference)
#   8 AM ET  → grade yesterday, predict today (uses yesterday's closing lines)
#   5:30 PM  → NBA official injury report deadline
#   6 PM ET  → snapshot player prop closing lines (sharpest pre-tip price)
#   ~7 PM ET → tipoffs begin

on:
  schedule:
    - cron: '0 14 * * *'   # 9:00 AM ET — opening lines snapshot
    - cron: '0 13 * * *'   # 8:00 AM ET — predictions + grading
    - cron: '0 23 * * *'   # 6:00 PM ET — closing lines snapshot
  workflow_dispatch:         # manual trigger runs all three jobs

# ── Job 1: Opening lines snapshot (9 AM ET) ───────────────────────────────────
jobs:

  snapshot_opening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 14 * * *'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Snapshot opening lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python snapshot_opening_lines.py

      - name: Commit opening lines
        run: |
          git config user.name  "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add data/opening_lines_*.json
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Opening lines $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main


# ── Job 2: Grade + Predict (8 AM ET) ─────────────────────────────────────────

  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 13 * * *'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install lightgbm scikit-learn pandas numpy requests pyarrow joblib scipy

      - name: Grade yesterday's predictions
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python grade_darko_v4.py
        continue-on-error: true

      - name: Generate today's predictions
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SKIP_SGPS: "1"
        run: python predict_darko_v4.py

      - name: Commit predictions and graded results
        run: |
          git config user.name  "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add predictions/ graded/ -f
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Predictions $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main


# ── Job 3: Closing lines snapshot (6 PM ET) ──────────────────────────────────

  snapshot_closing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 23 * * *'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Snapshot closing lines (post-injury-report)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python snapshot_closing_lines.py

      - name: Commit closing lines
        run: |
          git config user.name  "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add graded/closing_lines_*.json
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Closing lines $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
