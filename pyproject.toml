[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-props-model"
version = "0.2.0"
description = "Probabilistic model for NBA player prop markets."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joseph Shackelford" }]

dependencies = [
    "lightgbm>=4.4.0,<5",
    "scikit-learn>=1.5.2,<2",
    "pandas>=2.2.2,<3",
    "numpy>=2.0.2,<3",
    "requests>=2.32.3,<3",
    "pyarrow>=16.1.0,<21",
    "joblib>=1.4.2,<2",
    "scipy>=1.14.1,<2",
    "nbainjuries==1.1.1",
]

[project.scripts]
sgp-engine = "sgp_engine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
