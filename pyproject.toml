[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-props-model"
version = "0.2.0"
description = "Probabilistic model for NBA player prop markets."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joseph Shackelford" }]

dependencies = [
    "lightgbm==4.3.0",
    "scikit-learn==1.4.2",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "requests==2.32.3",
    "pyarrow==16.1.0",
    "joblib==1.4.2",
    "scipy==1.13.1",
    "nbainjuries==1.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
