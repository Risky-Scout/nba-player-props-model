name: NBA Props Model — Daily Pipeline

# Three jobs, three cron triggers (ET reference is approximate — ET shifts
# ±1h between EST and EDT; pipeline behavior depends on UTC, not local ET):
#   13:00 UTC = 9:00 AM ET (EDT) / 8:00 AM ET (EST)  — predictions + grading
#   14:00 UTC = 10:00 AM ET (EDT) / 9:00 AM ET (EST) — opening lines snapshot
#   23:00 UTC = 7:00 PM ET (EDT) / 6:00 PM ET (EST)  — closing lines snapshot

on:
  schedule:
    - cron: '0 14 * * *'   # 10:00 AM ET (EDT) / 9:00 AM ET (EST) — opening lines snapshot
    - cron: '0 13 * * *'   # 9:00 AM ET (EDT) / 8:00 AM ET (EST)  — predictions + grading
    - cron: '0 23 * * *'   # 7:00 PM ET (EDT) / 6:00 PM ET (EST)  — closing lines snapshot
  workflow_dispatch:         # manual trigger runs all three jobs

# Phase 13AN-H1: queue concurrent runs against main so the three jobs
# never race each other on commit/push of generated files.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Phase 13AN-G: opt this workflow's actions into Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# ── Job 1: Opening lines snapshot (9 AM ET) ───────────────────────────────────
jobs:

  snapshot_opening:  # 14:00 UTC = 10:00 AM ET EDT / 9:00 AM ET EST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 14 * * *'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Snapshot opening lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/snapshot_opening_lines.py

      - name: Commit opening lines
        run: |
          # Hard rule #6: every commit must show Joseph Shackelford as author.
          git config user.name  "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          git add data/opening_lines_*.json
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "Opening lines $(TZ=America/New_York date +%Y-%m-%d)"
          PUSH_SUCCESS=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi


# ── Job 2: Grade + Predict (13:00 UTC = 9 AM ET EDT / 8 AM ET EST) ───────────
# CRITICAL: This job is INDEPENDENT — it does NOT depend on snapshot_opening.
# snapshot_opening failing must never cause predictions to be skipped.

  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 13 * * *'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Phase 13AL: secrets preflight — fail fast if BDL is missing.
      - name: Secrets preflight (Phase 13AL)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 scripts/verify_secrets_preflight.py --mode daily

      - name: Grade yesterday's predictions
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/grade.py

      - name: Generate today's predictions
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SKIP_SGPS: "1"
        run: python scripts/predict.py

      # HARD FAIL: all 4 prediction files must exist non-empty or the whole job fails visibly.
      # predict.py writes sgps_*.json even when SKIP_SGPS=1 (empty sgps array), so the
      # check is unconditional.
      - name: Verify predictions were written
        run: |
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          MISSING=""
          for f in "predictions/all_props_${DATE}.parquet" \
                   "predictions/pmf_display_${DATE}.json" \
                   "predictions/singles_${DATE}.json" \
                   "predictions/sgps_${DATE}.json"; do
            if [ ! -s "$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Predictions missing or empty:$MISSING"
            exit 1
          fi
          COUNT=$(python3 -c "import json; d=json.load(open('predictions/singles_${DATE}.json')); print(len(d.get('picks',d.get('singles',[]))))")
          echo "Predictions written: $COUNT picks"
          if [ "$COUNT" -eq "0" ]; then
            echo "::error::0 picks written - check API keys and model files"
            exit 1
          fi

      # Phase 13AD: refresh nba_props_today.json so the WoO front-end
      # static fallback never goes stale, then run the prediction-output
      # verifier and the WoO page verifier. Failures here surface as
      # workflow errors so the operator notices.
      - name: Refresh nba_props_today.json (Phase 13AD)
        run: |
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          python3 scripts/publish_nba_props_today.py --date "$DATE"

      - name: Verify daily prediction outputs (Phase 13AD)
        run: |
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          python3 scripts/verify_daily_prediction_outputs.py --date "$DATE"

      - name: Commit predictions and graded results
        run: |
          # Hard rule #6: every commit must show Joseph Shackelford as author.
          git config user.name  "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          git add predictions/ artifacts/graded/ artifacts/automation_health/ \
                  artifacts/scoring/ -f
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "Predictions $(TZ=America/New_York date +%Y-%m-%d)"
          PUSH_SUCCESS=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi

      - name: Verify WoO NBA props page (Phase 13AD)
        run: |
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          python3 scripts/verify_woo_nba_props_page.py --date "$DATE"

      # Phase 13AE: surface settled-stats freshness in the daily predict
      # job so the operator audit trail explicitly captures whether BDL
      # backfill is current. This step never fails the predict job —
      # predictions can be generated against the previous champion even
      # when settled stats lag — but the warning is loud.
      - name: Verify settled player stats freshness (Phase 13AE)
        continue-on-error: true
        run: |
          PREV_DAY=$(TZ=America/New_York date -d 'yesterday' +%Y-%m-%d 2>/dev/null \
                     || TZ=America/New_York date -v-1d +%Y-%m-%d)
          python3 scripts/verify_player_game_stats_freshness.py \
            --required-through-date "$PREV_DAY" || \
            echo "::warning::player_game_stats stale through $PREV_DAY — training/scoring blocked until BDL backfills"

      # Phase 13AH: publish the morning WoO snapshot, score the previous-
      # day's WoO predictions against settled outcomes, and run the full
      # daily production contract verifier so the operator audit trail
      # captures every required PASS/WARN/FAIL line.
      - name: Publish WoO morning snapshot (Phase 13AH)
        run: |
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          python3 scripts/publish_woo_snapshot.py --date "$DATE" --snapshot-type morning

      - name: Verify WoO snapshot outputs (Phase 13AH)
        # KEEP continue-on-error: t_minus_25/close_lock snapshots are legitimately
        # "pending until tip" early in the day — the warning is the intended signal.
        continue-on-error: true
        run: |
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          python3 scripts/verify_woo_snapshot_outputs.py --date "$DATE" || \
            echo "::warning::WoO t_minus_25/close_lock snapshots pending until tip — see step log"

      - name: Score WoO previous-day predictions (Phase 13AH)
        run: |
          PREV_DAY=$(TZ=America/New_York date -d 'yesterday' +%Y-%m-%d 2>/dev/null \
                     || TZ=America/New_York date -v-1d +%Y-%m-%d)
          python3 scripts/score_woo_after_game.py --date "$PREV_DAY" || { \
            echo "::error::WoO after-game scoring failed - see step log"; exit 1; }

      - name: Verify Derek email-claimed files (Phase 13AH)
        run: |
          PREV_DAY=$(TZ=America/New_York date -d 'yesterday' +%Y-%m-%d 2>/dev/null \
                     || TZ=America/New_York date -v-1d +%Y-%m-%d)
          python3 scripts/verify_derek_email_claimed_files.py --delivery-date "$PREV_DAY" || { \
            echo "::error::Derek email-claimed files verifier failed - see step log"; exit 1; }

      - name: Build + verify daily automation health report (Phase 13AD)
        run: |
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          python3 scripts/build_daily_automation_health_report.py --date "$DATE"
          python3 scripts/verify_daily_automation_health_report.py --date "$DATE" || { \
            echo "::error::daily automation health report FAILED - see step log"; exit 1; }

      - name: Run full daily production contract + operator daily check (Phase 13AH)
        run: |
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          PREV_DAY=$(TZ=America/New_York date -d 'yesterday' +%Y-%m-%d 2>/dev/null \
                     || TZ=America/New_York date -v-1d +%Y-%m-%d)
          python3 scripts/verify_full_daily_production_contract.py \
            --date "$DATE" --derek-date "$PREV_DAY" \
            --required-outcomes-through "$PREV_DAY" || { \
              echo "::error::full production contract FAILED - see step log"; exit 1; }
          python3 scripts/operator_daily_check.py \
            --date "$DATE" --derek-date "$PREV_DAY" \
            --required-outcomes-through "$PREV_DAY" || { \
              echo "::error::operator daily check FAILED - see step log"; exit 1; }

      - name: Upload predictions to server via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          curl --ftp-create-dirs --max-time 30 --retry 3 \
            -u "$SFTP_USER:$SFTP_PASS" \
            -T "predictions/singles_${DATE}.json" \
            "ftp://$SFTP_HOST${SFTP_PATH}/singles_${DATE}.json"
          curl --ftp-create-dirs --max-time 30 --retry 3 \
            -u "$SFTP_USER:$SFTP_PASS" \
            -T "predictions/sgps_${DATE}.json" \
            "ftp://$SFTP_HOST${SFTP_PATH}/sgps_${DATE}.json"
          curl --ftp-create-dirs --max-time 30 --retry 3 \
            -u "$SFTP_USER:$SFTP_PASS" \
            -T "predictions/pmf_display_${DATE}.json" \
            "ftp://$SFTP_HOST${SFTP_PATH}/pmf_display_${DATE}.json"
          # Phase 13AD: also upload the freshly published nba_props_today.json
          # so the deployed front-end has a current static fallback.
          curl --ftp-create-dirs --max-time 30 --retry 3 \
            -u "$SFTP_USER:$SFTP_PASS" \
            -T "predictions/nba_props_today.json" \
            "ftp://$SFTP_HOST${SFTP_PATH}/nba_props_today.json"
          echo "✓ Predictions uploaded to server"


# ── Job 3: Closing lines snapshot (23:00 UTC = 7 PM ET EDT / 6 PM ET EST) ────

  snapshot_closing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 23 * * *'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Snapshot closing lines (post-injury-report)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/snapshot_closing_lines.py

      - name: Commit closing lines
        run: |
          # Hard rule #6: every commit must show Joseph Shackelford as author.
          git config user.name  "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          git add artifacts/graded/closing_lines_*.json
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "Closing lines $(TZ=America/New_York date +%Y-%m-%d)"
          PUSH_SUCCESS=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi
