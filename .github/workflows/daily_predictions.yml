name: NBA Props Model — Daily Pipeline

# Three jobs, three cron triggers:
#   14:00 UTC = 9:00 AM ET  — opening lines snapshot (before sharp action)
#   13:00 UTC = 8:00 AM ET  — predictions + grading
#   23:00 UTC = 6:00 PM ET  — closing lines snapshot (post-injury-report)

on:
  schedule:
    - cron: '0 14 * * *'   # 9:00 AM ET — opening lines snapshot
    - cron: '0 13 * * *'   # 8:00 AM ET — predictions + grading
    - cron: '0 23 * * *'   # 6:00 PM ET — closing lines snapshot
  workflow_dispatch:         # manual trigger runs all three jobs

# ── Job 1: Opening lines snapshot (9 AM ET) ───────────────────────────────────
jobs:

  snapshot_opening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 14 * * *'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Snapshot opening lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python snapshot_opening_lines.py

      - name: Commit opening lines
        run: |
          git config user.name  "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add data/opening_lines_*.json
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Opening lines $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done


# ── Job 2: Grade + Predict (8 AM ET) ─────────────────────────────────────────
# CRITICAL: This job is INDEPENDENT — it does NOT depend on snapshot_opening.
# snapshot_opening failing must never cause predictions to be skipped.

  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # FIXED: removed 'needs: snapshot_opening' — that was causing silent skips
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 13 * * *'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Grade yesterday's predictions
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python grade.py
        continue-on-error: true

      - name: Generate today's predictions
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SKIP_SGPS: "1"
        run: python predict.py

      # HARD FAIL: predictions file must exist or the whole job fails visibly
      - name: Verify predictions were written
        run: |
          DATE=$(date -u +%Y-%m-%d)
          FILE="predictions/singles_${DATE}.json"
          if [ ! -f "$FILE" ]; then
            echo "FATAL: $FILE was not written — predictions failed"
            exit 1
          fi
          COUNT=$(python3 -c "import json; d=json.load(open('$FILE')); print(len(d.get('picks',d.get('singles',[]))))")
          echo "✓ Predictions written: $COUNT picks in $FILE"
          if [ "$COUNT" -eq "0" ]; then
            echo "WARNING: 0 picks written — check API keys and model files"
          fi

      - name: Commit predictions and graded results
        run: |
          git config user.name  "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add predictions/ graded/ -f
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Predictions $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done

      - name: Upload predictions to server via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          curl --ftp-create-dirs --max-time 30 --retry 3 \
            -u "$SFTP_USER:$SFTP_PASS" \
            -T "predictions/singles_${DATE}.json" \
            "ftp://$SFTP_HOST${SFTP_PATH}/singles_${DATE}.json"
          curl --ftp-create-dirs --max-time 30 --retry 3 \
            -u "$SFTP_USER:$SFTP_PASS" \
            -T "predictions/sgps_${DATE}.json" \
            "ftp://$SFTP_HOST${SFTP_PATH}/sgps_${DATE}.json"
          curl --ftp-create-dirs --max-time 30 --retry 3 \
            -u "$SFTP_USER:$SFTP_PASS" \
            -T "predictions/pmf_display_${DATE}.json" \
            "ftp://$SFTP_HOST${SFTP_PATH}/pmf_display_${DATE}.json"
          echo "✓ Predictions uploaded to server"


# ── Job 3: Closing lines snapshot (6 PM ET) ──────────────────────────────────

  snapshot_closing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 23 * * *'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Snapshot closing lines (post-injury-report)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python snapshot_closing_lines.py

      - name: Commit closing lines
        run: |
          git config user.name  "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add graded/closing_lines_*.json
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Closing lines $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done
