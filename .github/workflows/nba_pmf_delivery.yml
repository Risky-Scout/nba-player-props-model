name: NBA Player Props — Production Pipeline
run-name: >-
  NBA Player Props — ${{
    github.event_name == 'workflow_dispatch' && (
      inputs.stage == 'full_cycle'             && 'Full Pipeline (Manual)' ||
      inputs.stage == 'training'               && 'Model Training (Manual)' ||
      inputs.stage == 'model_chain'            && 'Train → Calibrate → Promote (Manual)' ||
      inputs.stage == 'model_chain_no_promote' && 'Train → Calibrate, No Promote (Manual)' ||
      inputs.stage == 'phase8'                 && 'PMF Calibration (Manual)' ||
      inputs.stage == 'phase13_context'        && 'Contextual Model Update (Manual)' ||
      inputs.stage == 'predict'                && 'Daily Predictions (Manual)' ||
      inputs.stage == 'delivery'               && 'Delivery Build (Manual)' ||
      inputs.stage == 'after_game'             && 'After-Game Scoring (Manual)' ||
      inputs.stage == 'verifiers'              && 'Delivery Verification (Manual)' ||
      inputs.stage == 'auto'                   && 'Auto (Manual Trigger)' ||
      inputs.stage
    ) ||
    github.event.schedule == '30 6 * * *'          && 'Score Previous Games (2:30 AM ET)' ||
    github.event.schedule == '30 7 * * *'          && 'Train & Calibrate Model (3:30 AM ET)' ||
    github.event.schedule == '30 12 * * *'         && 'Training Retry (8:30 AM ET)' ||
    github.event.schedule == '0 14 * * *'          && 'Generate Daily Predictions (10:00 AM ET)' ||
    github.event.schedule == '0 15 * * *'          && 'Publish Morning Odds (11:00 AM ET)' ||
    github.event.schedule == '30 15 * * *'         && 'Refresh Model — No Promote (11:30 AM ET)' ||
    github.event.schedule == '0 18 * * *'          && 'Refresh Odds — Afternoon (2:00 PM ET)' ||
    github.event.schedule == '30 18 * * *'         && 'Refresh Model — No Promote (2:30 PM ET)' ||
    github.event.schedule == '0 20 * * *'          && 'Refresh Odds — Late Afternoon (4:00 PM ET)' ||
    github.event.schedule == '30 21 * * *'         && 'Refresh Model — No Promote (5:30 PM ET)' ||
    github.event.schedule == '35 23 * * *'             && 'Pre-Game Lineup Check (7:35 PM ET)' ||
    github.event.schedule == '40,45,50,55 23 * * *'    && 'Near-Tip / Close-Lock Update (7:40–7:55 PM ET)' ||
    github.event.schedule == '5,10,15,20,25 0 * * *'   && 'Near-Tip / Close-Lock Update (8:05–8:25 PM ET)' ||
    github.event.schedule == '55 0 * * *'              && 'Final Close-Lock Snapshot (8:55 PM ET)' ||
    'Scheduled Run'
  }}

# Production pipeline for NBA player prop predictions.
# All scheduling decisions are owned by scripts/resolve_nba_pmf_schedule.py
# which determines: delivery_date, as_of_date, stage, mode, allow_promote.
#
# Hard rules:
# - No top-level workflow concurrency. Long training/Phase 13 runs
#   must not block WoO/Derek delivery. Each job carries its own
#   `concurrency.group` scoped to (stage, slate-date).
# - `deliveries/<date>/derek_forward_feed/derek_unique_props_summary.csv`
#   is hash-protected through the delivery job; any in-pipeline mutation
#   is a hard failure.
# - No market-superiority claim or champion promotion happens unless the
#   repo's existing calibration/market gates explicitly say it does.
# - Old workflows are NOT disabled here. They remain in place until this
#   consolidated workflow has passed a full production day.

on:
  schedule:
    # 06:30 UTC — after-game scoring of the PREVIOUS ET slate.
    - cron: "30 6 * * *"

    # Model-chain (training → Phase 8 → Phase 13 O/P/Q/R/S).
    # 07:30 UTC (3:30 AM ET) is the primary promote run — starts ~1 h after
    # after-game scoring (06:30 UTC) so training uses fully-settled game data.
    # Phase 8 (~3.5 h) + Phase 13 (~2.5 h) completes by ~13:30 UTC (9:30 AM ET),
    # 30 min before the 14:00 UTC morning prediction, ensuring every delivery
    # uses the model trained through the previous night's games.
    # 12:30 UTC is the backup promote retry if the 07:30 run fails early.
    # 15:30, 18:30, 21:30 UTC are post-cutoff retries (no promotion).
    - cron: "30 7 * * *"
    - cron: "30 12 * * *"
    - cron: "30 15 * * *"
    - cron: "30 18 * * *"
    - cron: "30 21 * * *"

    # 14:00 UTC — daily prediction (scripts/predict.py via
    # predictions_readiness_gate.py).
    - cron: "0 14 * * *"

    # WoO delivery windows.
    - cron: "0 15 * * *"
    - cron: "0 18 * * *"
    - cron: "0 20 * * *"

    # Derek near-lineup / close-lock candidate windows — playoffs schedule
    # (8:00 PM ET and 8:30 PM ET tip-offs). Each fire runs the resolver,
    # which valid-skips unless the slate tip time is within the pre-tip
    # window (35→11 min [derek_near_lineup] or 10→0 min [close_lock]).
    - cron: "35 23 * * *"           # Pre-Game Lineup Check (7:35 PM ET / 8:00 PM tip)
    - cron: "40,45,50,55 23 * * *"  # Near-Tip / Close-Lock Update (7:40–7:55 PM ET)
    - cron: "5,10,15,20,25 0 * * *" # Pre-Game + Near-Tip / Close-Lock (8:05–8:25 PM ET / 8:30 PM tip)
    - cron: "55 0 * * *"            # Final Close-Lock Snapshot (8:55 PM ET / 8:30 PM tip)

  workflow_dispatch:
    inputs:
      stage:
        description: "Pipeline stage"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - full_cycle
          - training
          - model_chain
          - model_chain_no_promote
          - phase8
          - phase13_context
          - predict
          - delivery
          - after_game
          - verifiers
      mode:
        description: "Delivery mode"
        required: false
        default: "derek_near_lineup"
        type: choice
        options:
          - morning
          - woo_morning_monetization
          - woo_afternoon_refresh
          - derek_near_lineup
          - close_lock
          - after_game
          - full_day
          - predict
          - model_chain
          - model_chain_no_promote
      delivery_date:
        description: "YYYY-MM-DD. Blank = America/New_York today."
        required: false
        default: ""
      as_of_date:
        description: "YYYY-MM-DD. Blank = America/New_York yesterday."
        required: false
        default: ""
      no_promote:
        description: "Block champion promotion (set true only for testing; default false = promote when gates pass)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      run_predict:
        description: "Run scripts/predict.py inside delivery stage"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_run:
        description: "Bypass delivery time-window gates for manual smoke tests/backfills"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      run_sgp_engine:
        description: "Run SGP Engine during delivery (opt-in; disabled by default until readiness gates pass)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write
  actions: read

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: src
  STAT_GRID_RECALIBRATION_MODEL_DIR: _stat_grid_delivery_calibration_optimizer/artifacts/models
  SOURCE_RECALIBRATION_MODEL_DIR: _stat_grid_delivery_calibration_optimizer/artifacts/models
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REQUIRE_DUNKS_AND_THREES: "1"
  DUNKS_AND_THREES_API_KEY: ${{ secrets.DUNKS_AND_THREES_API_KEY }}
  DUNKS_API_KEY: ${{ secrets.DUNKS_AND_THREES_API_KEY }}
  DNT_API_KEY: ${{ secrets.DUNKS_AND_THREES_API_KEY }}
  DUNKS_THREES_API_KEY: ${{ secrets.DUNKS_AND_THREES_API_KEY }}
  # SGP Engine is opt-in only. Default false until all readiness gates pass.
  # To enable: set ENABLE_SGP_ENGINE=true here OR pass run_sgp_engine=true
  # as a workflow_dispatch input. See docs/SGP_ENGINE_BUILD_PLAN.md §0C for
  # the full list of readiness gates that must pass before this becomes true.
  ENABLE_SGP_ENGINE: "false"

jobs:
  # ────────────────────────────────────────────────────────────────
  # resolve_context — single source of truth for every gate flag.
  # ────────────────────────────────────────────────────────────────
  resolve_context:
    name: Resolve Schedule & Date Context
    runs-on: ubuntu-latest
    outputs:
      delivery_date: ${{ steps.resolve.outputs.delivery_date }}
      as_of_date: ${{ steps.resolve.outputs.as_of_date }}
      stage: ${{ steps.resolve.outputs.stage }}
      mode: ${{ steps.resolve.outputs.mode }}
      run_predict: ${{ steps.resolve.outputs.run_predict }}
      run_training: ${{ steps.resolve.outputs.run_training }}
      run_phase8: ${{ steps.resolve.outputs.run_phase8 }}
      run_phase13: ${{ steps.resolve.outputs.run_phase13 }}
      run_delivery: ${{ steps.resolve.outputs.run_delivery }}
      run_after_game: ${{ steps.resolve.outputs.run_after_game }}
      run_verifiers: ${{ steps.resolve.outputs.run_verifiers }}
      allow_promote: ${{ steps.resolve.outputs.allow_promote }}
      force_run: ${{ steps.resolve.outputs.force_run }}
      valid_skip_reason: ${{ steps.resolve.outputs.valid_skip_reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # Phase 13U upstream tip-time recovery requires `pandas`/`pyarrow`
      # so the resolver's recovery hook can subprocess out to
      # `scripts/resolve_game_start_times.py` and let that script read
      # `predictions/all_props_<date>.parquet` as part of its cascade.
      # The resolver itself remains stdlib-only.
      - name: Install requirements (for tip-time recovery generator)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - id: resolve
        name: Resolve schedule/date/mode/gates (Python source of truth)
        env:
          # Exposed so the resolver's upstream tip-time recovery hook
          # (subprocess to scripts/resolve_game_start_times.py) can hit
          # the real BDL / Odds API endpoints when the cached
          # artifacts/live_schedule/<date>/game_start_times.json is
          # absent. The resolver itself does not consume these; only
          # the generator subprocess it spawns does.
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/resolve_nba_pmf_schedule.py \
            --event-name "${{ github.event_name }}" \
            --schedule "${{ github.event.schedule }}" \
            --manual-stage "${{ github.event.inputs.stage || '' }}" \
            --manual-mode "${{ github.event.inputs.mode || '' }}" \
            --manual-delivery-date "${{ github.event.inputs.delivery_date || '' }}" \
            --manual-as-of-date "${{ github.event.inputs.as_of_date || '' }}" \
            --manual-force-run "${{ github.event.inputs.force_run || 'false' }}" \
            --manual-no-promote "${{ github.event.inputs.no_promote || 'false' }}" \
            --github-output "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────
  # readiness — secrets preflight + champion-pointer verification.
  # ────────────────────────────────────────────────────────────────
  readiness:
    name: Preflight Checks
    runs-on: ubuntu-latest
    needs: resolve_context
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Valid-skip short-circuit
        if: needs.resolve_context.outputs.valid_skip_reason != ''
        run: |
          echo "::notice::valid_skip_reason=${{ needs.resolve_context.outputs.valid_skip_reason }} — downstream jobs gate on this and exit cleanly."

      - name: Required secrets preflight
        if: needs.resolve_context.outputs.valid_skip_reason == ''
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail

          if [ "${{ needs.resolve_context.outputs.run_after_game }}" = "true" ] && [ -z "${BDL_API_KEY:-}" ]; then
            echo "::error::BDL_API_KEY is required for after-game scoring."
            exit 1
          fi

          if [ "${{ needs.resolve_context.outputs.run_training }}" = "true" ] && [ -z "${BDL_API_KEY:-}" ]; then
            echo "::error::BDL_API_KEY is required for training/stat refresh."
            exit 1
          fi

          if [ "${{ needs.resolve_context.outputs.run_delivery }}" = "true" ] && [ -z "${ODDS_API_KEY:-}" ]; then
            echo "::warning::ODDS_API_KEY is empty; delivery may valid-skip or lack market coverage."
          fi

          if [ "${{ needs.resolve_context.outputs.run_predict }}" = "true" ] && [ -z "${ODDS_API_KEY:-}" ]; then
            echo "::warning::ODDS_API_KEY is empty; predict may valid-skip on no slate or partial market data."
          fi

      - name: Mode-specific secrets preflight (verify_secrets_preflight.py)
        if: needs.resolve_context.outputs.valid_skip_reason == ''
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ needs.resolve_context.outputs.run_training }}" = "true" ] || \
             [ "${{ needs.resolve_context.outputs.run_after_game }}" = "true" ]; then
            python3 scripts/verify_secrets_preflight.py --mode training
          fi
          if [ "${{ needs.resolve_context.outputs.run_predict }}" = "true" ] || \
             [ "${{ needs.resolve_context.outputs.run_delivery }}" = "true" ]; then
            python3 scripts/verify_secrets_preflight.py --mode daily --require-lineup-source
          fi

      - name: Compile-check critical pipeline scripts
        if: needs.resolve_context.outputs.valid_skip_reason == ''
        run: |
          set -euo pipefail
          python3 -m compileall -q \
            src/nba_props_model/models/sparse_hurdle.py \
            scripts/calibrate_pmf.py \
            scripts/build_combo_oof_pmfs_from_base_oof.py \
            scripts/fit_combo_pmf_calibrators.py \
            scripts/run_nightly_training_and_calibration.py \
            scripts/build_daily_pmf_delivery.py \
            scripts/publish_woo_public_export.py
          echo "::notice::All critical pipeline scripts compiled without SyntaxError"

      - name: Smoke-test sparse hurdle PMF path
        if: needs.resolve_context.outputs.valid_skip_reason == ''
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m pytest \
            tests/test_sparse_hurdle.py \
            tests/test_sparse_hurdle_tail_shape.py \
            -x -q --tb=short
          echo "::notice::Sparse hurdle PMF smoke tests passed"

      - name: Verify champion pointer
        if: needs.resolve_context.outputs.valid_skip_reason == ''
        run: |
          python3 scripts/verify_real_champion_pointer.py

  # ────────────────────────────────────────────────────────────────
  # Model chain: training + role/stat calibration.
  # ────────────────────────────────────────────────────────────────
  model_chain_training_calibration:
    name: Train & Calibrate Model
    runs-on: ubuntu-latest
    needs: [resolve_context, readiness]
    if: always() && needs.resolve_context.result == 'success' && needs.readiness.result == 'success' && needs.resolve_context.outputs.run_training == 'true' && needs.resolve_context.outputs.valid_skip_reason == ''
    timeout-minutes: 360
    concurrency:
      group: nba-pmf-model-chain-${{ needs.resolve_context.outputs.as_of_date }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7-day BDL backfill pattern transplanted from
      # `nightly_training_calibration.yml`. Walks back up to 7 days so a
      # multi-day BDL lag is still caught. `continue-on-error` lets the
      # resolver still halt cleanly on stale data downstream.
      - name: Pre-resolver settled player stats refresh (7-day BDL backfill)
        continue-on-error: true
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          set -euo pipefail
          ASOF="${{ needs.resolve_context.outputs.as_of_date }}"
          FROM_DATE=$(TZ=America/New_York date -d "$ASOF -6 days" +%Y-%m-%d 2>/dev/null \
                       || TZ=America/New_York date -v-7d -j -f %Y-%m-%d "$ASOF" +%Y-%m-%d)
          echo "Refreshing player box scores from=$FROM_DATE to=$ASOF"
          python3 scripts/backfill_player_game_stats_from_bdl.py \
            --from-date "$FROM_DATE" \
            --to-date "$ASOF" \
            || echo "::notice::BDL backfill exited non-zero; resolver will halt if data still stale"
          python3 scripts/verify_player_game_stats_freshness.py \
            --required-through-date "$ASOF" \
            || echo "::notice::player_game_stats freshness verifier failed; resolver will halt cleanly"

      - name: Commit refreshed player stats
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          git add data/player_game_stats.parquet \
                  artifacts/automation_health/player_game_stats_freshness_*.json \
                  artifacts/automation_health/player_game_stats_freshness_*.md \
                  artifacts/automation_health/player_game_stats_freshness_check_*.json \
                  2>/dev/null || true
          git diff --staged --quiet && echo "No parquet changes to commit" && exit 0
          git commit --author="Joseph Shackelford <josephshack@gmail.com>" \
            -m "Refresh settled player stats (NBA PMF Delivery model chain)"

          cleanup_rebase_state() {
            git rebase --abort || true
            rm -rf .git/rebase-merge .git/rebase-apply
          }

          sync_and_push() {
            local attempts="${1:-5}"
            for i in $(seq 1 "$attempts"); do
              cleanup_rebase_state
              git status --short || true

              if git pull --rebase --autostash origin main; then
                :
              else
                # A concurrent Phase 13AF/AE job may have written the same
                # per-date freshness JSON/MD files.  When the rebase conflicts
                # only on those files, skip the conflicting commit entirely
                # (the remote version is authoritative; our local copy is
                # redundant).  Any other conflict aborts and retries normally.
                while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
                  conflicts=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
                  [ -z "$conflicts" ] && break
                  non_freshness=$(echo "$conflicts" | grep -v "player_game_stats_freshness" || true)
                  if [ -z "$non_freshness" ]; then
                    git rebase --skip 2>/dev/null || { cleanup_rebase_state; break; }
                  else
                    cleanup_rebase_state; break
                  fi
                done
              fi

              if git push origin HEAD:main; then
                cleanup_rebase_state
                return 0
              fi

              cleanup_rebase_state
              sleep 10
            done
            return 1
          }

          sync_and_push 3

      - name: Preflight availability as-of table through delivery date
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          OUT="data/player_availability_asof.parquet"

          START_DATE="$(python3 scripts/availability_preflight_start_date.py --date "$D" --out "$OUT")"

          if [ -n "$START_DATE" ]; then
            python3 scripts/build_availability_table.py \
              --start-date "$START_DATE" \
              --end-date "$D" \
              --out "$OUT"
          fi

      - name: Verify source data alignment before training
        run: |
          set -euo pipefail
          ASOF="${{ needs.resolve_context.outputs.as_of_date }}"
          # Check player_game_stats and availability are aligned to as_of_date.
          # Omit --check-training-table: the table is built inside the
          # nightly training script (not before it).
          python3 scripts/verify_training_data_alignment.py \
            --as-of-date "$ASOF"

      - name: Run nightly training and role/stat calibration
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=(--as-of-date "${{ needs.resolve_context.outputs.as_of_date }}")

          # Promotion is gated by the resolver's `allow_promote`. If the
          # resolver says we cannot promote (post-14:30 UTC cutoff or
          # manual `no_promote=true`), force --no-promote here.
          if [ "${{ needs.resolve_context.outputs.allow_promote }}" != "true" ]; then
            ARGS+=("--no-promote")
          fi

          # model_chain is the real training path; pin this explicitly so
          # parser/default drift can never silently flip to dry-run mode.
          ARGS+=("--no-dry-run")

          python3 scripts/run_nightly_training_and_calibration.py "${ARGS[@]}"

      - name: Commit training/calibration artifacts
        run: |
          set -euo pipefail
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"

          git add \
            artifacts/models \
            artifacts/model_diagnostics \
            artifacts/docs \
            data/oof_pmfs.parquet \
            data/oof_combo_pmfs.parquet \
            data/oof_combo_pmfs.manifest.json \
            2>/dev/null || true

          # player_game_stats_freshness_* paths are owned exclusively by
          # "Commit refreshed player stats" above. Staging the whole
          # automation_health tree here caused add/add rebase conflicts
          # when concurrent scheduled runs both committed the same
          # per-date freshness files (run 26226082429).
          if [ -d artifacts/automation_health ]; then
            git add artifacts/automation_health/
            git reset HEAD -- \
              artifacts/automation_health/player_game_stats_freshness_*.json \
              artifacts/automation_health/player_game_stats_freshness_*.md \
              artifacts/automation_health/player_game_stats_freshness_check_*.json \
              2>/dev/null || true
          fi

          git diff --staged --quiet && exit 0

          git commit --author="Joseph Shackelford <josephshack@gmail.com>" \
            -m "NBA PMF Delivery: model chain ${{ needs.resolve_context.outputs.as_of_date }}"

          cleanup_rebase_state() {
            git rebase --abort || true
            rm -rf .git/rebase-merge .git/rebase-apply
          }

          sync_and_push() {
            local attempts="${1:-5}"
            for i in $(seq 1 "$attempts"); do
              cleanup_rebase_state
              git status --short || true

              if git pull --rebase --autostash origin main; then
                :
              else
                # A concurrent Phase 13AF/AE job may have written the same
                # per-date freshness JSON/MD files.  When the rebase conflicts
                # only on those files, skip the conflicting commit entirely
                # (the remote version is authoritative; our local copy is
                # redundant).  Any other conflict aborts and retries normally.
                while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
                  conflicts=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
                  [ -z "$conflicts" ] && break
                  non_freshness=$(echo "$conflicts" | grep -v "player_game_stats_freshness" || true)
                  if [ -z "$non_freshness" ]; then
                    git rebase --skip 2>/dev/null || { cleanup_rebase_state; break; }
                  else
                    cleanup_rebase_state; break
                  fi
                done
              fi

              if git push origin HEAD:main; then
                cleanup_rebase_state
                return 0
              fi

              cleanup_rebase_state
              sleep 10
            done
            return 1
          }

          sync_and_push 5

  # ────────────────────────────────────────────────────────────────
  # Phase 8 — PMF calibration, diagnostics, market evaluation.
  # Strict prerequisite: model chain must have SUCCEEDED.
  # ────────────────────────────────────────────────────────────────
  phase8_pmf_calibration_diagnostics_market_eval:
    name: PMF Calibration & Market Evaluation
    runs-on: ubuntu-latest
    needs: [resolve_context, readiness, model_chain_training_calibration]
    if: always() && needs.resolve_context.result == 'success' && needs.readiness.result == 'success' && needs.resolve_context.outputs.run_phase8 == 'true' && needs.resolve_context.outputs.valid_skip_reason == '' && needs.model_chain_training_calibration.result == 'success'
    timeout-minutes: 360
    concurrency:
      group: nba-pmf-phase8-${{ needs.resolve_context.outputs.as_of_date }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main || true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Phase 8 same-date idempotency check
        id: phase8_idempotency
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          ASOF="${{ needs.resolve_context.outputs.as_of_date }}"
          FORCE="${{ needs.resolve_context.outputs.force_run }}"

          if [ "$FORCE" = "true" ]; then
            echo "::notice::force_run=true — Phase 8 idempotency bypassed"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Phase 8 is complete when diagnostics meta and OOF PMFs exist for
          # this delivery_date and the calibration meta JSON is present.
          META="artifacts/docs/diagnostics_${D}.meta.json"
          OOF="data/oof_pmfs.parquet"
          CAL_META="artifacts/models/pmf_cal_meta.json"

          if [ -f "$META" ] && [ -f "$OOF" ] && [ -f "$CAL_META" ]; then
            echo "PHASE8_ALREADY_COMPLETE_FOR_AS_OF_DATE=$ASOF"
            echo "PHASE8_SKIPPED_IDEMPOTENT=true"
            echo "  Diagnostics meta: $META"
            echo "  OOF PMFs: $OOF"
            echo "  Calibration meta: $CAL_META"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Phase 8 outputs absent or incomplete — will run."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight availability as-of table through delivery date
        if: steps.phase8_idempotency.outputs.skip != 'true'
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          OUT="data/player_availability_asof.parquet"

          START_DATE="$(python3 scripts/availability_preflight_start_date.py --date "$D" --out "$OUT")"

          if [ -n "$START_DATE" ]; then
            python3 scripts/build_availability_table.py \
              --start-date "$START_DATE" \
              --end-date "$D" \
              --out "$OUT"
          fi

      - name: Build training table if absent or stale
        if: steps.phase8_idempotency.outputs.skip != 'true'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          ASOF="${{ needs.resolve_context.outputs.as_of_date }}"

          # Rebuild if absent OR if the existing table's max date != as_of_date.
          # File-existence alone is insufficient: a prior run that fetched through
          # a different date would leave a misaligned table on disk.
          NEED_BUILD=false
          if [ ! -s data/training_table.parquet ]; then
            echo "Training table absent — building."
            NEED_BUILD=true
          else
            ACTUAL_MAX=$(python3 - <<'PY'
          import pandas as pd
          df = pd.read_parquet("data/training_table.parquet", columns=["game_date"])
          print(df["game_date"].astype(str).str[:10].max() if not df.empty else "")
          PY
          )
            if [ "$ACTUAL_MAX" != "$ASOF" ]; then
              echo "Training table max=${ACTUAL_MAX} != as_of_date=${ASOF} — rebuilding."
              NEED_BUILD=true
            else
              echo "Training table max=${ACTUAL_MAX} == as_of_date=${ASOF} — reuse."
            fi
          fi

          if [ "$NEED_BUILD" = "true" ]; then
            python3 scripts/train.py --build-table-only --as-of-date "$ASOF"
          fi

          # Verify max date after build/reuse.
          FINAL_MAX=$(python3 - <<'PY'
          import pandas as pd
          df = pd.read_parquet("data/training_table.parquet", columns=["game_date"])
          print(df["game_date"].astype(str).str[:10].max() if not df.empty else "EMPTY")
          PY
          )
          if [ "$FINAL_MAX" != "$ASOF" ]; then
            echo "::error::Training table max date ${FINAL_MAX} != expected ${ASOF} after build"
            exit 1
          fi
          echo "Training table max date verified: ${FINAL_MAX} == ${ASOF}"

      - name: Verify training data alignment before Phase 8 calibration
        if: steps.phase8_idempotency.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ASOF="${{ needs.resolve_context.outputs.as_of_date }}"
          python3 scripts/verify_training_data_alignment.py \
            --as-of-date "$ASOF" \
            --check-training-table

      - name: Verify Phase 8 training table freshness and prob_active coverage
        if: steps.phase8_idempotency.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 scripts/verify_phase8_training_table_freshness.py \
            --as-of-date "${{ needs.resolve_context.outputs.as_of_date }}"

      - name: Run Phase 8 PMF calibration folds + OOF aggregation + combo PMFs
        if: steps.phase8_idempotency.outputs.skip != 'true'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/folds

          MAX_FOLDS=4
          for FOLD in $(seq 1 "$MAX_FOLDS"); do
            python3 scripts/calibrate_pmf.py \
              --fold-index "$FOLD" \
              --max-folds "$MAX_FOLDS" \
              --emit-fold-oof "artifacts/folds/fold_${FOLD}.parquet" \
              --skip-final-fit \
              --allowed-stats pts,reb,ast,tov,fg3m,stl,blk
          done

          python3 scripts/calibrate_pmf.py \
            --aggregate-mode \
            --aggregate-oofs artifacts/folds/

          python3 scripts/build_combo_oof_pmfs_from_base_oof.py \
            --in data/oof_pmfs.parquet \
            --out data/oof_combo_pmfs.parquet \
            --manifest data/oof_combo_pmfs.manifest.json \
            --as-of-date "${{ needs.resolve_context.outputs.as_of_date }}" \
            --n-draws 20000

          PYTHONPATH=src python3 scripts/fit_combo_pmf_calibrators.py \
            --oof data/oof_combo_pmfs.parquet

          # ── Self-healing calibration loop with recency weighting ──
          # Runs after calibrate_pmf --aggregate-mode overwrites pmf_cal_role_*.pkl.
          PHASE8_DATE="${{ needs.resolve_context.outputs.delivery_date }}"
          DELIVERY_YEAR=$(date -d "$PHASE8_DATE" +%Y 2>/dev/null || python3 -c "print('$PHASE8_DATE'[:4])")
          DELIVERY_MONTH=$(date -d "$PHASE8_DATE" +%-m 2>/dev/null || python3 -c "print(int('$PHASE8_DATE'[5:7]))")
          # Use shorter halflife during playoffs for faster adaptation to distribution shifts
          if [ "$DELIVERY_MONTH" -ge 4 ] && [ "$DELIVERY_MONTH" -le 6 ]; then
            HALFLIFE=14
          else
            HALFLIFE=28
          fi
          echo "Calibration halflife: ${HALFLIFE} days (month=$DELIVERY_MONTH)"

          # Round 1: evaluate calibration quality
          python3 scripts/evaluate_new_calibrators_oof.py \
            || echo "::warning::Calibrator OOF evaluation failed — using calibrate_pmf output as-is"

          # Refit combo stats pa/pr/ra/pra with recency weighting (calibrate_pmf only covers single stats)
          python3 scripts/refit_pmf_calibrators_from_oof.py \
            --oof data/oof_stat_pmf_predictions.parquet \
            --oof-combo data/oof_combo_pmfs.parquet \
            --stats pa,pr,ra,pra \
            --fold-days 28 \
            --min-train-days 56 \
            --halflife-days "$HALFLIFE" \
            || echo "::warning::Combo calibrator refit failed — using fit_combo_pmf_calibrators output"

          # Round 2: if calibration needs improvement, re-run all single stats with tighter parameters
          CAL_STATUS=$(python3 -c 'import json,pathlib; f=pathlib.Path("reports/calibration_gate_status.json"); print(json.loads(f.read_text()).get("overall_status","ok") if f.exists() else "ok")' 2>/dev/null || echo "ok")
          if [ "$CAL_STATUS" = "needs_recal" ]; then
            echo "Calibration needs improvement — targeted refit with halflife-days=$HALFLIFE"
            python3 scripts/refit_pmf_calibrators_from_oof.py \
              --oof data/oof_stat_pmf_predictions.parquet \
              --fold-days 14 \
              --min-train-days 42 \
              --halflife-days "$HALFLIFE" \
              || echo "::warning::Targeted single-stat refit failed — keeping round-1 calibrators"
            python3 scripts/evaluate_new_calibrators_oof.py \
              || echo "::warning::Round-2 calibrator evaluation failed"
          else
            echo "Calibration status=$CAL_STATUS — no additional refit needed"
          fi
          # ── Sparse stat hurdle recalibration — playoff-window aware ──
          # Playoff window: April 15 through June 30
          if [ "$DELIVERY_MONTH" -ge 4 ] && [ "$DELIVERY_MONTH" -le 6 ]; then
            PLAYOFF_START=$(python3 -c 'import sys,pathlib; sys.path.insert(0,"scripts"); from evaluate_playoff_calibration import _detect_playoff_start; print(_detect_playoff_start(pathlib.Path("data/player_game_stats.parquet"), '"$DELIVERY_YEAR"'))' 2>/dev/null || echo "${DELIVERY_YEAR}-04-19")
            echo "Playoff window detected (month=$DELIVERY_MONTH) — refitting sparse hurdle from $PLAYOFF_START"
            python3 scripts/fit_sparse_stat_hurdle_recalibration.py \
              --oof data/oof_stat_pmf_predictions.parquet \
              --start-date "$PLAYOFF_START" \
              --min-n 200 \
              --shrink-k 500 \
              || echo "::warning::Sparse hurdle playoff refit failed — using committed offsets"
          else
            echo "Regular season (month=$DELIVERY_MONTH) — refitting sparse hurdle on full OOF"
            python3 scripts/fit_sparse_stat_hurdle_recalibration.py \
              --oof data/oof_stat_pmf_predictions.parquet \
              || echo "::warning::Sparse hurdle regular season refit failed — using committed offsets"
          fi

          # ── TASK 3: PMF mean shift repair pipeline ──
          # Builds fresh event loss rows for recent window, then fits mean shift manifest.
          D_LABEL="$PHASE8_DATE"
          WINDOW_START=$(date -d "$D_LABEL - 42 days" +%Y-%m-%d 2>/dev/null \
            || python3 -c "from datetime import date, timedelta; d=date.fromisoformat('$D_LABEL'); print((d - timedelta(days=42)).isoformat())")
          python3 scripts/build_event_market_loss_rows.py \
            --start-date "$WINDOW_START" \
            --end-date "$D_LABEL" \
            --include-ineligible \
            || echo "::warning::Event market loss rows build failed — mean shift manifest may be stale"

          LEDGER_DIR="artifacts/model_diagnostics/market_superiority_repair_${D_LABEL}"
          if python3 scripts/build_stat_role_market_superiority_report.py \
              --date "$D_LABEL" \
              --include-ineligible \
              --min-scored-rows 50 \
              --min-market-joined-rows 50 \
              2>/dev/null; then
            if [ -f "${LEDGER_DIR}/repair_ledger.csv" ]; then
              python3 scripts/fit_pmf_mean_shift_repair.py \
                --label "$D_LABEL" \
                --ledger "${LEDGER_DIR}/repair_ledger.csv" \
                || echo "::warning::PMF mean shift repair fit failed"
            else
              echo "::warning::Repair ledger not found at ${LEDGER_DIR}/repair_ledger.csv — skipping mean shift fit"
            fi
          else
            echo "::warning::Market superiority report failed — mean shift manifest not updated"
          fi

          # Auto-select and stage the latest mean shift manifest
          LATEST_MANIFEST=$(python3 scripts/resolve_mean_shift_manifest_path.py 2>/dev/null || echo "")
          if [ -n "$LATEST_MANIFEST" ]; then
            echo "Latest mean shift manifest: $LATEST_MANIFEST"
            git add "$LATEST_MANIFEST" 2>/dev/null || true
          fi

      - name: Run diagnostics and market-eval gates (no unexplained NaNs)
        if: steps.phase8_idempotency.outputs.skip != 'true'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"

          python3 scripts/run_diagnostics.py \
            --run-date "$D" \
            --require-market-eval \
            --allow-provisional-block \
            --start-date 2026-04-01 \
            --end-date "$D" \
            --snapshot-substr close_or_lock

          python3 scripts/verify_no_unexplained_calibration_nans.py \
            --meta "artifacts/docs/diagnostics_${D}.meta.json"

          python3 scripts/verify_role_bucket_contract.py --date "$D"
          python3 scripts/verify_combo_role_calibration_contract.py || true

          # Rebuild the 12-stat x 6-role-bucket calibration matrix (includes ra).
          # This must run after combo PMF calibrators are fit so all 12 calibrators exist.
          PYTHONPATH=src python3 scripts/build_m6_3_stat_role_calibration_report.py \
            --run-date "$D" \
            || echo "::warning::build_m6_3_stat_role_calibration_report.py failed — matrix may be stale"

          # Run playoff vs regular-season calibration drift evaluation.
          # Outputs reports/playoff_calibration_summary.json and CSVs.
          PYTHONPATH=src python3 scripts/evaluate_playoff_calibration.py \
            --output-dir reports/ \
            || echo "::warning::evaluate_playoff_calibration.py failed — calibration report may be stale"

      - name: Write fresh delivery model pointer
        if: steps.phase8_idempotency.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ASOF="${{ needs.resolve_context.outputs.as_of_date }}"
          # Write (or advance) fresh_delivery_model_pointer.json.
          # Market gate failures are treated as diagnostics — this pointer
          # advances as long as calibration artifacts exist and PMF validity passes.
          python3 scripts/write_fresh_delivery_pointer.py --as-of-date "$ASOF" \
            || echo "::warning::write_fresh_delivery_pointer.py exited non-zero — fresh pointer not advanced"

      - name: Commit Phase 8 artifacts
        run: |
          set -euo pipefail
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"

          git add \
            artifacts/models/pmf_cal_*.pkl \
            artifacts/models/pmf_cal_role_*.pkl \
            artifacts/models/pmf_cal_meta.json \
            artifacts/docs \
            artifacts/model_diagnostics \
            artifacts/models/sparse_hurdle_offsets.json \
            artifacts/models/pmf_mean_shift_repair_*.json \
            data/oof_pmfs.parquet \
            data/oof_combo_pmfs.parquet \
            data/oof_combo_pmfs.manifest.json \
            2>/dev/null || true
          # Always try to commit the fresh delivery pointer and new m6_3 matrix
          # (force-add in case gitignore interferes with registry/)
          git add -f artifacts/models/registry/fresh_delivery_model_pointer.json 2>/dev/null || true
          # m6_3 matrix and meta are already under artifacts/docs (added above) but
          # ensure they're staged even if the glob missed them
          git add artifacts/docs/m6_3_stat_role_calibration_matrix_*.csv \
                  artifacts/docs/m6_3_stat_role_calibration_report_*.meta.json \
                  artifacts/docs/m6_3_stat_role_calibration_report_*.md \
                  2>/dev/null || true
          # Playoff calibration drift reports (updated every training run)
          git add reports/playoff_calibration_summary.json \
                  reports/playoff_calibration_by_stat.csv \
                  reports/playoff_calibration_by_role.csv \
                  reports/new_calibrator_oof_evaluation.csv \
                  2>/dev/null || true

          # Same freshness ownership rule as model-chain commit above.
          if [ -d artifacts/automation_health ]; then
            git add artifacts/automation_health/
            git reset HEAD -- \
              artifacts/automation_health/player_game_stats_freshness_*.json \
              artifacts/automation_health/player_game_stats_freshness_*.md \
              artifacts/automation_health/player_game_stats_freshness_check_*.json \
              2>/dev/null || true
          fi

          git diff --staged --quiet && exit 0

          git commit --author="Joseph Shackelford <josephshack@gmail.com>" \
            -m "NBA PMF Delivery: phase8 calibration diagnostics ${{ needs.resolve_context.outputs.delivery_date }}"

          cleanup_rebase_state() {
            git rebase --abort || true
            rm -rf .git/rebase-merge .git/rebase-apply
          }

          sync_and_push() {
            local attempts="${1:-5}"
            for i in $(seq 1 "$attempts"); do
              cleanup_rebase_state
              git status --short || true

              if git pull --rebase --autostash origin main; then
                :
              else
                # A concurrent Phase 13AF/AE job may have written the same
                # per-date freshness JSON/MD files.  When the rebase conflicts
                # only on those files, skip the conflicting commit entirely
                # (the remote version is authoritative; our local copy is
                # redundant).  Any other conflict aborts and retries normally.
                while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
                  conflicts=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
                  [ -z "$conflicts" ] && break
                  non_freshness=$(echo "$conflicts" | grep -v "player_game_stats_freshness" || true)
                  if [ -z "$non_freshness" ]; then
                    git rebase --skip 2>/dev/null || { cleanup_rebase_state; break; }
                  else
                    cleanup_rebase_state; break
                  fi
                done
              fi

              if git push origin HEAD:main; then
                cleanup_rebase_state
                return 0
              fi

              cleanup_rebase_state
              sleep 10
            done
            return 1
          }

          sync_and_push 5

  # ────────────────────────────────────────────────────────────────
  # Phase 13 O/P/Q/R/S — live-context + contextual lineup chain.
  # Strict prerequisite: Phase 8 must have SUCCEEDED.
  # Order is locked: 13O → 13P → 13Q → 13R → 13S.
  # ────────────────────────────────────────────────────────────────
  phase13_live_context_contextual_lineup:
    name: Train Contextual Model & Promote
    runs-on: ubuntu-latest
    needs: [resolve_context, readiness, phase8_pmf_calibration_diagnostics_market_eval]
    if: always() && needs.resolve_context.result == 'success' && needs.readiness.result == 'success' && needs.resolve_context.outputs.run_phase13 == 'true' && needs.resolve_context.outputs.valid_skip_reason == '' && (needs.phase8_pmf_calibration_diagnostics_market_eval.result == 'success' || needs.phase8_pmf_calibration_diagnostics_market_eval.result == 'skipped')
    timeout-minutes: 240
    concurrency:
      group: nba-pmf-phase13-${{ needs.resolve_context.outputs.as_of_date }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main || true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Phase 13 same-date idempotency check
        id: phase13_idempotency
        run: |
          set -euo pipefail
          ASOF="${{ needs.resolve_context.outputs.as_of_date }}"
          FORCE="${{ needs.resolve_context.outputs.force_run }}"

          CTX_DIR="artifacts/models/challengers/${ASOF}_contextual"
          DL_DIR="artifacts/models/challengers/${ASOF}_direct_lineup_contextual"

          if [ "$FORCE" = "true" ]; then
            echo "::notice::force_run=true — Phase 13 idempotency bypassed"
            echo "skip_training=false" >> "$GITHUB_OUTPUT"
            echo "skip_promotion=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine if both challenger dirs already exist (training already ran)
          if [ -d "$CTX_DIR" ] && [ -d "$DL_DIR" ]; then
            echo "PHASE13_ALREADY_COMPLETE_FOR_AS_OF_DATE=$ASOF"
            echo "skip_training=true" >> "$GITHUB_OUTPUT"

            # Check if champion pointer in origin/main already reflects this date
            ORIGIN_CTX=$(python3 -c "import json; p=json.load(open('artifacts/models/registry/champion_pointer.json')); print(p.get('contextual_trained_through_date') or '')" 2>/dev/null || echo "")

            if [ "$ORIGIN_CTX" = "$ASOF" ]; then
              echo "PHASE13_SKIPPED_IDEMPOTENT=true"
              echo "  Champion pointer already points to $ASOF contextual challenger"
              echo "skip_promotion=true" >> "$GITHUB_OUTPUT"
            else
              # Check if promotion_decision says promoted but pointer not updated
              for PDIR in "$DL_DIR" "$CTX_DIR"; do
                if [ -f "$PDIR/promotion_decision.json" ]; then
                  PDONE=$(python3 -c "import json; p=json.load(open('$PDIR/promotion_decision.json')); print(str(p.get('promoted',False)).lower())" 2>/dev/null || echo "false")
                  if [ "$PDONE" = "true" ]; then
                    echo "PHASE13_PROMOTION_PERSISTENCE_FAIL"
                    echo "  promotion_decision.json says promoted=true for $PDIR"
                    echo "  but champion_pointer.json contextual_trained_through_date=$ORIGIN_CTX"
                    echo "  Skipping training, will retry promotion + commit."
                    echo "skip_promotion=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                fi
              done
              echo "  Challenger dirs exist; promotion not yet done — will run promotion."
              echo "skip_promotion=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Phase 13 challenger dirs absent — will train."
            echo "skip_training=false" >> "$GITHUB_OUTPUT"
            echo "skip_promotion=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Phase 13O — live-context training dataset
        if: steps.phase13_idempotency.outputs.skip_training != 'true'
        run: |
          set -euo pipefail
          ASOF="${{ needs.resolve_context.outputs.as_of_date }}"

          python3 scripts/build_live_context_training_dataset.py \
            --as-of-date "$ASOF" \
            --start-date 2023-10-24

          python3 scripts/verify_live_context_feature_training.py
          python3 scripts/verify_live_context_pmf_sensitivity.py
          python3 scripts/_phase13o_check_no_leakage.py
          python3 scripts/_phase13o_record_derek_readiness.py

      - name: Phase 13P — live-context challenger
        if: steps.phase13_idempotency.outputs.skip_training != 'true'
        run: |
          set -euo pipefail
          ASOF="${{ needs.resolve_context.outputs.as_of_date }}"

          python3 scripts/train_live_context_challenger.py \
            --as-of-date "$ASOF"

          python3 scripts/verify_live_context_feature_training.py \
            --feature-set-id phase13p_lineup_injury_driver_v1
          python3 scripts/verify_live_context_pmf_sensitivity.py
          python3 scripts/verify_phase13p_no_leakage.py
          python3 scripts/verify_phase13p_validation_gates.py
          python3 scripts/verify_phase13l_no_breakage.py

      - name: Phase 13Q — contextual challenger
        if: steps.phase13_idempotency.outputs.skip_training != 'true'
        run: |
          set -euo pipefail
          ASOF="${{ needs.resolve_context.outputs.as_of_date }}"

          python3 scripts/train_contextual_challenger.py \
            --as-of-date "$ASOF"

          python3 scripts/verify_live_context_feature_training.py \
            --feature-set-id phase13q_contextual_pmf_engine_v1
          python3 scripts/verify_live_context_pmf_sensitivity.py
          python3 scripts/verify_phase13p_no_leakage.py
          python3 scripts/verify_phase13p_validation_gates.py
          python3 scripts/verify_phase13l_no_breakage.py

      - name: Phase 13R — contextual deployment verification (+ gated promotion)
        if: steps.phase13_idempotency.outputs.skip_training != 'true' || steps.phase13_idempotency.outputs.skip_promotion != 'true'
        run: |
          set -euo pipefail
          ASOF="${{ needs.resolve_context.outputs.as_of_date }}"

          python3 scripts/_phase13r_write_state_audit.py --as-of-date "$ASOF"
          python3 scripts/verify_contextual_feature_lists.py
          python3 scripts/verify_contextual_predict_path.py
          python3 scripts/verify_contextual_pmf_sensitivity.py
          python3 scripts/verify_phase13q_no_leakage.py
          python3 scripts/verify_phase13l_no_breakage.py

          if [ "${{ needs.resolve_context.outputs.allow_promote }}" = "true" ] && \
             [ "${{ steps.phase13_idempotency.outputs.skip_promotion }}" != "true" ]; then
            python3 scripts/promote_contextual_challenger.py
            python3 scripts/verify_phase13r_deployment.py
          elif [ "${{ steps.phase13_idempotency.outputs.skip_promotion }}" = "true" ]; then
            echo "::notice::Phase 13R promotion skipped — champion already at $ASOF"
          else
            echo "::notice::allow_promote!=true — skipping promote_contextual_challenger.py"
          fi

      - name: Phase 13S — direct-lineup contextual PMF (+ gated promotion)
        if: steps.phase13_idempotency.outputs.skip_training != 'true' || steps.phase13_idempotency.outputs.skip_promotion != 'true'
        run: |
          set -euo pipefail
          ASOF="${{ needs.resolve_context.outputs.as_of_date }}"

          if [ "${{ steps.phase13_idempotency.outputs.skip_training }}" != "true" ]; then
            python3 scripts/_phase13s_write_baseline_audit.py
            python3 scripts/build_direct_lineup_training_dataset.py --as-of-date "$ASOF"
            python3 scripts/train_direct_lineup_contextual_challenger.py --as-of-date "$ASOF"
            python3 scripts/verify_direct_lineup_feature_lists.py
            python3 scripts/verify_direct_lineup_pmf_sensitivity.py
            python3 scripts/verify_phase13s_validation_gates.py
            python3 scripts/verify_phase13s_no_leakage.py
            python3 scripts/verify_phase13l_no_breakage.py
          else
            echo "::notice::Phase 13S training skipped — challenger dir already exists for $ASOF"
            # Still run verifiers to confirm artifacts are intact
            python3 scripts/verify_direct_lineup_feature_lists.py
            python3 scripts/verify_direct_lineup_pmf_sensitivity.py
          fi

          if [ "${{ needs.resolve_context.outputs.allow_promote }}" = "true" ] && \
             [ "${{ steps.phase13_idempotency.outputs.skip_promotion }}" != "true" ]; then
            python3 scripts/promote_direct_lineup_challenger.py
            python3 scripts/verify_phase13s_deployment.py
          elif [ "${{ steps.phase13_idempotency.outputs.skip_promotion }}" = "true" ]; then
            echo "::notice::Phase 13S promotion skipped — champion already at $ASOF"
          else
            echo "::notice::allow_promote!=true — skipping promote_direct_lineup_challenger.py"
          fi

          # Post-Phase13S contextual reverification (brief Phase 8 closer).
          python3 scripts/verify_contextual_feature_lists.py
          python3 scripts/verify_contextual_predict_path.py
          python3 scripts/verify_contextual_pmf_sensitivity.py
          python3 scripts/verify_phase13q_no_leakage.py

          python3 scripts/run_phase13s_after_game_scoring.py \
            --delivery-date "$ASOF" || true

      - name: Commit Phase 13 artifacts
        run: |
          set -euo pipefail
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"

          # ── Pre-add diagnostics ────────────────────────────────────────
          echo "::group::Phase13-commit-diagnostic"
          echo "--- champion_pointer.json on-disk state ---"
          python3 -c "import json; p=json.load(open('artifacts/models/registry/champion_pointer.json')); [print(k+':',p.get(k)) for k in ['champion_model_id','feature_set_id','contextual_trained_through_date','contextual_challenger_dir','promoted_at_utc']]" || echo "ERROR reading champion_pointer.json"
          echo "--- git status before add ---"
          git status --short artifacts/models/registry/ artifacts/models/challengers/ \
            artifacts/phase13r/ artifacts/phase13s/ || true
          echo "--- challenger dirs ---"
          ls artifacts/models/challengers/ | tail -10
          echo "--- git check-ignore champion_pointer.json ---"
          git check-ignore -v artifacts/models/registry/champion_pointer.json \
            && echo "::warning::champion_pointer.json IS gitignored!" \
            || echo "champion_pointer.json is NOT gitignored (good)"
          echo "::endgroup::"

          # ── Clean up any lingering rebase state before staging ─────────
          git rebase --abort 2>/dev/null || true
          rm -rf .git/rebase-merge .git/rebase-apply

          # ── Determine whether promotion actually succeeded ─────────────
          PROMOTION_DONE=false
          PROMOTED_MODEL_ID=""
          # Only detect promotion if Phase 13 actually ran this turn (not idempotently skipped).
          # When skip_promotion=true the promotion was already committed in a prior run;
          # reading promoted=true from a stale promotion_decision.json would falsely set
          # PROMOTION_DONE=true and then fail on no-staged-changes.
          SKIP_PROMO="${{ steps.phase13_idempotency.outputs.skip_promotion }}"
          if [ "$SKIP_PROMO" != "true" ]; then
            for PDIR in \
              "$(ls -d artifacts/models/challengers/*_direct_lineup_contextual 2>/dev/null | sort | tail -1)" \
              "$(ls -d artifacts/models/challengers/*_contextual 2>/dev/null | grep -v direct_lineup | sort | tail -1)"; do
              [ -z "$PDIR" ] && continue
              if [ -f "$PDIR/promotion_decision.json" ]; then
                PDONE=$(python3 -c "import json; p=json.load(open('$PDIR/promotion_decision.json')); print(str(p.get('promoted',False)).lower())" 2>/dev/null || echo "false")
                if [ "$PDONE" = "true" ]; then
                  PROMOTION_DONE=true
                  PROMOTED_MODEL_ID=$(python3 -c "import json; p=json.load(open('$PDIR/promotion_decision.json')); print(p.get('champion_model_id','unknown'))" 2>/dev/null || echo "unknown")
                  echo "Promotion confirmed: $PROMOTED_MODEL_ID from $PDIR"
                  break
                fi
              fi
            done
          else
            echo "Phase 13 promotion was idempotently skipped (already committed) — PROMOTION_DONE stays false"
          fi

          # ── Stage Phase 13 artifacts ───────────────────────────────────
          # Optional large artifacts (ok if absent or gitignored)
          git add data/live_context_features.parquet 2>/dev/null || true
          git add artifacts/phase13o artifacts/phase13p artifacts/phase13q \
                  artifacts/phase13r artifacts/phase13s 2>/dev/null || true
          git add artifacts/models/challengers 2>/dev/null || true
          # Glob expansions may match nothing — suppress only the missing-path error
          git add artifacts/models/champion/v_phase13r_* 2>/dev/null || true
          git add artifacts/models/champion/v_phase13s_* 2>/dev/null || true
          # Promotion log (ok if absent)
          git add artifacts/models/registry/promotion_log.csv 2>/dev/null || true
          # Champion pointer: explicit force-add — this must never be gitignored
          git add -f artifacts/models/registry/champion_pointer.json
          # Fresh delivery pointer: also force-add (market gates are soft)
          git add -f artifacts/models/registry/fresh_delivery_model_pointer.json 2>/dev/null || true

          # ── Post-add diagnostics ───────────────────────────────────────
          echo "::group::Phase13-staged-diagnostic"
          echo "--- git diff --staged --name-status ---"
          git diff --staged --name-status || true
          echo "--- champion_pointer.json staged diff ---"
          git diff --staged -- artifacts/models/registry/champion_pointer.json || true
          echo "::endgroup::"

          # ── Guard: if promotion succeeded, staged changes are required ──
          if git diff --staged --quiet; then
            if [ "$PROMOTION_DONE" = "true" ]; then
              # A concurrent run may have already committed the same champion pointer.
              # If the on-disk pointer already reflects this as_of_date, that is an
              # idempotent success — not a failure.
              POINTER_DATE=$(python3 -c "import json; p=json.load(open('artifacts/models/registry/champion_pointer.json')); print(p.get('contextual_trained_through_date') or '')" 2>/dev/null || echo "")
              ASOF_EXPECTED="${{ needs.resolve_context.outputs.as_of_date }}"
              if [ "$POINTER_DATE" = "$ASOF_EXPECTED" ]; then
                echo "::notice::PHASE13_PROMOTION_IDEMPOTENT — champion_pointer already at $ASOF_EXPECTED (concurrent run committed first)"
                echo "PHASE13_COMMIT_IDEMPOTENT_SUCCESS"
                exit 0
              fi
              echo "::error::PHASE13_PROMOTION_PERSISTENCE_FAIL_NO_STAGED_CHANGES"
              echo "  Promotion of $PROMOTED_MODEL_ID was reported successful"
              echo "  but git add produced no staged changes for champion_pointer.json."
              echo "  This means the on-disk champion_pointer.json matches HEAD,"
              echo "  which should not be possible after a contextual promotion."
              echo "  champion_pointer contextual_trained_through_date=$POINTER_DATE expected=$ASOF_EXPECTED"
              exit 1
            else
              echo "::notice::Phase13 commit: no staged changes — promotion was blocked or skipped (expected)"
              echo "PHASE13_COMMIT_SKIPPED_NO_PROMOTION"
              exit 0
            fi
          fi

          git commit --author="Joseph Shackelford <josephshack@gmail.com>" \
            -m "NBA PMF Delivery: phase13 context chain ${{ needs.resolve_context.outputs.as_of_date }}"

          cleanup_rebase_state() {
            git rebase --abort || true
            rm -rf .git/rebase-merge .git/rebase-apply
          }

          sync_and_push() {
            local attempts="${1:-5}"
            for i in $(seq 1 "$attempts"); do
              cleanup_rebase_state
              git status --short || true

              if git pull --rebase --autostash origin main; then
                :
              else
                # A concurrent Phase 13AF/AE job may have written the same
                # per-date freshness JSON/MD files.  When the rebase conflicts
                # only on those files, skip the conflicting commit entirely
                # (the remote version is authoritative; our local copy is
                # redundant).  Any other conflict aborts and retries normally.
                while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
                  conflicts=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
                  [ -z "$conflicts" ] && break
                  non_freshness=$(echo "$conflicts" | grep -v "player_game_stats_freshness" || true)
                  if [ -z "$non_freshness" ]; then
                    git rebase --skip 2>/dev/null || { cleanup_rebase_state; break; }
                  else
                    cleanup_rebase_state; break
                  fi
                done
              fi

              if git push origin HEAD:main; then
                cleanup_rebase_state
                # ── Post-push verification: confirm pointer persisted ──────
                git fetch origin main --quiet
                LOCAL_CTX=$(python3 -c "import json; p=json.load(open('artifacts/models/registry/champion_pointer.json')); print(p.get('contextual_trained_through_date') or p.get('trained_through_date') or 'missing')" 2>/dev/null || echo "missing")
                ORIGIN_CTX=$(git show origin/main:artifacts/models/registry/champion_pointer.json 2>/dev/null | python3 -c "import json,sys; p=json.load(sys.stdin); print(p.get('contextual_trained_through_date') or p.get('trained_through_date') or 'missing')" 2>/dev/null || echo "missing")
                if [ "$LOCAL_CTX" = "$ORIGIN_CTX" ] && [ "$LOCAL_CTX" != "missing" ]; then
                  echo "PHASE13_CHAMPION_POINTER_PERSISTED_TO_ORIGIN_MAIN"
                  echo "  contextual_trained_through_date=$LOCAL_CTX"
                else
                  echo "::error::PHASE13_PROMOTION_PUSH_VERIFY_FAIL"
                  echo "  local=$LOCAL_CTX origin/main=$ORIGIN_CTX"
                  exit 1
                fi
                return 0
              fi

              cleanup_rebase_state
              sleep 10
            done
            return 1
          }

          sync_and_push 5

  # ────────────────────────────────────────────────────────────────
  # Predict daily — 14:00 UTC cron + manual stage=predict.
  # ────────────────────────────────────────────────────────────────
  predict_daily:
    name: Generate Daily Predictions
    runs-on: ubuntu-latest
    needs: [resolve_context, readiness]
    if: always() && needs.resolve_context.result == 'success' && needs.readiness.result == 'success' && needs.resolve_context.outputs.run_predict == 'true' && needs.resolve_context.outputs.valid_skip_reason == ''
    timeout-minutes: 90
    concurrency:
      group: nba-pmf-predict-${{ needs.resolve_context.outputs.delivery_date }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Pull latest origin/main + verify champion freshness
        run: |
          set -euo pipefail
          git pull --rebase origin main || echo "::warning::git pull failed — using checkout SHA"
          # H4: verify champion_pointer.json is current (not stale)
          CTX_DATE=$(python3 -c "import json; p=json.load(open('artifacts/models/registry/champion_pointer.json')); print(p.get('contextual_trained_through_date') or p.get('trained_through_date') or 'MISSING')" 2>/dev/null || echo "FILE_MISSING")
          AS_OF="${{ needs.resolve_context.outputs.as_of_date }}"
          echo "H4_CHAMPION_CHECK: champion contextual_trained_through_date=${CTX_DATE} as_of_date=${AS_OF}"
          if [ "$CTX_DATE" = "$AS_OF" ]; then
            echo "H4_PASS: champion pointer is fresh for ${AS_OF}"
          else
            echo "::warning::H4_STALE: champion_pointer.json shows ${CTX_DATE} but expected ${AS_OF} — Phase 13 may not have completed yet"
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Predictions readiness gate (force-run if requested)
        id: predict_gate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          ARGS=(
            --date "$D"
            --predict-cron-hour-utc 14
            --mode "predict"
          )
          if [ "${{ needs.resolve_context.outputs.force_run }}" = "true" ]; then
            ARGS+=("--force-run-predict")
          fi
          python3 scripts/predictions_readiness_gate.py "${ARGS[@]}"

      - name: Preflight slate-date availability table
        run: |
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          python3 scripts/build_availability_table.py --slate-date "$D" --out data/player_availability_asof.parquet

      - name: Run scripts/predict.py
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          python3 scripts/predict.py --date "$D"

      - name: Verify daily prediction outputs
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          python3 scripts/verify_daily_prediction_outputs.py --date "$D"

      - name: Commit prediction artifacts + automation health
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"

          git add \
            predictions/all_props_"$D".parquet \
            predictions/singles_"$D".json \
            predictions/pmf_display_"$D".json \
            predictions/nba_props_today.json \
            artifacts/automation_health \
            2>/dev/null || true

          git diff --staged --quiet && exit 0

          git commit --author="Joseph Shackelford <josephshack@gmail.com>" \
            -m "NBA PMF Delivery: predict daily $D"

          cleanup_rebase_state() {
            git rebase --abort || true
            rm -rf .git/rebase-merge .git/rebase-apply
          }

          sync_and_push() {
            local attempts="${1:-5}"
            for i in $(seq 1 "$attempts"); do
              cleanup_rebase_state
              git status --short || true

              if git pull --rebase --autostash origin main; then
                :
              else
                # A concurrent Phase 13AF/AE job may have written the same
                # per-date freshness JSON/MD files.  When the rebase conflicts
                # only on those files, skip the conflicting commit entirely
                # (the remote version is authoritative; our local copy is
                # redundant).  Any other conflict aborts and retries normally.
                while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
                  conflicts=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
                  [ -z "$conflicts" ] && break
                  non_freshness=$(echo "$conflicts" | grep -v "player_game_stats_freshness" || true)
                  if [ -z "$non_freshness" ]; then
                    git rebase --skip 2>/dev/null || { cleanup_rebase_state; break; }
                  else
                    cleanup_rebase_state; break
                  fi
                done
              fi

              if git push origin HEAD:main; then
                cleanup_rebase_state
                return 0
              fi

              cleanup_rebase_state
              sleep 10
            done
            return 1
          }

          sync_and_push 5

  # ────────────────────────────────────────────────────────────────
  # Delivery build — Derek + WoO + delivery hygiene + verifiers.
  # Depends ONLY on resolve_context + readiness (NOT model chain/Phase 8/13)
  # so long training runs never block delivery refresh.
  # ────────────────────────────────────────────────────────────────
  delivery_build:
    name: Build & Publish Deliveries
    runs-on: ubuntu-latest
    needs: [resolve_context, readiness, phase13_live_context_contextual_lineup]
    if: always() && needs.resolve_context.result == 'success' && needs.readiness.result == 'success' && needs.resolve_context.outputs.run_delivery == 'true' && needs.resolve_context.outputs.valid_skip_reason == '' && (needs.phase13_live_context_contextual_lineup.result == 'success' || needs.phase13_live_context_contextual_lineup.result == 'skipped')
    timeout-minutes: 120
    concurrency:
      group: nba-pmf-delivery-${{ needs.resolve_context.outputs.delivery_date }}-${{ needs.resolve_context.outputs.mode }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main || true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Note existing Derek unique summary hash before delivery
        id: unique_before
        # Informational only. The delivery pipeline is allowed to (and is
        # often required to) regenerate the current-date
        # `derek_unique_props_summary.csv` (e.g. derek_near_lineup,
        # close_lock, woo_morning_monetization on the first run of the
        # day). The post-processing guard further down compares the
        # hash *after* the pipeline to the hash *after* post-processing,
        # so it is the post-processing tooling (strip / previews / CSV
        # size contract) that is forbidden from mutating the file.
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          P="deliveries/$D/derek_forward_feed/derek_unique_props_summary.csv"
          if [ -f "$P" ]; then
            echo "hash=$(shasum -a 256 "$P" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "hash=missing" >> "$GITHUB_OUTPUT"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Predictions readiness gate (force-run if requested)
        id: predict_gate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          MODE="${{ needs.resolve_context.outputs.mode }}"
          ARGS=(
            --date "$D"
            --predict-cron-hour-utc 14
            --mode "$MODE"
          )
          if [ "${{ needs.resolve_context.outputs.force_run }}" = "true" ]; then
            ARGS+=("--force-run-predict")
          fi
          python3 scripts/predictions_readiness_gate.py "${ARGS[@]}"

      - name: Preflight slate-date availability table
        run: |
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          python3 scripts/build_availability_table.py --slate-date "$D" --out data/player_availability_asof.parquet

      - name: Run daily PMF delivery pipeline
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          MODE="${{ needs.resolve_context.outputs.mode }}"

          ARGS=(
            --date "$D"
            --mode "$MODE"
            --regions us us2
            --rebuild-canonical
            --verify
            --fail-on-missing-delivery
          )

          if [ "${{ github.event.inputs.run_predict || 'false' }}" = "true" ]; then
            ARGS+=("--predict")
          fi

          if [ "${{ needs.resolve_context.outputs.force_run }}" = "true" ]; then
            ARGS+=("--force-run")
          fi

          python3 scripts/run_daily_delivery_pipeline.py "${ARGS[@]}"

          # ── Lineup behavior markers ────────────────────────────────────
          # Morning/WoO runs accept projected/provisional lineups;
          # near-tip/close-lock runs consume official lineup info.
          case "$MODE" in
            morning|woo_morning_monetization|woo_afternoon_refresh)
              echo "PROVISIONAL_ROWS_ACCEPTED_AS_VALID_PREGAME=true"
              echo "LINEUP_STATUS_VALID_FOR_MODE=$MODE"
              ;;
            derek_pre_tipoff_refresh|derek_near_lineup)
              echo "OFFICIAL_LINEUP_CONTEXT_APPLIED_FOR_NEAR_TIP=true"
              echo "LINEUP_STATUS_VALID_FOR_MODE=$MODE"
              ;;
            close_lock)
              echo "OFFICIAL_LINEUP_CONTEXT_APPLIED_FOR_NEAR_TIP=true"
              echo "LINEUP_STATUS_VALID_FOR_MODE=close_lock"
              ;;
          esac
          echo "LATEST_AVAILABLE_SNAPSHOT_UPDATED=true"

      - name: Capture Derek unique summary hash after pipeline generation
        id: derek_unique_after_pipeline
        if: steps.predict_gate.outputs.should_proceed == 'true'
        # The delivery pipeline (run_daily_delivery_pipeline.py +
        # build_derek_forward_feed.py) is the authoritative writer of
        # `deliveries/<date>/derek_forward_feed/derek_unique_props_summary.csv`.
        # Capture its hash here so the later post-processing guard can
        # verify that strip_empty_delivery_columns / write_delivery_review_previews
        # / enforce_delivery_csv_size_contract do not mutate this file.
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          P="deliveries/$D/derek_forward_feed/derek_unique_props_summary.csv"

          if [ ! -f "$P" ]; then
            echo "::error::Missing $P after delivery pipeline"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import pandas as pd
          import sys

          p = Path("deliveries/${{ needs.resolve_context.outputs.delivery_date }}/derek_forward_feed/derek_unique_props_summary.csv")
          expected = [
              "player_name",
              "projected_minutes",
              "stat",
              "pmf_mean",
              "market_line",
              "p_over",
          ]
          df = pd.read_csv(p)
          cols = list(df.columns)
          if cols != expected:
              print(f"::error::Unexpected derek_unique_props_summary.csv columns: {cols}; expected {expected}")
              sys.exit(1)
          print(f"DEREK_UNIQUE_SUMMARY_SCHEMA_PASS rows={len(df)} columns={cols}")
          PY

          AFTER_PIPELINE_HASH="$(shasum -a 256 "$P" | awk '{print $1}')"
          ROWS="$(python3 -c 'import pandas as pd, sys; print(len(pd.read_csv(sys.argv[1])))' "$P")"
          echo "hash=$AFTER_PIPELINE_HASH" >> "$GITHUB_OUTPUT"
          echo "rows=$ROWS" >> "$GITHUB_OUTPUT"
          echo "DEREK_UNIQUE_SUMMARY_AFTER_PIPELINE hash=$AFTER_PIPELINE_HASH rows=$ROWS"

      - name: Delivery hygiene, previews, champion stamps, and CSV size contract
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"

          python3 scripts/stamp_delivery_champion_metadata.py --delivery-date "$D" || true
          python3 scripts/strip_empty_delivery_columns.py --date "$D" --write
          python3 scripts/round_delivery_csv_numeric_display.py \
            --date "$D" \
            --places 4 \
            --write \
            --preserve derek_forward_feed/derek_unique_props_summary.csv
          python3 scripts/write_delivery_review_previews.py --date "$D"

          python3 scripts/enforce_delivery_csv_size_contract.py \
            --date "$D" \
            --max-bytes 524288 \
            --preserve derek_forward_feed/derek_unique_props_summary.csv \
            --write

      - name: Assert Derek unique summary was not changed by post-processing
        if: steps.predict_gate.outputs.should_proceed == 'true'
        # The delivery pipeline is the authoritative writer of
        # derek_unique_props_summary.csv for the current slate. The
        # *post-processing* tooling (strip_empty_delivery_columns,
        # write_delivery_review_previews, enforce_delivery_csv_size_contract)
        # must NOT mutate this file. This step compares the post-pipeline
        # hash to the post-postprocessing hash and re-asserts the strict
        # six-column public contract.
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          P="deliveries/$D/derek_forward_feed/derek_unique_props_summary.csv"

          if [ ! -f "$P" ]; then
            echo "::error::Missing $P after delivery post-processing"
            exit 1
          fi

          AFTER_PIPELINE="${{ steps.derek_unique_after_pipeline.outputs.hash }}"
          AFTER_POSTPROCESS="$(shasum -a 256 "$P" | awk '{print $1}')"

          echo "after_pipeline =$AFTER_PIPELINE"
          echo "after_postproc=$AFTER_POSTPROCESS"

          if [ -z "$AFTER_PIPELINE" ]; then
            echo "::error::after-pipeline hash is empty; capture step must run before post-processing"
            exit 1
          fi

          if [ "$AFTER_PIPELINE" != "$AFTER_POSTPROCESS" ]; then
            echo "::error::derek_unique_props_summary.csv was changed by post-processing. This is not allowed."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import pandas as pd
          import sys

          p = Path("deliveries/${{ needs.resolve_context.outputs.delivery_date }}/derek_forward_feed/derek_unique_props_summary.csv")
          expected = [
              "player_name",
              "projected_minutes",
              "stat",
              "pmf_mean",
              "market_line",
              "p_over",
          ]
          df = pd.read_csv(p)
          cols = list(df.columns)
          if cols != expected:
              print(f"::error::Unexpected final derek_unique_props_summary.csv columns: {cols}; expected {expected}")
              sys.exit(1)
          print(f"DEREK_UNIQUE_SUMMARY_POSTPROCESS_GUARD_PASS rows={len(df)}")
          PY

      - name: Delivery verifiers
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          TRAIN_THROUGH="${{ needs.resolve_context.outputs.as_of_date }}"

          python3 scripts/verify_daily_delivery_folder_contract.py --date "$D"
          python3 scripts/verify_model_only_parquet_selection.py --date "$D" || true
          python3 scripts/validate_production_pmf_math.py || true

          python3 scripts/validate_daily_pmf_delivery.py \
            --date "$D" \
            --train-through-date "$TRAIN_THROUGH" \
            --pipeline-mode "${{ needs.resolve_context.outputs.mode }}" || true

          python3 scripts/verify_derek_forward_feed.py \
            --delivery-date "$D" \
            --mode production \
            --allow-pending-lineup || true

      - name: Fail-closed delivery integrity verification (must pass before commit)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          MODE="${{ needs.resolve_context.outputs.mode }}"

          echo "=== FAIL-CLOSED DELIVERY INTEGRITY CHECKS ==="
          echo "DATE=$D  MODE=$MODE"

          # 1. Parquet readability for all_props.
          AP="predictions/all_props_${D}.parquet"
          if [ -f "$AP" ]; then
            python3 scripts/verify_parquet_readability.py \
              --path "$AP" \
              --min-rows 1 \
              --all-props-columns
          else
            echo "PARQUET_VERIFY_SKIP  path=$AP  reason=file_not_present_for_this_mode"
          fi

          # 2. WoO delivery completeness — fatal for morning/afternoon.
          case "$MODE" in
            morning|woo_morning_monetization|woo_afternoon_refresh|close_lock)
              python3 scripts/verify_woo_delivery_complete.py --date "$D"
              ;;
            *)
              python3 scripts/verify_woo_delivery_complete.py --date "$D" || \
                echo "WOO_DELIVERY_VERIFY_WARN  mode=$MODE  non_fatal_for_this_mode"
              ;;
          esac

          # 3. Sparse-stat PMF shape — fatal if full_pmfs_wide available.
          WOO="deliveries/$D/wizard_of_odds"
          if [ -f "$WOO/full_pmfs_wide.parquet" ] || [ -f "$WOO/full_pmfs_wide.csv" ]; then
            python3 scripts/verify_sparse_stat_pmf_shape.py --date "$D"
          else
            echo "SPARSE_STAT_PMF_SHAPE_SKIP  date=$D  reason=full_pmfs_wide_not_present"
          fi

          echo "=== DELIVERY INTEGRITY CHECKS COMPLETE ==="

      - name: Build SGP Engine daily prices and WoO page
        if: steps.predict_gate.outputs.should_proceed == 'true'
        continue-on-error: true
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          # ── SGP Engine feature flag gate ────────────────────────────────────
          # SGP Engine is OPT-IN ONLY. Default: disabled.
          # Enable via:
          #   workflow_dispatch input  run_sgp_engine=true
          #   repo/org env variable   ENABLE_SGP_ENGINE=true
          # Do NOT change the default until all readiness gates in
          # docs/SGP_ENGINE_BUILD_PLAN.md §0C have explicitly passed.
          RUN_SGP="${{ github.event.inputs.run_sgp_engine || 'false' }}"
          if [ "${RUN_SGP}" != "true" ] && [ "${ENABLE_SGP_ENGINE:-false}" != "true" ]; then
            echo "SGP Engine disabled (ENABLE_SGP_ENGINE=false, run_sgp_engine=${RUN_SGP}); skipping."
            echo "SGP_ENGINE_SKIPPED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SGP_ENGINE_SKIPPED=false" >> "$GITHUB_ENV"

          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          ASOF="${{ needs.resolve_context.outputs.as_of_date }}"

          python3 scripts/build_sgp_slate_state_bundle.py \
            --date "$D" \
            --repo-root . \
            --allow-missing-asof-metadata \
            ${ASOF:+--expected-cutoff-date "$ASOF"} || true

          python3 scripts/run_sgp_engine_daily.py \
            --date "$D" \
            --repo-root . \
            --n-sims 200000 \
            --allow-missing-asof-metadata || true

          python3 scripts/build_sgp_woo_page.py \
            --date "$D" \
            --repo-root . || true

          python3 scripts/verify_sgp_delivery_outputs.py \
            --date "$D" \
            --repo-root . || true

      - name: Build delivery index and commit delivery outputs
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"

          python3 scripts/build_deliveries_index.py || true

          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"

          # Only stage SGP outputs when the SGP Engine actually ran this cycle.
          if [ "${SGP_ENGINE_SKIPPED:-true}" != "true" ]; then
            git add deliveries/"$D"/sgp_engine/ 2>/dev/null || true
            git add public_export/wizard_of_odds/sgp/ 2>/dev/null || true
          fi

          git add \
            deliveries/"$D" \
            deliveries/README.md \
            deliveries/index.html \
            public_export/wizard_of_odds \
            artifacts/automation_health \
            2>/dev/null || true

          git diff --staged --quiet && exit 0

          git commit --author="Joseph Shackelford <josephshack@gmail.com>" \
            -m "NBA PMF Delivery: delivery $D ${{ needs.resolve_context.outputs.mode }}"

          cleanup_rebase_state() {
            git rebase --abort || true
            rm -rf .git/rebase-merge .git/rebase-apply
          }

          sync_and_push() {
            local attempts="${1:-5}"
            for i in $(seq 1 "$attempts"); do
              cleanup_rebase_state
              # Remove locally-generated prediction/feature files owned by predict_daily.
              # delivery_build does not commit these; predict_daily commits them to
              # origin/main. If left as untracked, git rebase refuses with
              # "untracked file would be overwritten by checkout".
              git clean -fd predictions/ data/features/ || true
              git status --short || true

              if git pull --rebase --autostash origin main; then
                :
              else
                while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
                  conflicts=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
                  [ -z "$conflicts" ] && break
                  non_freshness=$(echo "$conflicts" | grep -v "player_game_stats_freshness" || true)
                  if [ -z "$non_freshness" ]; then
                    git rebase --skip 2>/dev/null || { cleanup_rebase_state; break; }
                  else
                    cleanup_rebase_state; break
                  fi
                done
              fi

              if git push origin HEAD:main; then
                cleanup_rebase_state
                return 0
              fi

              cleanup_rebase_state
              sleep 10
            done
            return 1
          }

          sync_and_push 5

  # ────────────────────────────────────────────────────────────────
  # After-game scoring — 06:30 UTC cron + manual stage=after_game.
  # Adds rolling market benchmark + PMF variance experience study so
  # the calibration/market-superiority chain has fresh evidence.
  # ────────────────────────────────────────────────────────────────
  after_game_scoring:
    name: Score Previous Games
    runs-on: ubuntu-latest
    needs: [resolve_context, readiness]
    if: always() && needs.resolve_context.result == 'success' && needs.readiness.result == 'success' && needs.resolve_context.outputs.run_after_game == 'true' && needs.resolve_context.outputs.valid_skip_reason == ''
    timeout-minutes: 120
    concurrency:
      group: nba-pmf-after-game-${{ needs.resolve_context.outputs.delivery_date }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main || true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run complete after-game scoring
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          python3 scripts/run_after_game_complete_scoring.py --date "$D"
          python3 scripts/verify_after_game_scoring_package_consistency.py --delivery-date "$D"

      - name: Rolling market benchmark + PMF variance experience study
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"

          # Rolling 28-day market benchmark — feeds the calibration /
          # market-superiority gate but never claims superiority on its
          # own. ``|| true`` matches the brief: insufficient sample is
          # an acceptable valid-skip and must not red-fail this job.
          python3 scripts/build_rolling_market_benchmark.py \
            --as-of-date "$D" \
            --window-days 28 || true

          python3 scripts/build_pmf_variance_experience_study.py \
            --as-of-date "$D" || true

      - name: Verify, preview, enforce CSV size
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"

          python3 scripts/strip_empty_delivery_columns.py --date "$D" --write
          python3 scripts/write_delivery_review_previews.py --date "$D"

          python3 scripts/enforce_delivery_csv_size_contract.py \
            --date "$D" \
            --max-bytes 524288 \
            --preserve derek_forward_feed/derek_unique_props_summary.csv \
            --write

      - name: Build delivery index and commit after-game outputs
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"

          python3 scripts/build_deliveries_index.py || true

          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"

          git add \
            deliveries/"$D" \
            deliveries/README.md \
            deliveries/index.html \
            artifacts/automation_health \
            artifacts/market_benchmark \
            artifacts/experience_studies \
            2>/dev/null || true

          git diff --staged --quiet && exit 0

          git commit --author="Joseph Shackelford <josephshack@gmail.com>" \
            -m "NBA PMF Delivery: after-game scoring $D"

          cleanup_rebase_state() {
            git rebase --abort || true
            rm -rf .git/rebase-merge .git/rebase-apply
          }

          sync_and_push() {
            local attempts="${1:-5}"
            for i in $(seq 1 "$attempts"); do
              cleanup_rebase_state
              git status --short || true

              if git pull --rebase --autostash origin main; then
                :
              else
                # A concurrent Phase 13AF/AE job may have written the same
                # per-date freshness JSON/MD files.  When the rebase conflicts
                # only on those files, skip the conflicting commit entirely
                # (the remote version is authoritative; our local copy is
                # redundant).  Any other conflict aborts and retries normally.
                while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
                  conflicts=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
                  [ -z "$conflicts" ] && break
                  non_freshness=$(echo "$conflicts" | grep -v "player_game_stats_freshness" || true)
                  if [ -z "$non_freshness" ]; then
                    git rebase --skip 2>/dev/null || { cleanup_rebase_state; break; }
                  else
                    cleanup_rebase_state; break
                  fi
                done
              fi

              if git push origin HEAD:main; then
                cleanup_rebase_state
                return 0
              fi

              cleanup_rebase_state
              sleep 10
            done
            return 1
          }

          sync_and_push 5

  # ────────────────────────────────────────────────────────────────
  # final_contract_verifiers — STRICT upstream gating.
  #
  # Per brief Phase 14, this job must NOT use `always()`. It only runs
  # when every SELECTED prerequisite succeeded or was skipped (skip is
  # acceptable because selected runs only ever execute prerequisites
  # the resolver enabled).
  # ────────────────────────────────────────────────────────────────
  final_contract_verifiers:
    name: Verify Delivery Contracts
    runs-on: ubuntu-latest
    needs:
      - resolve_context
      - readiness
      - model_chain_training_calibration
      - phase8_pmf_calibration_diagnostics_market_eval
      - phase13_live_context_contextual_lineup
      - predict_daily
      - delivery_build
      - after_game_scoring
    if: >-
      always() &&
      needs.resolve_context.result == 'success' &&
      needs.readiness.result == 'success' &&
      needs.resolve_context.outputs.run_verifiers == 'true' &&
      needs.resolve_context.outputs.valid_skip_reason == '' &&
      (needs.model_chain_training_calibration.result == 'success' || needs.model_chain_training_calibration.result == 'skipped') &&
      (needs.phase8_pmf_calibration_diagnostics_market_eval.result == 'success' || needs.phase8_pmf_calibration_diagnostics_market_eval.result == 'skipped') &&
      (needs.phase13_live_context_contextual_lineup.result == 'success' || needs.phase13_live_context_contextual_lineup.result == 'skipped') &&
      (needs.predict_daily.result == 'success' || needs.predict_daily.result == 'skipped') &&
      (needs.delivery_build.result == 'success' || needs.delivery_build.result == 'skipped') &&
      (needs.after_game_scoring.result == 'success' || needs.after_game_scoring.result == 'skipped')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main || true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run final delivery contract verifiers
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          D="${{ needs.resolve_context.outputs.delivery_date }}"
          TRAIN_THROUGH="${{ needs.resolve_context.outputs.as_of_date }}"

          python3 scripts/verify_real_champion_pointer.py

          # Delivery-related verifiers only run when a delivery folder
          # actually exists for this date (avoids red-failing on
          # training-only runs).
          if [ -d "deliveries/$D" ]; then
            python3 scripts/verify_daily_delivery_folder_contract.py --date "$D"
            python3 scripts/verify_morning_delivery_completeness.py --date "$D" || true
            python3 scripts/verify_model_only_parquet_selection.py --date "$D" || true
            python3 scripts/validate_production_pmf_math.py || true

            python3 scripts/validate_daily_pmf_delivery.py \
              --date "$D" \
              --train-through-date "$TRAIN_THROUGH" \
              --pipeline-mode "${{ needs.resolve_context.outputs.mode }}" || true

            python3 scripts/verify_derek_forward_feed.py \
              --delivery-date "$D" \
              --mode production \
              --allow-pending-lineup || true

            python3 scripts/enforce_delivery_csv_size_contract.py \
              --date "$D" \
              --max-bytes 524288 \
              --preserve derek_forward_feed/derek_unique_props_summary.csv
          fi

          if [ -d "deliveries/$D/after_game_scoring" ]; then
            python3 scripts/verify_after_game_scoring_package_consistency.py \
              --delivery-date "$D" || true
          fi

  # ────────────────────────────────────────────────────────────────
  # Pipeline summary — always runs, reports final verdict.
  # ────────────────────────────────────────────────────────────────
  pipeline_summary:
    name: Pipeline Run Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - resolve_context
      - readiness
      - model_chain_training_calibration
      - phase8_pmf_calibration_diagnostics_market_eval
      - phase13_live_context_contextual_lineup
      - predict_daily
      - delivery_build
      - after_game_scoring
      - final_contract_verifiers
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main || true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt

      - name: Emit pipeline final summary
        env:
          RESOLVE_RESULT:    ${{ needs.resolve_context.result }}
          READINESS_RESULT:  ${{ needs.readiness.result }}
          MC_RESULT:         ${{ needs.model_chain_training_calibration.result }}
          P8_RESULT:         ${{ needs.phase8_pmf_calibration_diagnostics_market_eval.result }}
          P13_RESULT:        ${{ needs.phase13_live_context_contextual_lineup.result }}
          PREDICT_RESULT:    ${{ needs.predict_daily.result }}
          DELIVERY_RESULT:   ${{ needs.delivery_build.result }}
          AFTER_RESULT:      ${{ needs.after_game_scoring.result }}
          VERIFIERS_RESULT:  ${{ needs.final_contract_verifiers.result }}
          RUN_ID:            ${{ github.run_id }}
          SHA:               ${{ github.sha }}
          STAGE:             ${{ needs.resolve_context.outputs.stage }}
          MODE:              ${{ needs.resolve_context.outputs.mode }}
          DELIVERY_DATE:     ${{ needs.resolve_context.outputs.delivery_date }}
          AS_OF_DATE:        ${{ needs.resolve_context.outputs.as_of_date }}
          ALLOW_PROMOTE:     ${{ needs.resolve_context.outputs.allow_promote }}
          VALID_SKIP_REASON: ${{ needs.resolve_context.outputs.valid_skip_reason }}
        run: |
          set -euo pipefail
          D="$DELIVERY_DATE"
          ASOF="$AS_OF_DATE"

          echo "=================================================================="
          echo "PIPELINE FINAL SUMMARY"
          echo "=================================================================="
          echo "run_id:        $RUN_ID"
          echo "sha:           $SHA"
          echo "stage:         $STAGE"
          echo "mode:          $MODE"
          echo "delivery_date: $D"
          echo "as_of_date:    $ASOF"
          echo "allow_promote: $ALLOW_PROMOTE"
          [ -n "$VALID_SKIP_REASON" ] && echo "valid_skip:    $VALID_SKIP_REASON"
          echo ""
          echo "── Job Results ───────────────────────────────────────────────────"
          echo "resolve_context:             $RESOLVE_RESULT"
          echo "readiness:                   $READINESS_RESULT"
          echo "model_chain_training:        $MC_RESULT"
          echo "phase8_calibration:          $P8_RESULT"
          echo "phase13_contextual:          $P13_RESULT"
          echo "predict_daily:               $PREDICT_RESULT"
          echo "delivery_build:              $DELIVERY_RESULT"
          echo "after_game_scoring:          $AFTER_RESULT"
          echo "final_contract_verifiers:    $VERIFIERS_RESULT"
          echo ""

          echo "── Champion Pointer ──────────────────────────────────────────────"
          python3 -c "import json; p=json.load(open('artifacts/models/registry/champion_pointer.json')); [print(k+': '+str(p.get(k))) for k in ['champion_model_id','feature_set_id','trained_through_date','calibrated_through_date','contextual_trained_through_date','promoted_at_utc']]; fs=p.get('feature_set_id') or ''; print('champion_is_contextual: '+('yes' if fs.startswith(('phase13q_','phase13s_')) else 'NO'))" || echo "ERROR reading champion_pointer.json"

          echo ""
          echo "── Delivery Folder ───────────────────────────────────────────────"
          if [ -d "deliveries/$D" ]; then
            echo "deliveries/$D exists"
            find "deliveries/$D" -name "*.parquet" -o -name "*.csv" | wc -l | xargs echo "  output files:"
            python3 -c "import os; d='deliveries/$D'; [print('  '+s+': '+('PRESENT' if os.path.isdir(d+'/'+s) else 'ABSENT')) for s in ['canonical_source','wizard_of_odds','derek_forward_feed','pmf_model_review_package','after_game_scoring']]" || true
          else
            echo "deliveries/$D: not generated this run (training-only or skipped)"
          fi

          echo ""
          echo "── Final Verdict ─────────────────────────────────────────────────"
          FAILED_JOBS=""
          for JOB_NAME_RESULT in \
            "resolve_context:$RESOLVE_RESULT" \
            "readiness:$READINESS_RESULT" \
            "model_chain:$MC_RESULT" \
            "phase8:$P8_RESULT" \
            "phase13:$P13_RESULT" \
            "predict_daily:$PREDICT_RESULT" \
            "delivery_build:$DELIVERY_RESULT" \
            "after_game_scoring:$AFTER_RESULT" \
            "final_verifiers:$VERIFIERS_RESULT"; do
            JOB="${JOB_NAME_RESULT%%:*}"
            RES="${JOB_NAME_RESULT##*:}"
            if [ "$RES" = "failure" ] || [ "$RES" = "cancelled" ]; then
              FAILED_JOBS="$FAILED_JOBS $JOB($RES)"
            fi
          done

          if [ -n "$FAILED_JOBS" ]; then
            echo "PIPELINE_FINAL_VERDICT=FAIL"
            echo "  failed_jobs:$FAILED_JOBS"
            exit 1
          elif [ -n "$VALID_SKIP_REASON" ]; then
            echo "PIPELINE_FINAL_VERDICT=PASS_WITH_WARNINGS"
            echo "  valid_skip_reason=$VALID_SKIP_REASON"
          else
            echo "PIPELINE_FINAL_VERDICT=PASS"
          fi
