name: Phase 13Q — Contextual PMF Engine (train + validate, no-promote)

# Trains the Phase 13Q additive contextual challenger (Phase 13P live-
# context features + game-context features: rest, b2b, three-in-four,
# season game number, home/away, opponent_team_id_hash) and runs the
# verifiers. Does NOT auto-promote — promotion stays owned by the
# existing nightly pipeline + promote_challenger_if_validated.py.
#
# Hard rules:
#   - No edits to wizard_of_odds/, derek_forward_feed/,
#     pmf_model_review_package/, canonical_source/.
#   - Auto-commit ONLY artifacts/models/challengers/<date>_contextual/
#     and artifacts/phase13p/ + artifacts/phase13q/. Champion pointer untouched.
#   - Author: Joseph Shackelford <josephshack@gmail.com>.

on:
  # H1B chain — auto-fire after phase13p succeeds. Manual dispatch
  # remains available.
  workflow_run:
    workflows: ["Phase 13P — Live-Context Challenger (train + validate, no-promote)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "YYYY-MM-DD (train through this date inclusive)."
        required: false
        default: ""
      dry_run:
        description: "Skip writing model artifacts; produce manifest only"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  PYTHON_VERSION: "3.11"

jobs:
  phase13q_contextual_challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # H1B chain gate.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    concurrency:
      group: phase13q-contextual-${{ github.event.inputs.as_of_date || 'today' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - name: H1B — Verify upstream output present (workflow_run only)
        if: github.event_name == 'workflow_run'
        run: |
          set -e
          # Upstream is phase13p which commits
          # "phase13p: live-context challenger <date>".
          UPSTREAM_PATTERN="^phase13p: "
          if ! git log --grep="$UPSTREAM_PATTERN" --since="24 hours ago" --format="%h" | head -1 | grep -q .; then
            echo "::error::No upstream commit matching '$UPSTREAM_PATTERN' in last 24h on origin/main"
            echo "Recent commits:"
            git log -5 --oneline
            exit 1
          fi
          LATEST=$(git log --grep="$UPSTREAM_PATTERN" --since="24 hours ago" -1 --format="%h %ai %s")
          echo "::notice::Upstream output verified: $LATEST"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Resolve as-of date (America/New_York)
        id: d
        run: |
          if [ -n "${{ github.event.inputs.as_of_date }}" ]; then
            echo "date=${{ github.event.inputs.as_of_date }}" >> "$GITHUB_OUTPUT"
          else
            ET_PREV=$(TZ=America/New_York date -d 'yesterday' +%Y-%m-%d 2>/dev/null \
                       || TZ=America/New_York date -v-1d +%Y-%m-%d)
            echo "date=$ET_PREV" >> "$GITHUB_OUTPUT"
          fi

      - name: Phase 13Q training started
        run: |
          echo "PHASE13Q_TRAINING_STARTED"
          echo "  as_of_date=${{ steps.d.outputs.date }}"

      - name: Build Phase 13O live-context training dataset (input)
        id: build_dataset
        continue-on-error: true
        run: |
          python scripts/build_live_context_training_dataset.py \
            --as-of-date ${{ steps.d.outputs.date }}

      - name: Train Phase 13Q contextual challenger
        id: train_challenger
        continue-on-error: true
        run: |
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi
          python scripts/train_contextual_challenger.py \
            --as-of-date ${{ steps.d.outputs.date }} \
            $DRY

      - name: Verify feature lists include phase13q columns
        id: verify_feature_lists
        continue-on-error: true
        run: |
          python scripts/verify_live_context_feature_training.py \
            --feature-set-id phase13q_contextual_pmf_engine_v1

      - name: Verify PMF sensitivity (4 cases)
        id: verify_sensitivity
        continue-on-error: true
        run: |
          python scripts/verify_live_context_pmf_sensitivity.py

      - name: Verify Phase 13P/Q no-leakage
        id: verify_no_leakage
        continue-on-error: true
        run: |
          python scripts/verify_phase13p_no_leakage.py

      - name: Verify Phase 13P/Q validation gates
        id: verify_validation_gates
        continue-on-error: true
        run: |
          python scripts/verify_phase13p_validation_gates.py

      - name: Phase 13L no-breakage
        id: verify_no_break
        continue-on-error: true
        run: |
          python scripts/verify_phase13l_no_breakage.py

      - name: Upload Phase 13Q artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13q-contextual-${{ steps.d.outputs.date }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/models/challengers/${{ steps.d.outputs.date }}_contextual/**
            artifacts/phase13p/**
            artifacts/phase13q/**

      # Q-2: gate the commit on training success AND both safety verifiers
      # (no-leakage, no-breakage). Same logic as Phase 13P.
      - name: Commit Phase 13Q artifacts (Joseph Shackelford authorship)
        if: |
          steps.train_challenger.outcome == 'success' &&
          steps.verify_no_leakage.outcome == 'success' &&
          steps.verify_no_break.outcome == 'success'
        run: |
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          # Q-5: ALSO stage artifacts/phase13q (this is the Phase 13Q
          # workflow — previously it only staged artifacts/phase13p, so
          # phase13q outputs never reached origin/main).
          if ! git add artifacts/models/challengers/${{ steps.d.outputs.date }}_contextual \
                       artifacts/phase13p \
                       artifacts/phase13q; then
            echo "::error::git add failed for one or more Phase 13Q paths"
            exit 1
          fi
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "phase13q: contextual challenger ${{ steps.d.outputs.date }}"
          # M1: scope the working-tree reset to the dataset/parquet files
          # the upstream build_dataset + BDL refresh may have mutated.
          git checkout -- data/live_context_features.parquet data/player_game_stats.parquet 2>/dev/null || true
          PUSH_SUCCESS=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi

      # Q-3: consolidator expanded from 3 to 6 outcomes — adds
      # verify_feature_lists, verify_sensitivity, verify_validation_gates.
      # build_dataset is intentionally omitted: any failure there cascades
      # into train_challenger.outcome != 'success', which is already in
      # this list. All upstream steps use continue-on-error: true, so the
      # default success() gate works (no early termination).
      - name: Fail workflow if any required step failed
        if: |
          steps.train_challenger.outcome != 'success' ||
          steps.verify_no_leakage.outcome != 'success' ||
          steps.verify_no_break.outcome != 'success' ||
          steps.verify_feature_lists.outcome != 'success' ||
          steps.verify_sensitivity.outcome != 'success' ||
          steps.verify_validation_gates.outcome != 'success'
        run: |
          echo "::error::A Phase 13Q step failed."
          echo "train_challenger=${{ steps.train_challenger.outcome }}"
          echo "verify_feature_lists=${{ steps.verify_feature_lists.outcome }}"
          echo "verify_sensitivity=${{ steps.verify_sensitivity.outcome }}"
          echo "verify_no_leakage=${{ steps.verify_no_leakage.outcome }}"
          echo "verify_validation_gates=${{ steps.verify_validation_gates.outcome }}"
          echo "verify_no_break=${{ steps.verify_no_break.outcome }}"
          exit 1
