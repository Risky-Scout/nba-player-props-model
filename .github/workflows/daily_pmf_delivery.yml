name: NBA PMF Delivery — Daily Pipeline

# Phase 12D-amend — Derek's evaluation feed and WoO's monetization feed
# now have separate scheduled lifecycles:
#
#   15:00 UTC = 11:00 AM ET (EDT)  woo_morning_monetization
#                                  first WoO public run of the day; monetization-
#                                  oriented; PROVISIONAL_EARLY_MARKET; lineups
#                                  not yet confirmed.
#   18:00 UTC = 2:00 PM ET         woo_afternoon_refresh
#   20:00 UTC = 4:00 PM ET         woo_afternoon_refresh
#   22:25 UTC = 6:25 PM ET         derek_near_lineup (earliest tipoff − 35 min
#                                  default during NBA playoffs); also refreshes
#                                  the WoO public export.
#   22:40 UTC ... 03:10 UTC every 15 min  derek_near_lineup
#   03:25 UTC = 11:25 PM ET        close_lock (final lineup/market lock)
#   06:30 UTC = 2:30 AM ET         after_game (post-final scoring)
#
# Wrapper invocations (per scripts/run_daily_delivery_pipeline.py):
#   1. scripts/refresh_daily_inputs.py      (us+us2 odds + freshness manifest)
#   2. scripts/build_availability_table.py --slate-date <date>  (preflight; merges into data/player_availability_asof.parquet)
#   3. scripts/verify_oddsapi_market_registry_contract.py
#   4. scripts/verify_availability_freshness.py
#   5. scripts/build_stat_grid_pmfs.py      (12-stat mission grid incl. RA)
#   6. scripts/predict.py                   (woo_morning_monetization /
#                                            morning / full_day, --predict only)
#   7. scripts/build_daily_pmf_delivery.py  (snapshot=mode-specific)
#   8. scripts/build_derek_forward_feed.py  (derek_near_lineup, close_lock,
#                                            after_game)
#   9. scripts/build_wizard_of_odds_public_export.py
#                                           (woo_*, derek_near_lineup,
#                                            close_lock; with monetization
#                                            labels for woo_* runs)
#  10. scripts/score_daily_pmf_delivery_after_game.py  (after_game)
#  11. scripts/build_deliveries_index.py    (always, last)
#
# Hard rules echoed by every job:
#   - never log ODDS_API_KEY, BDL_API_KEY, or affiliate config secrets
#   - never stage data/odds_api/, data/freshness_manifest/, artifacts/, logs,
#     dashboards, scratch files, or failed Phase 10D / 10D.2 reports
#   - never wire the failed Phase 10D / 10D.2 TOV overlays
#   - never fabricate affiliate URLs (when config/wizardofodds_affiliate_links.json
#     is absent or has no mapping for a book, monetization_status=
#     needs_affiliate_mapping and the URL fields stay blank)

on:
  # Phase 13AM: prefer workflow_run so PMF delivery fires automatically
  # after a successful Daily Pipeline (predict.py producing the dated
  # parquet). Cron schedules below remain for the window-specific
  # near-tip / monetization / after-game runs that don't depend on a
  # fresh predict cycle.
  #
  # Phase 13AN: workflow_run is ACTIVE. After the Daily Pipeline writes
  # predictions/all_props_<date>.parquet, woo_morning_monetization runs
  # automatically so the corrected PMF delivery package is generated
  # without waiting for the next cron window.
  workflow_run:
    workflows: ["NBA Props Model — Daily Pipeline"]
    types: [completed]
    branches: [main]
  schedule:
    # WoO monetization (early/afternoon).
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
    - cron: '0 20 * * *'
    # Derek near-lineup window — first publishable evaluation snapshot
    # at 22:25 UTC, then every 15 min through 03:10 UTC.
    - cron: '25 22 * * *'
    - cron: '40,55 22 * * *'
    - cron: '10,25,40,55 23,0,1,2 * * *'
    - cron: '10 3 * * *'
    # Late close lock.
    - cron: '25 3 * * *'
    # After-game scoring (yesterday's slate).
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Wrapper mode"
        required: true
        default: derek_near_lineup
        type: choice
        options:
          - woo_morning_monetization
          - woo_afternoon_refresh
          - derek_near_lineup
          - close_lock
          - after_game
          - full_day
          - morning
      delivery_date:
        description: "Delivery date (YYYY-MM-DD); blank = today (UTC)"
        required: false
        default: ""
      run_predict:
        description: "Run scripts/predict.py before refresh (woo_morning_monetization / morning / full_day only). Requires BDL_API_KEY."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_run:
        description: "Bypass the tipoff-window gate (used for manual backfills outside the lineup window)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]


concurrency:
  group: daily-pmf-delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: src
  STAT_GRID_RECALIBRATION_MODEL_DIR: _stat_grid_delivery_calibration_optimizer/artifacts/models
  SOURCE_RECALIBRATION_MODEL_DIR: _stat_grid_delivery_calibration_optimizer/artifacts/models
  # Phase 13AN-G: opt actions into Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


jobs:

  # ── Morning (manual-only since Phase 12D) ────────────────────────────────
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'morning'
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install -r requirements.txt
      # Phase 13AL: secrets preflight — fail fast on BDL/Odds gaps.
      - name: Secrets preflight (Phase 13AL)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 scripts/verify_secrets_preflight.py --mode daily
      - name: Resolve delivery date (America/New_York)
        id: d
        # Phase 13AM: ET-anchored slate-date resolution so cron firings
        # that span the UTC rollover still target tonight's slate (matches
        # what the operator and Derek/WoO downstream expect).
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            ET_DATE=$(TZ=America/New_York date +%Y-%m-%d)
            echo "Resolved delivery_date=$ET_DATE via America/New_York"
            echo "date=$ET_DATE" >> "$GITHUB_OUTPUT"
          fi
      - name: Predictions readiness gate (Phase 13AM)
        id: predict_gate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          python3 scripts/predictions_readiness_gate.py \
            --date "${{ steps.d.outputs.date }}" \
            --predict-cron-hour-utc 13 \
            --mode "morning"
      - name: Run delivery pipeline (morning, manual)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          PREDICT_FLAG=""
          if [ "${{ github.event.inputs.run_predict }}" = "true" ]; then
            PREDICT_FLAG="--predict"
          fi
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_FLAG="--force-run"
          fi
          python scripts/run_daily_delivery_pipeline.py \
            --date ${{ steps.d.outputs.date }} \
            --mode morning \
            --regions us us2 \
            --rebuild-canonical $PREDICT_FLAG $FORCE_FLAG
      - name: Stage and commit approved files
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          # Phase 13I: stamp Derek/WoO manifests with active champion metadata
          # and verify the persisted stamp against artifacts/models/registry/champion_pointer.json.
          # require-both-sides=false because some delivery modes (woo_morning_monetization,
          # woo_afternoon_refresh) only produce WoO; Derek is generated later in the day.
          python scripts/stamp_delivery_champion_metadata.py \
            --delivery-date ${{ steps.d.outputs.date }}
          python scripts/verify_derek_woo_champion_dependency.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --require-both-sides false
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          if ! git add deliveries/${{ steps.d.outputs.date }} \
                       artifacts/delivery_metadata/${{ steps.d.outputs.date }} \
                       deliveries/README.md \
                       deliveries/index.html \
                       public_export/wizard_of_odds; then
            echo "::error::git add failed for one or more paths"
            exit 1
          fi
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "daily delivery champion metadata ${{ steps.d.outputs.date }} (morning)"
          # Phase 13I: BDL refresh and other steps mutate tracked files
          # (e.g. data/player_game_stats.parquet) we explicitly do NOT commit.
          # Discard those working-tree changes so `git pull --rebase` can proceed.
          # Bug E (same root cause as Bug C in nightly_training): expand
          # the working-tree reset to cover verifier-mutated tracked files
          # this workflow writes but does NOT commit. All 6 jobs run
          # verify_derek_woo_champion_dependency.py which rewrites the
          # derek_woo_champion_dependency.{json,md} pair under
          # artifacts/automation_health/. refresh_daily_inputs.py mutates
          # data/player_game_stats.parquet via the BDL refresh.
          git checkout -- data/player_game_stats.parquet \
                          artifacts/automation_health/derek_woo_champion_dependency.json \
                          artifacts/automation_health/derek_woo_champion_dependency.md \
                          2>/dev/null || true
          # Bug E defensive secondary reset: catch any tracked file still
          # dirty (e.g. derek_near_lineup_contract_<date>.json on the
          # derek_near_lineup job, or a future verifier we forgot to
          # enumerate) so `git pull --rebase` can proceed.
          DIRTY_REMAINING=$(git diff --name-only)
          if [ -n "$DIRTY_REMAINING" ]; then
            echo "::notice::Bug E defensive reset — unexpected dirty tracked files:"
            echo "$DIRTY_REMAINING"
            git checkout -- $DIRTY_REMAINING 2>/dev/null || true
          fi
          PUSH_SUCCESS=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi

  # ── WoO morning monetization (15:00 UTC = 11 AM ET) ──────────────────────
  woo_morning_monetization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'woo_morning_monetization') || github.event.schedule == '0 15 * * *' }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install -r requirements.txt
      # Phase 13AL: secrets preflight — fail fast on BDL/Odds gaps.
      - name: Secrets preflight (Phase 13AL)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 scripts/verify_secrets_preflight.py --mode daily
      - name: Resolve delivery date (America/New_York)
        id: d
        # Phase 13AM: ET-anchored slate-date resolution.
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            ET_DATE=$(TZ=America/New_York date +%Y-%m-%d)
            echo "Resolved delivery_date=$ET_DATE via America/New_York"
            echo "date=$ET_DATE" >> "$GITHUB_OUTPUT"
          fi
      - name: Predictions readiness gate (Phase 13AM)
        id: predict_gate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          python3 scripts/predictions_readiness_gate.py \
            --date "${{ steps.d.outputs.date }}" \
            --predict-cron-hour-utc 13 \
            --mode "woo_morning_monetization"
      - name: Run delivery pipeline (woo_morning_monetization)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          PREDICT_FLAG=""
          if [ "${{ github.event.inputs.run_predict }}" = "true" ]; then
            PREDICT_FLAG="--predict"
          fi
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_FLAG="--force-run"
          fi
          python scripts/run_daily_delivery_pipeline.py \
            --date ${{ steps.d.outputs.date }} \
            --mode woo_morning_monetization \
            --regions us us2 \
            --rebuild-canonical $PREDICT_FLAG $FORCE_FLAG
      # Phase 13AM: refresh customer-facing JSON + HTML using the new
      # pipeline so the public export is authoritatively from the new
      # builder, not the legacy build_wizard_of_odds_public_export.py.
      - name: Phase 13AM WoO new pipeline (publish/build/verify)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          python3 scripts/publish_woo_public_export.py     --date ${{ steps.d.outputs.date }}
          python3 scripts/build_woo_dashboard.py            --date ${{ steps.d.outputs.date }}
          python3 scripts/verify_woo_dashboard_render_contract.py --date ${{ steps.d.outputs.date }}
          python3 scripts/verify_woo_public_export_contract.py    --date ${{ steps.d.outputs.date }}
      - name: M8.6 post-delivery verifiers
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          PYTHONPATH: src
        run: |
          D="${{ steps.d.outputs.date }}"
          python3 scripts/verify_oddsapi_market_registry_contract.py
          python3 scripts/verify_no_legacy_prediction_artifacts.py
          python3 scripts/verify_daily_delivery_folder_contract.py --date "$D" \
            --allow-missing after_game_scoring derek_forward_feed
          python3 scripts/verify_woo_public_artifacts_target_allowlist.py --date "$D"
          python3 scripts/verify_availability_freshness.py --date "$D" --mode close_lock
      - name: M8.6 morning completeness + OddsAPI/BDL coverage (slate date)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          PYTHONPATH: src
        run: |
          D="${{ steps.d.outputs.date }}"
          python3 scripts/verify_morning_delivery_completeness.py --date "$D"
          python3 scripts/verify_oddsapi_bdl_full_prop_coverage.py --date "$D" --snapshot-substr auto --ensure-audit
      - name: Upload diagnostics on failure (woo morning)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: woo-morning-fail-${{ steps.d.outputs.date }}
          if-no-files-found: ignore
          path: |
            artifacts/automation_health
            artifacts/model_diagnostics
      - name: Stage and commit approved files
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          # Phase 13I: stamp Derek/WoO manifests with active champion metadata
          # and verify the persisted stamp against artifacts/models/registry/champion_pointer.json.
          # require-both-sides=false because some delivery modes (woo_morning_monetization,
          # woo_afternoon_refresh) only produce WoO; Derek is generated later in the day.
          python scripts/stamp_delivery_champion_metadata.py \
            --delivery-date ${{ steps.d.outputs.date }}
          python scripts/verify_derek_woo_champion_dependency.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --require-both-sides false
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          if ! git add deliveries/${{ steps.d.outputs.date }} \
                       artifacts/delivery_metadata/${{ steps.d.outputs.date }} \
                       deliveries/README.md \
                       deliveries/index.html \
                       public_export/wizard_of_odds \
                       predictions/nba-props.html \
                       predictions/nba-pmf-research.html; then
            echo "::error::git add failed for one or more paths"
            exit 1
          fi
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "daily delivery champion metadata ${{ steps.d.outputs.date }} (woo_morning_monetization)"
          # Phase 13I: BDL refresh and other steps mutate tracked files
          # (e.g. data/player_game_stats.parquet) we explicitly do NOT commit.
          # Discard those working-tree changes so `git pull --rebase` can proceed.
          # Bug E (same root cause as Bug C in nightly_training): expand
          # the working-tree reset to cover verifier-mutated tracked files
          # this workflow writes but does NOT commit. All 6 jobs run
          # verify_derek_woo_champion_dependency.py which rewrites the
          # derek_woo_champion_dependency.{json,md} pair under
          # artifacts/automation_health/. refresh_daily_inputs.py mutates
          # data/player_game_stats.parquet via the BDL refresh.
          git checkout -- data/player_game_stats.parquet \
                          artifacts/automation_health/derek_woo_champion_dependency.json \
                          artifacts/automation_health/derek_woo_champion_dependency.md \
                          2>/dev/null || true
          # Bug E defensive secondary reset: catch any tracked file still
          # dirty (e.g. derek_near_lineup_contract_<date>.json on the
          # derek_near_lineup job, or a future verifier we forgot to
          # enumerate) so `git pull --rebase` can proceed.
          DIRTY_REMAINING=$(git diff --name-only)
          if [ -n "$DIRTY_REMAINING" ]; then
            echo "::notice::Bug E defensive reset — unexpected dirty tracked files:"
            echo "$DIRTY_REMAINING"
            git checkout -- $DIRTY_REMAINING 2>/dev/null || true
          fi
          PUSH_SUCCESS=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi

  # ── WoO afternoon refresh (18:00 + 20:00 UTC) ────────────────────────────
  woo_afternoon_refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'woo_afternoon_refresh') ||
      github.event.schedule == '0 18 * * *' ||
      github.event.schedule == '0 20 * * *'
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install -r requirements.txt
      # Phase 13AL: secrets preflight — fail fast on BDL/Odds gaps.
      - name: Secrets preflight (Phase 13AL)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 scripts/verify_secrets_preflight.py --mode daily
      - name: Resolve delivery date (America/New_York)
        id: d
        # Phase 13AM: ET-anchored slate-date resolution.
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            ET_DATE=$(TZ=America/New_York date +%Y-%m-%d)
            echo "Resolved delivery_date=$ET_DATE via America/New_York"
            echo "date=$ET_DATE" >> "$GITHUB_OUTPUT"
          fi
      - name: Predictions readiness gate (Phase 13AM)
        id: predict_gate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          python3 scripts/predictions_readiness_gate.py \
            --date "${{ steps.d.outputs.date }}" \
            --predict-cron-hour-utc 13 \
            --mode "woo_afternoon_refresh"
      - name: Run delivery pipeline (woo_afternoon_refresh)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_FLAG="--force-run"
          fi
          python scripts/run_daily_delivery_pipeline.py \
            --date ${{ steps.d.outputs.date }} \
            --mode woo_afternoon_refresh \
            --regions us us2 $FORCE_FLAG
      # Phase 13AM: refresh customer-facing JSON + HTML using the new pipeline.
      - name: Phase 13AM WoO new pipeline (publish/build/verify)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          python3 scripts/publish_woo_public_export.py     --date ${{ steps.d.outputs.date }}
          python3 scripts/build_woo_dashboard.py            --date ${{ steps.d.outputs.date }}
          python3 scripts/verify_woo_dashboard_render_contract.py --date ${{ steps.d.outputs.date }}
          python3 scripts/verify_woo_public_export_contract.py    --date ${{ steps.d.outputs.date }}
      - name: M8.6 post-delivery verifiers
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          PYTHONPATH: src
        run: |
          D="${{ steps.d.outputs.date }}"
          python3 scripts/verify_oddsapi_market_registry_contract.py
          python3 scripts/verify_no_legacy_prediction_artifacts.py
          python3 scripts/verify_daily_delivery_folder_contract.py --date "$D" \
            --allow-missing after_game_scoring derek_forward_feed
          python3 scripts/verify_woo_public_artifacts_target_allowlist.py --date "$D"
          python3 scripts/verify_availability_freshness.py --date "$D" --mode close_lock
      - name: Stage and commit
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          # Phase 13I: stamp Derek/WoO manifests with active champion metadata
          # and verify the persisted stamp against artifacts/models/registry/champion_pointer.json.
          # require-both-sides=false because some delivery modes (woo_morning_monetization,
          # woo_afternoon_refresh) only produce WoO; Derek is generated later in the day.
          python scripts/stamp_delivery_champion_metadata.py \
            --delivery-date ${{ steps.d.outputs.date }}
          python scripts/verify_derek_woo_champion_dependency.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --require-both-sides false
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          if ! git add deliveries/${{ steps.d.outputs.date }} \
                       artifacts/delivery_metadata/${{ steps.d.outputs.date }} \
                       deliveries/README.md \
                       deliveries/index.html \
                       public_export/wizard_of_odds \
                       predictions/nba-props.html \
                       predictions/nba-pmf-research.html; then
            echo "::error::git add failed for one or more paths"
            exit 1
          fi
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "daily delivery champion metadata ${{ steps.d.outputs.date }} (woo_afternoon_refresh)"
          # Phase 13I: BDL refresh and other steps mutate tracked files
          # (e.g. data/player_game_stats.parquet) we explicitly do NOT commit.
          # Discard those working-tree changes so `git pull --rebase` can proceed.
          # Bug E (same root cause as Bug C in nightly_training): expand
          # the working-tree reset to cover verifier-mutated tracked files
          # this workflow writes but does NOT commit. All 6 jobs run
          # verify_derek_woo_champion_dependency.py which rewrites the
          # derek_woo_champion_dependency.{json,md} pair under
          # artifacts/automation_health/. refresh_daily_inputs.py mutates
          # data/player_game_stats.parquet via the BDL refresh.
          git checkout -- data/player_game_stats.parquet \
                          artifacts/automation_health/derek_woo_champion_dependency.json \
                          artifacts/automation_health/derek_woo_champion_dependency.md \
                          2>/dev/null || true
          # Bug E defensive secondary reset: catch any tracked file still
          # dirty (e.g. derek_near_lineup_contract_<date>.json on the
          # derek_near_lineup job, or a future verifier we forgot to
          # enumerate) so `git pull --rebase` can proceed.
          DIRTY_REMAINING=$(git diff --name-only)
          if [ -n "$DIRTY_REMAINING" ]; then
            echo "::notice::Bug E defensive reset — unexpected dirty tracked files:"
            echo "$DIRTY_REMAINING"
            git checkout -- $DIRTY_REMAINING 2>/dev/null || true
          fi
          PUSH_SUCCESS=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi

  # ── Derek near-lineup (first publishable Derek snapshot + every-15 refresh) ──
  derek_near_lineup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'derek_near_lineup') ||
      github.event.schedule == '25 22 * * *' ||
      github.event.schedule == '40,55 22 * * *' ||
      github.event.schedule == '10,25,40,55 23,0,1,2 * * *' ||
      github.event.schedule == '10 3 * * *'
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install -r requirements.txt
      # Phase 13AL: secrets preflight — fail fast on BDL/Odds gaps.
      - name: Secrets preflight (Phase 13AL)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 scripts/verify_secrets_preflight.py --mode daily
      - name: Resolve delivery date (America/New_York)
        id: d
        # Phase 13AJ: near-lineup cron windows extend across the UTC date
        # rollover (22:25 UTC through 03:10 UTC). Resolving with `date -u`
        # caused the late-night runs to ask for tomorrow's slate while
        # tonight's ET games were still active. Resolve using
        # America/New_York so the slate date matches the operator's
        # frame.
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            ET_DATE=$(TZ=America/New_York date +%Y-%m-%d)
            echo "Resolved delivery_date=$ET_DATE via America/New_York"
            echo "date=$ET_DATE" >> "$GITHUB_OUTPUT"
          fi

      # Phase 13AM: predictions-readiness gate. Replaces the looser Phase
      # 13AJ "Ensure dated predictions exist" step with a single source of
      # truth that emits WAITING_FOR_PREDICTIONS_VALID_SKIP (exit 0 GREEN)
      # when the slate's predictions parquet does not yet exist AND the
      # daily predict cron has not yet had a chance to fire. When the
      # cron-window has passed and predictions are still missing, the gate
      # invokes scripts/predict.py and fails loudly if predict.py can't
      # produce the dated artifacts.
      - name: Predictions readiness gate (Phase 13AM)
        id: predict_gate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          python3 scripts/predictions_readiness_gate.py \
            --date "${{ steps.d.outputs.date }}" \
            --predict-cron-hour-utc 13 \
            --mode "derek_near_lineup"

      - name: Run delivery pipeline (derek_near_lineup)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          DATE=${{ steps.d.outputs.date }}
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_FLAG="--force-run"
          fi
          python scripts/run_daily_delivery_pipeline.py \
            --date $DATE \
            --mode derek_near_lineup \
            --regions us us2 $FORCE_FLAG

      # Phase 13AM: refresh customer-facing JSON + HTML using the new pipeline.
      - name: Phase 13AM WoO new pipeline (publish/build/verify)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          python3 scripts/publish_woo_public_export.py     --date ${{ steps.d.outputs.date }}
          python3 scripts/build_woo_dashboard.py            --date ${{ steps.d.outputs.date }}
          python3 scripts/verify_woo_dashboard_render_contract.py --date ${{ steps.d.outputs.date }}
          python3 scripts/verify_woo_public_export_contract.py    --date ${{ steps.d.outputs.date }}

      - name: M8.6 post-delivery verifiers
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          PYTHONPATH: src
        run: |
          D="${{ steps.d.outputs.date }}"
          python3 scripts/verify_oddsapi_market_registry_contract.py
          python3 scripts/verify_no_legacy_prediction_artifacts.py
          python3 scripts/verify_daily_delivery_folder_contract.py --date "$D" \
            --allow-missing after_game_scoring
          python3 scripts/verify_woo_public_artifacts_target_allowlist.py --date "$D"
          python3 scripts/verify_availability_freshness.py --date "$D" --mode close_lock
      - name: M8.8 delivery + Derek contract audits (strict for t25)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          PYTHONPATH: src
        run: |
          D="${{ steps.d.outputs.date }}"
          python3 scripts/audit_daily_delivery_completeness.py \
            --start-date "$D" --end-date "$D" \
            --include-current-if-present \
            --out-dir artifacts/model_diagnostics/daily_delivery_completeness \
            --run-mode t25
          python3 scripts/verify_derek_forward_feed_contract.py --date "$D"
          PREV=$(python3 -c "import datetime as d; print((d.date.fromisoformat('${{ steps.d.outputs.date }}')-d.timedelta(days=1)).isoformat())")
          python3 scripts/audit_injury_lineup_run_modes.py \
            --date "$D" \
            --latest-completed-date "$PREV"
          python3 scripts/audit_github_delivery_automation.py

      # Phase 13AJ: enforce the near-lineup contract — predictions
      # parquet present, near-lineup output produced, no UTC/ET date
      # rollover mismatch. Hard-fails so the operator notices when the
      # contract is broken (was previously a non-blocking warning).
      - name: Verify near-lineup contract (Phase 13AJ)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          python3 scripts/verify_derek_near_lineup_contract.py \
            --date ${{ steps.d.outputs.date }} || { \
            echo "::error::near-lineup contract verifier FAILED - see step log"; exit 1; }
      - name: Stage and commit
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          # Phase 13I: stamp Derek/WoO manifests with active champion metadata
          # and verify the persisted stamp against artifacts/models/registry/champion_pointer.json.
          # require-both-sides=false because some delivery modes (woo_morning_monetization,
          # woo_afternoon_refresh) only produce WoO; Derek is generated later in the day.
          python scripts/stamp_delivery_champion_metadata.py \
            --delivery-date ${{ steps.d.outputs.date }}
          python scripts/verify_derek_woo_champion_dependency.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --require-both-sides false
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          if ! git add deliveries/${{ steps.d.outputs.date }} \
                       artifacts/delivery_metadata/${{ steps.d.outputs.date }} \
                       deliveries/README.md \
                       deliveries/index.html \
                       public_export/wizard_of_odds; then
            echo "::error::git add failed for one or more paths"
            exit 1
          fi
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "daily delivery champion metadata ${{ steps.d.outputs.date }} (derek_near_lineup)"
          # Phase 13I: BDL refresh and other steps mutate tracked files
          # (e.g. data/player_game_stats.parquet) we explicitly do NOT commit.
          # Discard those working-tree changes so `git pull --rebase` can proceed.
          # Bug E (same root cause as Bug C in nightly_training): expand
          # the working-tree reset to cover verifier-mutated tracked files
          # this workflow writes but does NOT commit. All 6 jobs run
          # verify_derek_woo_champion_dependency.py which rewrites the
          # derek_woo_champion_dependency.{json,md} pair under
          # artifacts/automation_health/. refresh_daily_inputs.py mutates
          # data/player_game_stats.parquet via the BDL refresh.
          git checkout -- data/player_game_stats.parquet \
                          artifacts/automation_health/derek_woo_champion_dependency.json \
                          artifacts/automation_health/derek_woo_champion_dependency.md \
                          2>/dev/null || true
          # Bug E defensive secondary reset: catch any tracked file still
          # dirty (e.g. derek_near_lineup_contract_<date>.json on the
          # derek_near_lineup job, or a future verifier we forgot to
          # enumerate) so `git pull --rebase` can proceed.
          DIRTY_REMAINING=$(git diff --name-only)
          if [ -n "$DIRTY_REMAINING" ]; then
            echo "::notice::Bug E defensive reset — unexpected dirty tracked files:"
            echo "$DIRTY_REMAINING"
            git checkout -- $DIRTY_REMAINING 2>/dev/null || true
          fi
          PUSH_SUCCESS=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi

