name: NBA PMF Delivery — Daily Pipeline

# Phase 12D-amend — Derek's evaluation feed and WoO's monetization feed
# now have separate scheduled lifecycles:
#
#   15:00 UTC = 11:00 AM ET (EDT)  woo_morning_monetization
#                                  first WoO public run of the day; monetization-
#                                  oriented; PROVISIONAL_EARLY_MARKET; lineups
#                                  not yet confirmed.
#   18:00 UTC = 2:00 PM ET         woo_afternoon_refresh
#   20:00 UTC = 4:00 PM ET         woo_afternoon_refresh
#   22:25 UTC = 6:25 PM ET         derek_near_lineup (earliest tipoff − 35 min
#                                  default during NBA playoffs); also refreshes
#                                  the WoO public export.
#   22:40 UTC ... 03:10 UTC every 15 min  derek_near_lineup
#   03:25 UTC = 11:25 PM ET        close_lock (final lineup/market lock)
#   06:30 UTC = 2:30 AM ET         after_game (post-final scoring)
#
# Wrapper invocations (per scripts/run_daily_delivery_pipeline.py):
#   1. scripts/refresh_daily_inputs.py      (us+us2 odds + freshness manifest)
#   2. scripts/predict.py                   (woo_morning_monetization /
#                                            morning / full_day, --predict only)
#   3. scripts/build_daily_pmf_delivery.py  (snapshot=mode-specific)
#   4. scripts/build_derek_forward_feed.py  (derek_near_lineup, close_lock,
#                                            after_game)
#   5. scripts/build_wizard_of_odds_public_export.py
#                                           (woo_*, derek_near_lineup,
#                                            close_lock; with monetization
#                                            labels for woo_* runs)
#   6. scripts/score_daily_pmf_delivery_after_game.py  (after_game)
#   7. scripts/build_deliveries_index.py    (always, last)
#
# Hard rules echoed by every job:
#   - never log ODDS_API_KEY, BDL_API_KEY, or affiliate config secrets
#   - never stage data/odds_api/, data/freshness_manifest/, artifacts/, logs,
#     dashboards, scratch files, or failed Phase 10D / 10D.2 reports
#   - never wire the failed Phase 10D / 10D.2 TOV overlays
#   - never fabricate affiliate URLs (when config/wizardofodds_affiliate_links.json
#     is absent or has no mapping for a book, monetization_status=
#     needs_affiliate_mapping and the URL fields stay blank)

on:
  schedule:
    # WoO monetization (early/afternoon).
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
    - cron: '0 20 * * *'
    # Derek near-lineup window — first publishable evaluation snapshot
    # at 22:25 UTC, then every 15 min through 03:10 UTC.
    - cron: '25 22 * * *'
    - cron: '40,55 22 * * *'
    - cron: '10,25,40,55 23,0,1,2 * * *'
    - cron: '10 3 * * *'
    # Late close lock.
    - cron: '25 3 * * *'
    # After-game scoring (yesterday's slate).
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Wrapper mode"
        required: true
        default: derek_near_lineup
        type: choice
        options:
          - woo_morning_monetization
          - woo_afternoon_refresh
          - derek_near_lineup
          - close_lock
          - after_game
          - full_day
          - morning
      delivery_date:
        description: "Delivery date (YYYY-MM-DD); blank = today (UTC)"
        required: false
        default: ""
      run_predict:
        description: "Run scripts/predict.py before refresh (woo_morning_monetization / morning / full_day only). Requires BDL_API_KEY."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_run:
        description: "Bypass the tipoff-window gate (used for manual backfills outside the lineup window)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ── Morning (manual-only since Phase 12D) ────────────────────────────────
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'morning'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy requests joblib scikit-learn
      - name: Resolve delivery date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run delivery pipeline (morning, manual)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          PREDICT_FLAG=""
          if [ "${{ github.event.inputs.run_predict }}" = "true" ]; then
            PREDICT_FLAG="--predict"
          fi
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_FLAG="--force-run"
          fi
          python scripts/run_daily_delivery_pipeline.py \
            --date ${{ steps.d.outputs.date }} \
            --mode morning \
            --regions us us2 \
            --rebuild-canonical $PREDICT_FLAG $FORCE_FLAG
      - name: Stage and commit approved files
        run: |
          # Phase 13I: stamp Derek/WoO manifests with active champion metadata
          # and verify the persisted stamp against artifacts/models/registry/champion_pointer.json.
          # require-both-sides=false because some delivery modes (woo_morning_monetization,
          # woo_afternoon_refresh) only produce WoO; Derek is generated later in the day.
          python scripts/stamp_delivery_champion_metadata.py \
            --delivery-date ${{ steps.d.outputs.date }}
          python scripts/verify_derek_woo_champion_dependency.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --require-both-sides false
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          git add deliveries/${{ steps.d.outputs.date }} \
                  artifacts/delivery_metadata/${{ steps.d.outputs.date }} \
                  deliveries/README.md \
                  deliveries/index.html \
                  public_export/wizard_of_odds || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "daily delivery champion metadata ${{ steps.d.outputs.date }} (morning)"
          # Phase 13I: BDL refresh and other steps mutate tracked files
          # (e.g. data/player_game_stats.parquet) we explicitly do NOT commit.
          # Discard those working-tree changes so `git pull --rebase` can proceed.
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done

  # ── WoO morning monetization (15:00 UTC = 11 AM ET) ──────────────────────
  woo_morning_monetization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'woo_morning_monetization') ||
      github.event.schedule == '0 15 * * *'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy requests joblib scikit-learn
      - name: Resolve delivery date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run delivery pipeline (woo_morning_monetization)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          PREDICT_FLAG=""
          if [ "${{ github.event.inputs.run_predict }}" = "true" ]; then
            PREDICT_FLAG="--predict"
          fi
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_FLAG="--force-run"
          fi
          python scripts/run_daily_delivery_pipeline.py \
            --date ${{ steps.d.outputs.date }} \
            --mode woo_morning_monetization \
            --regions us us2 \
            --rebuild-canonical $PREDICT_FLAG $FORCE_FLAG
      - name: Stage and commit approved files
        run: |
          # Phase 13I: stamp Derek/WoO manifests with active champion metadata
          # and verify the persisted stamp against artifacts/models/registry/champion_pointer.json.
          # require-both-sides=false because some delivery modes (woo_morning_monetization,
          # woo_afternoon_refresh) only produce WoO; Derek is generated later in the day.
          python scripts/stamp_delivery_champion_metadata.py \
            --delivery-date ${{ steps.d.outputs.date }}
          python scripts/verify_derek_woo_champion_dependency.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --require-both-sides false
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          git add deliveries/${{ steps.d.outputs.date }} \
                  artifacts/delivery_metadata/${{ steps.d.outputs.date }} \
                  deliveries/README.md \
                  deliveries/index.html \
                  public_export/wizard_of_odds || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "daily delivery champion metadata ${{ steps.d.outputs.date }} (woo_morning_monetization)"
          # Phase 13I: BDL refresh and other steps mutate tracked files
          # (e.g. data/player_game_stats.parquet) we explicitly do NOT commit.
          # Discard those working-tree changes so `git pull --rebase` can proceed.
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done

  # ── WoO afternoon refresh (18:00 + 20:00 UTC) ────────────────────────────
  woo_afternoon_refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'woo_afternoon_refresh') ||
      github.event.schedule == '0 18 * * *' ||
      github.event.schedule == '0 20 * * *'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy requests joblib scikit-learn
      - name: Resolve delivery date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run delivery pipeline (woo_afternoon_refresh)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_FLAG="--force-run"
          fi
          python scripts/run_daily_delivery_pipeline.py \
            --date ${{ steps.d.outputs.date }} \
            --mode woo_afternoon_refresh \
            --regions us us2 $FORCE_FLAG
      - name: Stage and commit
        run: |
          # Phase 13I: stamp Derek/WoO manifests with active champion metadata
          # and verify the persisted stamp against artifacts/models/registry/champion_pointer.json.
          # require-both-sides=false because some delivery modes (woo_morning_monetization,
          # woo_afternoon_refresh) only produce WoO; Derek is generated later in the day.
          python scripts/stamp_delivery_champion_metadata.py \
            --delivery-date ${{ steps.d.outputs.date }}
          python scripts/verify_derek_woo_champion_dependency.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --require-both-sides false
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          git add deliveries/${{ steps.d.outputs.date }} \
                  artifacts/delivery_metadata/${{ steps.d.outputs.date }} \
                  deliveries/README.md \
                  deliveries/index.html \
                  public_export/wizard_of_odds || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "daily delivery champion metadata ${{ steps.d.outputs.date }} (woo_afternoon_refresh)"
          # Phase 13I: BDL refresh and other steps mutate tracked files
          # (e.g. data/player_game_stats.parquet) we explicitly do NOT commit.
          # Discard those working-tree changes so `git pull --rebase` can proceed.
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done

  # ── Derek near-lineup (first publishable Derek snapshot + every-15 refresh) ──
  derek_near_lineup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'derek_near_lineup') ||
      github.event.schedule == '25 22 * * *' ||
      github.event.schedule == '40,55 22 * * *' ||
      github.event.schedule == '10,25,40,55 23,0,1,2 * * *' ||
      github.event.schedule == '10 3 * * *'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy requests joblib scikit-learn
      - name: Resolve delivery date (America/New_York)
        id: d
        # Phase 13AJ: near-lineup cron windows extend across the UTC date
        # rollover (22:25 UTC through 03:10 UTC). Resolving with `date -u`
        # caused the late-night runs to ask for tomorrow's slate while
        # tonight's ET games were still active. Resolve using
        # America/New_York so the slate date matches the operator's
        # frame.
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            ET_DATE=$(TZ=America/New_York date +%Y-%m-%d)
            echo "Resolved delivery_date=$ET_DATE via America/New_York"
            echo "date=$ET_DATE" >> "$GITHUB_OUTPUT"
          fi

      # Phase 13AJ: hard prerequisite — predictions/all_props_<date>.parquet
      # must exist before near-lineup can compute snapshot deltas. If
      # missing, generate it via predict.py with the dated slate. If
      # predict.py also fails (e.g. odds API rate limit), surface a
      # WAITING_FOR_PREDICTIONS exit instead of an opaque pipeline crash.
      - name: Ensure dated predictions exist (Phase 13AJ)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          DATE=${{ steps.d.outputs.date }}
          PARQUET="predictions/all_props_${DATE}.parquet"
          if [ -f "$PARQUET" ]; then
            echo "predictions parquet present: $PARQUET"
          else
            echo "::warning::predictions parquet missing — invoking predict.py before near-lineup"
            python scripts/predict.py || {
              echo "::error::predict.py failed; near-lineup cannot run without dated predictions. Exiting WAITING_FOR_PREDICTIONS."
              echo "WAITING_FOR_PREDICTIONS  date=$DATE"
              exit 0
            }
          fi
          if [ ! -f "$PARQUET" ]; then
            echo "::error::predict.py finished but $PARQUET still missing. Exiting WAITING_FOR_PREDICTIONS."
            echo "WAITING_FOR_PREDICTIONS  date=$DATE"
            exit 0
          fi
          python3 scripts/verify_daily_prediction_outputs.py --date "$DATE"

      - name: Run delivery pipeline (derek_near_lineup)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          DATE=${{ steps.d.outputs.date }}
          PARQUET="predictions/all_props_${DATE}.parquet"
          if [ ! -f "$PARQUET" ]; then
            echo "::error::predictions parquet still missing; refusing to run near-lineup pipeline"
            echo "WAITING_FOR_PREDICTIONS  date=$DATE"
            exit 0
          fi
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_FLAG="--force-run"
          fi
          python scripts/run_daily_delivery_pipeline.py \
            --date $DATE \
            --mode derek_near_lineup \
            --regions us us2 $FORCE_FLAG

      # Phase 13AJ: enforce the near-lineup contract — predictions
      # parquet present, near-lineup output produced, no UTC/ET date
      # rollover mismatch. Non-blocking warning so the operator can see
      # the contract status in the workflow log without re-failing the
      # job that just succeeded.
      - name: Verify near-lineup contract (Phase 13AJ)
        continue-on-error: true
        run: |
          python3 scripts/verify_derek_near_lineup_contract.py \
            --date ${{ steps.d.outputs.date }} || \
            echo "::warning::near-lineup contract verifier WARN/FAILED — see step log"
      - name: Stage and commit
        run: |
          # Phase 13I: stamp Derek/WoO manifests with active champion metadata
          # and verify the persisted stamp against artifacts/models/registry/champion_pointer.json.
          # require-both-sides=false because some delivery modes (woo_morning_monetization,
          # woo_afternoon_refresh) only produce WoO; Derek is generated later in the day.
          python scripts/stamp_delivery_champion_metadata.py \
            --delivery-date ${{ steps.d.outputs.date }}
          python scripts/verify_derek_woo_champion_dependency.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --require-both-sides false
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          git add deliveries/${{ steps.d.outputs.date }} \
                  artifacts/delivery_metadata/${{ steps.d.outputs.date }} \
                  deliveries/README.md \
                  deliveries/index.html \
                  public_export/wizard_of_odds || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "daily delivery champion metadata ${{ steps.d.outputs.date }} (derek_near_lineup)"
          # Phase 13I: BDL refresh and other steps mutate tracked files
          # (e.g. data/player_game_stats.parquet) we explicitly do NOT commit.
          # Discard those working-tree changes so `git pull --rebase` can proceed.
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done

  # ── Close lock (late-slate snapshot, 03:25 UTC) ──────────────────────────
  close_lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'close_lock') ||
      github.event.schedule == '25 3 * * *'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy requests joblib scikit-learn
      - name: Resolve delivery date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run delivery pipeline (close_lock)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_FLAG="--force-run"
          fi
          python scripts/run_daily_delivery_pipeline.py \
            --date ${{ steps.d.outputs.date }} \
            --mode close_lock \
            --regions us us2 $FORCE_FLAG
      - name: Stage and commit
        run: |
          # Phase 13I: stamp Derek/WoO manifests with active champion metadata
          # and verify the persisted stamp against artifacts/models/registry/champion_pointer.json.
          # require-both-sides=false because some delivery modes (woo_morning_monetization,
          # woo_afternoon_refresh) only produce WoO; Derek is generated later in the day.
          python scripts/stamp_delivery_champion_metadata.py \
            --delivery-date ${{ steps.d.outputs.date }}
          python scripts/verify_derek_woo_champion_dependency.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --require-both-sides false
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          git add deliveries/${{ steps.d.outputs.date }} \
                  artifacts/delivery_metadata/${{ steps.d.outputs.date }} \
                  deliveries/README.md \
                  deliveries/index.html \
                  public_export/wizard_of_odds || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "daily delivery champion metadata ${{ steps.d.outputs.date }} (close_lock)"
          # Phase 13I: BDL refresh and other steps mutate tracked files
          # (e.g. data/player_game_stats.parquet) we explicitly do NOT commit.
          # Discard those working-tree changes so `git pull --rebase` can proceed.
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done

  # ── After-game (yesterday's slate) ───────────────────────────────────────
  after_game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'after_game') ||
      github.event.schedule == '30 6 * * *'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy requests joblib scikit-learn
      - name: Resolve delivery date (yesterday)
        id: d
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u -d 'yesterday' +%Y-%m-%d 2>/dev/null || \
              date -u -v-1d +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run delivery pipeline (after_game)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          python scripts/run_daily_delivery_pipeline.py \
            --date ${{ steps.d.outputs.date }} \
            --mode after_game
      - name: Phase 13K — re-run scorer for canonical artifacts
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          # The pipeline above invokes score_daily_pmf_delivery_after_game.py
          # already, but re-running the scorer directly guarantees the
          # Phase 13K artifacts (pmf_model_review_package/run_manifest.json,
          # expected_target_stats_coverage.{json,md}, model_vs_market_scoring.*)
          # are produced even on machines where the wrapper short-circuits.
          python scripts/score_daily_pmf_delivery_after_game.py \
            --date ${{ steps.d.outputs.date }}
      - name: Phase 13K — stamp Derek/WoO/PMF-review manifests
        # Stamp BEFORE consistency verification so the verifier sees a
        # consistent state. The Stage-and-commit step below still re-runs
        # stamping + Derek/WoO dependency check idempotently, which is fine.
        run: |
          python scripts/stamp_delivery_champion_metadata.py \
            --delivery-date ${{ steps.d.outputs.date }}
      - name: Phase 13K — after-game package consistency
        run: |
          python scripts/verify_after_game_scoring_package_consistency.py \
            --delivery-date ${{ steps.d.outputs.date }}
      - name: Phase 13K — rolling market benchmark
        run: |
          python scripts/build_rolling_market_benchmark.py \
            --as-of-date ${{ steps.d.outputs.date }} \
            --window-days 28 || echo "::warning::rolling market benchmark insufficient_sample"
      - name: Phase 13AA — PMF variance experience study (non-blocking)
        # Runs after after-game scoring so settled outcomes are joined.
        # Honest insufficient-sample reports are written to disk; this step
        # never fails the workflow because thin samples are expected during
        # ramp-up.
        continue-on-error: true
        run: |
          python scripts/build_pmf_variance_experience_study.py \
            --as-of-date ${{ steps.d.outputs.date }} \
            --lookback-days 60 \
            --min-bucket-n 30 || \
            echo "::warning::pmf variance experience study insufficient_sample_or_missing_inputs"
          python scripts/verify_pmf_variance_experience_study.py \
            --as-of-date ${{ steps.d.outputs.date }} || \
            echo "::warning::pmf variance experience verifier WARN/FAILED — see step log"
      - name: Stage and commit
        run: |
          # Phase 13I: stamp Derek/WoO manifests with active champion metadata
          # and verify the persisted stamp against artifacts/models/registry/champion_pointer.json.
          # require-both-sides=false because some delivery modes (woo_morning_monetization,
          # woo_afternoon_refresh) only produce WoO; Derek is generated later in the day.
          python scripts/stamp_delivery_champion_metadata.py \
            --delivery-date ${{ steps.d.outputs.date }}
          python scripts/verify_derek_woo_champion_dependency.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --require-both-sides false
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          # Phase 13K: also commit the new after-game scoring artifacts +
          # rolling market benchmark JSON/MD reports.
          git add deliveries/${{ steps.d.outputs.date }} \
                  artifacts/delivery_metadata/${{ steps.d.outputs.date }} \
                  artifacts/market_benchmark/${{ steps.d.outputs.date }} \
                  artifacts/automation_health \
                  artifacts/experience_studies \
                  deliveries/README.md \
                  deliveries/index.html
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "daily delivery champion metadata ${{ steps.d.outputs.date }} (after_game)"
          # Phase 13I: BDL refresh and other steps mutate tracked files
          # (e.g. data/player_game_stats.parquet) we explicitly do NOT commit.
          # Discard those working-tree changes so `git pull --rebase` can proceed.
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done
