name: NBA PMF Delivery — Daily Pipeline

# Four jobs aligned to the snapshot lifecycle in
# docs/daily_pmf_delivery_spec.md:
#
#   13:30 UTC = 8:30 AM ET  morning            (>=4 hr to first tip)
#   22:30 UTC = 5:30 PM ET  pre_close          (~30 min before early-window tips)
#   23:50 UTC = 6:50 PM ET  close_lock         (T-5 min from typical tip)
#   06:30 UTC = 1:30 AM ET  after_game         (post-final scoring)
#
# Each job:
#   1. runs scripts/refresh_daily_inputs.py to pull odds (regions us+us2)
#      and write data/freshness_manifest/{date}.json
#   2. runs scripts/build_daily_pmf_delivery.py with the appropriate
#      --snapshot value, which consumes the freshness manifest
#   3. (after_game only) runs scripts/score_daily_pmf_delivery_after_game.py
#
# Hard rules echoed by every job:
#   - never logs ODDS_API_KEY
#   - never stages data/odds_api/, data/freshness_manifest/, artifacts/, or
#     scratch files. Only the deliveries/{date}/ folders and the model_only
#     canonical_source are staged.
#   - never wires the failed Phase 10D / 10D.2 TOV overlays.

on:
  schedule:
    - cron: '30 13 * * *'   # 8:30 AM ET — morning
    - cron: '30 22 * * *'   # 5:30 PM ET — pre_close
    - cron: '50 23 * * *'   # 6:50 PM ET — close_lock
    - cron: '30 6 * * *'    # 1:30 AM ET — after_game (yesterday's slate)
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Snapshot type to run"
        required: true
        default: morning
        type: choice
        options:
          - morning
          - pre_close
          - close_lock
          - after_game
      delivery_date:
        description: "Delivery date (YYYY-MM-DD); blank = today (UTC)"
        required: false
        default: ""

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ── Morning ───────────────────────────────────────────────────────────────
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.snapshot == 'morning' ||
      github.event.schedule == '30 13 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy requests
      - name: Resolve delivery date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh inputs (us + us2 odds, freshness manifest)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/refresh_daily_inputs.py \
            --date ${{ steps.d.outputs.date }} \
            --regions us us2 \
            --snapshot-type morning_7am \
            --max-events 20
      - name: Build delivery (morning)
        run: |
          python scripts/build_daily_pmf_delivery.py \
            --date ${{ steps.d.outputs.date }} \
            --snapshot morning
      - name: Stage approved code/docs and validated delivery folder
        run: |
          git config user.name "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add deliveries/${{ steps.d.outputs.date }}/canonical_source \
                  deliveries/${{ steps.d.outputs.date }}/pmf_model_review_package \
                  deliveries/${{ steps.d.outputs.date }}/wizard_of_odds
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "morning delivery ${{ steps.d.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done

  # ── Pre-close ────────────────────────────────────────────────────────────
  pre_close:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.snapshot == 'pre_close' ||
      github.event.schedule == '30 22 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy requests
      - name: Resolve delivery date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh inputs (us + us2 odds)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/refresh_daily_inputs.py \
            --date ${{ steps.d.outputs.date }} \
            --regions us us2 \
            --snapshot-type close_or_lock \
            --max-events 20
      - name: Build delivery (pre_close)
        run: |
          python scripts/build_daily_pmf_delivery.py \
            --date ${{ steps.d.outputs.date }} \
            --snapshot pre_close
      - name: Stage delivery folder
        run: |
          git config user.name "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add deliveries/${{ steps.d.outputs.date }}/canonical_source \
                  deliveries/${{ steps.d.outputs.date }}/pmf_model_review_package \
                  deliveries/${{ steps.d.outputs.date }}/wizard_of_odds
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "pre_close delivery ${{ steps.d.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done

  # ── Close lock (T-5 min) ─────────────────────────────────────────────────
  close_lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.snapshot == 'close_lock' ||
      github.event.schedule == '50 23 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy requests
      - name: Resolve delivery date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh inputs (us + us2 odds)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/refresh_daily_inputs.py \
            --date ${{ steps.d.outputs.date }} \
            --regions us us2 \
            --snapshot-type close_or_lock \
            --max-events 20
      - name: Build delivery (close_lock)
        run: |
          python scripts/build_daily_pmf_delivery.py \
            --date ${{ steps.d.outputs.date }} \
            --snapshot close_lock
      - name: Stage delivery folder
        run: |
          git config user.name "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add deliveries/${{ steps.d.outputs.date }}/canonical_source \
                  deliveries/${{ steps.d.outputs.date }}/pmf_model_review_package \
                  deliveries/${{ steps.d.outputs.date }}/wizard_of_odds
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "close_lock delivery ${{ steps.d.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done

  # ── After-game (yesterday's slate) ───────────────────────────────────────
  after_game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.snapshot == 'after_game' ||
      github.event.schedule == '30 6 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy requests
      - name: Resolve delivery date (yesterday)
        id: d
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u -d 'yesterday' +%Y-%m-%d 2>/dev/null || \
              date -u -v-1d +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh inputs (no odds fetch)
        run: |
          python scripts/refresh_daily_inputs.py \
            --date ${{ steps.d.outputs.date }} \
            --no-odds-fetch
      - name: Score after-game outcomes
        run: |
          python scripts/score_daily_pmf_delivery_after_game.py \
            --date ${{ steps.d.outputs.date }}
      - name: Stage scored delivery folder
        run: |
          git config user.name "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add deliveries/${{ steps.d.outputs.date }}/pmf_model_review_package \
                  deliveries/${{ steps.d.outputs.date }}/wizard_of_odds
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "after_game scoring ${{ steps.d.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done
