name: NBA PMF Delivery — Daily Pipeline

# Phase 12D — first publishable run is near-lineup, not morning. The
# old morning job (13:30 UTC / 8:30 AM ET) has been retired; the slate
# is now refreshed every 15 minutes from 22:25 UTC through 03:10 UTC
# so later-game lineup / inactive updates are captured. Snapshot
# lifecycle is documented in docs/daily_pmf_delivery_spec.md and
# orchestrated by scripts/run_daily_delivery_pipeline.py:
#
#   22:25 UTC = 6:25 PM ET  pre_close    (first publishable run during
#                                          NBA playoffs — earliest
#                                          tipoff − 35 min default)
#   22:40,55 / 23:10..02:55 / 03:10 UTC  pre_close (every 15 min refresh)
#   03:25 UTC = 11:25 PM ET pre_close → close_lock late-slate snapshot
#   06:30 UTC = 2:30 AM  ET after_game   (post-final scoring of yesterday)
#
# The wrapper invokes (in order, per mode):
#   1. scripts/refresh_daily_inputs.py            (us+us2 odds + freshness manifest)
#   2. scripts/predict.py                         (morning + full_day, --predict only)
#   3. scripts/build_daily_pmf_delivery.py        (snapshot=mode)
#   4. scripts/build_derek_forward_feed.py        (morning -> --snapshot morning,
#                                                  pre_close/close_lock -> --snapshot lineup,
#                                                  after_game -> --snapshot both;
#                                                  honestly writes lineup_snapshot_status.json
#                                                  when no lineup-locked package exists)
#   5. scripts/score_daily_pmf_delivery_after_game.py  (after_game / full_day)
#   6. scripts/build_deliveries_index.py          (always, last)
#
# Secrets are referenced exclusively as env vars; never echoed.
#   - ODDS_API_KEY  required for live odds fetch
#   - BDL_API_KEY   required for live BDL injury / lineup / box-score fetch
#                   (predict.py degrades gracefully when missing — the
#                    wrapper's --predict flag is opt-in)
#
# Hard rules echoed by every job:
#   - never log ODDS_API_KEY or BDL_API_KEY
#   - never stage data/odds_api/, data/freshness_manifest/, artifacts/, logs
#     dashboards, scratch files, or failed Phase 10D / 10D.2 reports
#   - never wire the failed Phase 10D / 10D.2 TOV overlays

on:
  schedule:
    # First near-lineup run (default playoff fallback for "earliest
    # tipoff − 35 min").
    - cron: '25 22 * * *'
    # Every 15 minutes through the slate. Cron splits below keep the
    # entries minimal and explicit.
    - cron: '40,55 22 * * *'
    - cron: '10,25,40,55 23,0,1,2 * * *'
    - cron: '10 3 * * *'
    # Late-slate close lock.
    - cron: '25 3 * * *'
    # After-game scoring (yesterday's slate).
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Wrapper mode"
        required: true
        default: pre_close
        type: choice
        options:
          - pre_close
          - close_lock
          - after_game
          - full_day
          - morning
      delivery_date:
        description: "Delivery date (YYYY-MM-DD); blank = today (UTC)"
        required: false
        default: ""
      run_predict:
        description: "Run scripts/predict.py before refresh (morning/full_day only). Requires BDL_API_KEY."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_run:
        description: "Bypass tipoff-window gate and force the run"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ── Morning (manual-only since Phase 12D) ────────────────────────────────
  # Retained for backfill / one-off catch-up via workflow_dispatch. The
  # morning cron has been retired; first publishable scheduled run is
  # the 22:25 UTC pre_close job below.
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'morning'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy requests joblib scikit-learn
      - name: Resolve delivery date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run delivery pipeline (morning, manual)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          PREDICT_FLAG=""
          if [ "${{ github.event.inputs.run_predict }}" = "true" ]; then
            PREDICT_FLAG="--predict"
          fi
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_FLAG="--force-run"
          fi
          python scripts/run_daily_delivery_pipeline.py \
            --date ${{ steps.d.outputs.date }} \
            --mode morning \
            --regions us us2 \
            --rebuild-canonical $PREDICT_FLAG $FORCE_FLAG
      - name: Stage and commit approved files
        run: |
          git config user.name "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add deliveries/${{ steps.d.outputs.date }} \
                  deliveries/README.md \
                  deliveries/index.html
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "morning delivery ${{ steps.d.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done

  # ── Pre-close (first publishable run + every-15-min lineup refresh) ──────
  pre_close:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'pre_close') ||
      github.event.schedule == '25 22 * * *' ||
      github.event.schedule == '40,55 22 * * *' ||
      github.event.schedule == '10,25,40,55 23,0,1,2 * * *' ||
      github.event.schedule == '10 3 * * *'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy requests joblib scikit-learn
      - name: Resolve delivery date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run delivery pipeline (pre_close)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_FLAG="--force-run"
          fi
          python scripts/run_daily_delivery_pipeline.py \
            --date ${{ steps.d.outputs.date }} \
            --mode pre_close \
            --regions us us2 $FORCE_FLAG
      - name: Stage and commit
        run: |
          git config user.name "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add deliveries/${{ steps.d.outputs.date }} \
                  deliveries/README.md \
                  deliveries/index.html
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "pre_close delivery ${{ steps.d.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done

  # ── Close lock (late-slate snapshot, 03:25 UTC) ──────────────────────────
  close_lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'close_lock') ||
      github.event.schedule == '25 3 * * *'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy requests joblib scikit-learn
      - name: Resolve delivery date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run delivery pipeline (close_lock)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_FLAG="--force-run"
          fi
          python scripts/run_daily_delivery_pipeline.py \
            --date ${{ steps.d.outputs.date }} \
            --mode close_lock \
            --regions us us2 $FORCE_FLAG
      - name: Stage and commit
        run: |
          git config user.name "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add deliveries/${{ steps.d.outputs.date }} \
                  deliveries/README.md \
                  deliveries/index.html
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "close_lock delivery ${{ steps.d.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done

  # ── After-game (yesterday's slate) ───────────────────────────────────────
  after_game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'after_game') ||
      github.event.schedule == '30 6 * * *'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy requests joblib scikit-learn
      - name: Resolve delivery date (yesterday)
        id: d
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u -d 'yesterday' +%Y-%m-%d 2>/dev/null || \
              date -u -v-1d +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run delivery pipeline (after_game)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          python scripts/run_daily_delivery_pipeline.py \
            --date ${{ steps.d.outputs.date }} \
            --mode after_game
      - name: Stage and commit
        run: |
          git config user.name "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add deliveries/${{ steps.d.outputs.date }} \
                  deliveries/README.md \
                  deliveries/index.html
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "after_game scoring ${{ steps.d.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done
