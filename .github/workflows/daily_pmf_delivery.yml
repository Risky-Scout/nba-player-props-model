  # ── After-game (yesterday's slate) ───────────────────────────────────────
  after_game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'after_game') ||
      github.event.schedule == '30 6 * * *'
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install -r requirements.txt
      # Phase 13AL: secrets preflight — fail fast on BDL/Odds gaps.
      - name: Secrets preflight (Phase 13AL)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 scripts/verify_secrets_preflight.py --mode daily
      - name: Resolve delivery date (yesterday, America/New_York)
        id: d
        # Phase 13AM: ET-anchored "yesterday" so after-game scoring keys
        # the slate the operator just watched, not the UTC-rolled date.
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            ET_PREV=$(TZ=America/New_York date -d 'yesterday' +%Y-%m-%d 2>/dev/null \
                       || TZ=America/New_York date -v-1d +%Y-%m-%d)
            echo "Resolved delivery_date=$ET_PREV via America/New_York yesterday"
            echo "date=$ET_PREV" >> "$GITHUB_OUTPUT"
          fi
      - name: Predictions readiness gate (Phase 13AM, after-game)
        id: predict_gate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          # After-game scores yesterday's slate, so predictions must
          # already exist. There is no point invoking predict.py for a
          # past slate, so the gate is configured with --no-run-predict
          # (still emits WAITING_FOR_PREDICTIONS_VALID_SKIP if the prior
          # day's predictions never landed, instead of red-failing).
          python3 scripts/predictions_readiness_gate.py \
            --date "${{ steps.d.outputs.date }}" \
            --predict-cron-hour-utc 13 \
            --mode "after_game" \
            --no-run-predict
      - name: Run delivery pipeline (after_game)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          python scripts/run_daily_delivery_pipeline.py \
            --date ${{ steps.d.outputs.date }} \
            --mode after_game
      - name: Phase 13K — re-run scorer for canonical artifacts
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          # The pipeline above invokes score_daily_pmf_delivery_after_game.py
          # already, but re-running the scorer directly guarantees the
          # Phase 13K artifacts (pmf_model_review_package/run_manifest.json,
          # expected_target_stats_coverage.{json,md}, model_vs_market_scoring.*)
          # are produced even on machines where the wrapper short-circuits.
          python scripts/score_daily_pmf_delivery_after_game.py \
            --date ${{ steps.d.outputs.date }}
      - name: Phase 13K — stamp Derek/WoO/PMF-review manifests
        if: steps.predict_gate.outputs.should_proceed == 'true'
        # Stamp BEFORE consistency verification so the verifier sees a
        # consistent state. The Stage-and-commit step below still re-runs
        # stamping + Derek/WoO dependency check idempotently, which is fine.
        run: |
          python scripts/stamp_delivery_champion_metadata.py \
            --delivery-date ${{ steps.d.outputs.date }}
      - name: Phase 13K — after-game package consistency
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          python scripts/verify_after_game_scoring_package_consistency.py \
            --delivery-date ${{ steps.d.outputs.date }}
      - name: M8.6 after-game delivery contract verifiers
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          PYTHONPATH: src
        run: |
          D="${{ steps.d.outputs.date }}"
          python3 scripts/verify_oddsapi_market_registry_contract.py
          python3 scripts/verify_no_legacy_prediction_artifacts.py
          python3 scripts/verify_daily_delivery_folder_contract.py --date "$D"
          python3 scripts/verify_availability_freshness.py --date "$D" --mode close_lock
          python3 scripts/verify_woo_public_artifacts_target_allowlist.py --date "$D"
      - name: Phase 13K — rolling market benchmark
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          python scripts/build_rolling_market_benchmark.py \
            --as-of-date ${{ steps.d.outputs.date }} \
            --window-days 28 || echo "::warning::rolling market benchmark insufficient_sample"
      - name: Phase 13AA — PMF variance experience study (non-blocking)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        # Runs after after-game scoring so settled outcomes are joined.
        # Honest insufficient-sample reports are written to disk; this step
        # never fails the workflow because thin samples are expected during
        # ramp-up.
        continue-on-error: true
        run: |
          python scripts/build_pmf_variance_experience_study.py \
            --as-of-date ${{ steps.d.outputs.date }} \
            --lookback-days 60 \
            --min-bucket-n 30 || \
            echo "::warning::pmf variance experience study insufficient_sample_or_missing_inputs"
          python scripts/verify_pmf_variance_experience_study.py \
            --as-of-date ${{ steps.d.outputs.date }} || \
            echo "::warning::pmf variance experience verifier WARN/FAILED — see step log"
      - name: Stage and commit
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          # Phase 13I: stamp Derek/WoO manifests with active champion metadata
          # and verify the persisted stamp against artifacts/models/registry/champion_pointer.json.
          # require-both-sides=false because some delivery modes (woo_morning_monetization,
          # woo_afternoon_refresh) only produce WoO; Derek is generated later in the day.
          python scripts/stamp_delivery_champion_metadata.py \
            --delivery-date ${{ steps.d.outputs.date }}
          python scripts/verify_derek_woo_champion_dependency.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --require-both-sides false
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          # Phase 13K: also commit the new after-game scoring artifacts +
          # rolling market benchmark JSON/MD reports.
          git add deliveries/${{ steps.d.outputs.date }} \
                  artifacts/delivery_metadata/${{ steps.d.outputs.date }} \
                  artifacts/market_benchmark/${{ steps.d.outputs.date }} \
                  artifacts/automation_health \
                  artifacts/experience_studies \
                  deliveries/README.md \
                  deliveries/index.html
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "daily delivery champion metadata ${{ steps.d.outputs.date }} (after_game)"
          # Phase 13I: BDL refresh and other steps mutate tracked files
          # (e.g. data/player_game_stats.parquet) we explicitly do NOT commit.
          # Discard those working-tree changes so `git pull --rebase` can proceed.
          # Bug E (same root cause as Bug C in nightly_training): expand
          # the working-tree reset to cover verifier-mutated tracked files
          # this workflow writes but does NOT commit. All 6 jobs run
          # verify_derek_woo_champion_dependency.py which rewrites the
          # derek_woo_champion_dependency.{json,md} pair under
          # artifacts/automation_health/. refresh_daily_inputs.py mutates
          # data/player_game_stats.parquet via the BDL refresh.
          git checkout -- data/player_game_stats.parquet \
                          artifacts/automation_health/derek_woo_champion_dependency.json \
                          artifacts/automation_health/derek_woo_champion_dependency.md \
                          2>/dev/null || true
          # Bug E defensive secondary reset: catch any tracked file still
          # dirty (e.g. derek_near_lineup_contract_<date>.json on the
          # derek_near_lineup job, or a future verifier we forgot to
          # enumerate) so `git pull --rebase` can proceed.
          DIRTY_REMAINING=$(git diff --name-only)
          if [ -n "$DIRTY_REMAINING" ]; then
            echo "::notice::Bug E defensive reset — unexpected dirty tracked files:"
            echo "$DIRTY_REMAINING"
            git checkout -- $DIRTY_REMAINING 2>/dev/null || true
          fi
          PUSH_SUCCESS=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi

      # M9: classify the after_game outcome so the operator log distinguishes
      # "successfully scored" from "valid-skipped because nothing to score"
      # (the gate runs in --no-run-predict mode for past slates).
      - name: Classify after_game outcome
        if: always()
        run: |
          if [ "${{ steps.predict_gate.outputs.should_proceed }}" != "true" ]; then
            echo "::notice::AFTER_GAME_VALID_SKIP date=${{ steps.d.outputs.date }} reason=gate_skipped"
          else
            echo "::notice::AFTER_GAME_RAN date=${{ steps.d.outputs.date }}"
          fi

  derek_schedule_bridge:
    name: Derek schedule bridge from PMF delivery cron
    if: ${{ (github.event_name == 'schedule' && (github.event.schedule == '25 22 * * *' || github.event.schedule == '40,55 22 * * *' || github.event.schedule == '10,25,40,55 23,0,1,2 * * *' || github.event.schedule == '10 3 * * *' || github.event.schedule == '25 3 * * *')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'derek_near_lineup' || github.event.inputs.mode == 'close_lock')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger Derek due-snapshot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          echo "Triggering Derek due-snapshot workflow for $DATE"
          gh workflow run derek_live_game_snapshots.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f delivery_date="$DATE" \
            -f snapshot_type=all \
            -f allow_backfill_test=false \
            -f force=false
