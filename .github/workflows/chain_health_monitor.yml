name: NBA Player Props — Daily Pipeline Health Check

# Fires at 12:30 PM ET (16:30 UTC) after the morning training chain
# (3:30 AM ET start, ~4 hour runtime) and the 10:00 AM ET prediction
# run have both had time to complete.
#
# Monitors only the canonical production workflow (nba_pmf_delivery.yml).
# Reports the two most recent runs and fails if the latest completed run
# ended in failure or if no run has fired in the last 26 hours.

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  health_check:
    name: Verify Production Pipeline Ran Successfully
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check production pipeline status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CUTOFF=$(date -u -d '26 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
                   || date -u -v-26H +%Y-%m-%dT%H:%M:%SZ)

          echo "Checking nba_pmf_delivery.yml runs since $CUTOFF"
          echo "================================================================"

          RUNS=$(gh run list \
                  --workflow="nba_pmf_delivery.yml" \
                  --limit=10 \
                  --json databaseId,conclusion,createdAt,event,displayTitle \
                  --jq ".[] | select(.createdAt > \"$CUTOFF\") | [.createdAt, (.conclusion // \"in_progress\"), (.databaseId|tostring), .event, .displayTitle] | @tsv" \
                  2>/dev/null)

          if [ -z "$RUNS" ]; then
            echo "::error::No production pipeline runs found in the last 26 hours."
            echo "The pipeline may not have triggered. Check GitHub Actions for nba_pmf_delivery.yml."
            exit 1
          fi

          ANY_FAIL=0
          LATEST_CONCLUSION=""
          FIRST=true

          printf "%-25s %-14s %-12s %s\n" "Started (UTC)" "Event" "Result" "Run Name"
          printf -- '-%.0s' $(seq 1 100); echo

          while IFS=$'\t' read -r CREATED CONCLUSION RUN_ID EVENT TITLE; do
            printf "%-25s %-14s %-12s %s\n" "$CREATED" "$EVENT" "$CONCLUSION" "$TITLE"
            if [ "$FIRST" = "true" ]; then
              LATEST_CONCLUSION="$CONCLUSION"
              FIRST=false
            fi
            case "$CONCLUSION" in
              success|skipped)
                ;;
              in_progress)
                echo "::notice::Run $RUN_ID ($TITLE) is still in progress."
                ;;
              *)
                echo "::warning::Run $RUN_ID ($TITLE) ended with: $CONCLUSION"
                ANY_FAIL=1
                ;;
            esac
          done <<< "$RUNS"

          echo ""
          if [ "$ANY_FAIL" -eq 1 ]; then
            echo "::error::One or more production pipeline runs failed. Check the Actions tab."
            exit 1
          fi

          if [ "$LATEST_CONCLUSION" = "in_progress" ]; then
            echo "::notice::Latest pipeline run is still in progress — chain may not have completed yet."
          else
            echo "Production pipeline healthy. Latest result: $LATEST_CONCLUSION"
          fi
