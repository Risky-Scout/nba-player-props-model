name: NBA Props Model — Phase 8 (PMF calibration + diagnostics + market eval)

# Split into three dependent jobs to stay inside GitHub Actions timeouts and
# let any single stage be rerun without paying the cost of the others:
#   A. build-table     — regenerate data/training_table.parquet
#   B. calibrate       — walk-forward OOF PMF calibration (fold-capped)
#   C. diagnostics     — matched diagnostics + de-vigged market evaluation
# Artifacts flow A -> B -> C via actions/upload-artifact + download-artifact.
# Only the final job pushes back to origin/main.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Reason for Phase 8 run'
        required: false
        default: 'Phase 8 run'
      max_folds:
        description: 'Walk-forward fold cap for calibrate_pmf.py (CI default 8)'
        required: false
        default: '8'

jobs:
  # ─── A. Build training table ─────────────────────────────────────────────
  build-table:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo (origin/main)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build training table
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/train.py --build-table-only

      - name: Upload training table
        uses: actions/upload-artifact@v4
        with:
          name: training-table
          path: data/training_table.parquet
          if-no-files-found: error
          retention-days: 7

  # ─── B. PMF calibration (fold-capped) ────────────────────────────────────
  calibrate:
    needs: build-table
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo (origin/main)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download training table from build-table job
        uses: actions/download-artifact@v4
        with:
          name: training-table
          path: data

      - name: Run PMF calibration (walk-forward OOF, fold-capped)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/calibrate_pmf.py \
            --max-folds ${{ github.event.inputs.max_folds }}

      - name: Upload calibration outputs
        uses: actions/upload-artifact@v4
        with:
          name: pmf-calibration
          path: |
            artifacts/models/pmf_cal_*.pkl
            data/oof_pmfs.parquet
            artifacts/docs/pmf_calibration_run.md
          if-no-files-found: warn
          retention-days: 30

  # ─── C. Diagnostics + market-relative evaluation ─────────────────────────
  diagnostics:
    needs: [build-table, calibrate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo (origin/main)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download training table from build-table job
        uses: actions/download-artifact@v4
        with:
          name: training-table
          path: data

      - name: Download calibration outputs from calibrate job
        uses: actions/download-artifact@v4
        with:
          name: pmf-calibration
          # Unpack into repo root: pkls go under artifacts/models/, oof
          # parquet under data/, markdown under artifacts/docs/.
          path: .

      - name: Run diagnostics
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          python scripts/run_diagnostics.py --run-date "$RUN_DATE"

      - name: Run market-relative evaluation
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          # The matched market-vs-model comparison is computed inside
          # scripts/run_diagnostics.py via market_logscore_lift on the
          # OOF de-vigged over/under probs. The helpers in
          # src/nba_props_model/evaluation/market_baseline.py expose
          # devigged_main_line / market_implied_cdf_from_alt_lines /
          # market_pmf_from_cdf for alt-line ladder reconstruction.
          # The diagnostics step above has already produced the matched
          # section — this step is a no-op guard in case a future split
          # wants a dedicated entry point.
          echo "Market-relative eval embedded in run_diagnostics output above."

      - name: Upload Phase 8 outputs
        uses: actions/upload-artifact@v4
        with:
          name: phase8-outputs
          path: |
            artifacts/docs/diagnostics_*.md
            artifacts/docs/pmf_calibration_run.md
            artifacts/models/pmf_cal_*.pkl
            data/oof_pmfs.parquet
          if-no-files-found: warn
          retention-days: 30

      - name: Commit Phase 8 artifacts back to origin/main
        run: |
          git config user.name  "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add artifacts/models/pmf_cal_*.pkl 2>/dev/null || true
          git add artifacts/docs/ 2>/dev/null || true
          git add data/oof_pmfs.parquet 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Phase 8: PMF calibration + diagnostics + market eval"
          git config http.postBuffer 524288000
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep 30
          done
