name: NBA Props Model — Phase 8 (PMF calibration + diagnostics + market eval)

# Split into three dependent jobs to stay inside GitHub Actions timeouts and
# let any single stage be rerun without paying the cost of the others:
#   A. build-table     — regenerate data/training_table.parquet
#   B. calibrate       — walk-forward OOF PMF calibration (fold-capped)
#   C. diagnostics     — matched diagnostics + de-vigged market evaluation
# Artifacts flow A -> B -> C via actions/upload-artifact + download-artifact.
# Only the final job pushes back to origin/main.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Reason for Phase 8 run'
        required: false
        default: 'Phase 8 run'
      max_folds:
        description: 'Walk-forward fold cap for calibrate_pmf.py (CI default 6)'
        required: false
        default: '6'
      core_props_only:
        description: 'Restrict calibration and diagnostics to core props (PTS, REB, AST, FG3M, TOV) only'
        type: boolean
        default: false
        required: false
      allow_local_build_fallback:
        description: 'If true, allow Phase 8 to rebuild training_table.parquet locally via scripts/train.py --build-table-only when no retrain artifact is found. Default false — prefer failing fast and triggering retrain.yml instead.'
        type: boolean
        default: false
        required: false

jobs:
  # ─── A. Build training table ─────────────────────────────────────────────
  # Artifact-first: the retrain.yml workflow uploads `training-table` at the
  # end of every retrain. This job downloads that artifact instead of
  # rebuilding (rebuild takes 60–120 min). Falls back to a local build only
  # when no artifact is available.
  build-table:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo (origin/main)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Find latest retrain run that actually uploaded training-table
        id: find_retrain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Enumerate up to 20 recent successful retrain.yml runs on main and
          # select the newest whose artifacts include a non-expired
          # "training-table". This guards against the earlier bug where a
          # success-only lookup selected a pre-upload-step run and silently
          # fell through to a 120-min local rebuild.
          set -euo pipefail
          SELECTED=""
          RUN_IDS=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/retrain.yml/runs" \
            -X GET -f status=success -f branch=main -f per_page=20 \
            --jq '.workflow_runs[].id')
          for rid in $RUN_IDS; do
            HAS_ARTIFACT=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${rid}/artifacts" \
              --jq '[.artifacts[] | select(.name=="training-table" and .expired==false)] | length')
            if [ "$HAS_ARTIFACT" -ge 1 ]; then
              SELECTED="$rid"
              break
            fi
            echo "run $rid: no live training-table artifact"
          done
          if [ -z "$SELECTED" ]; then
            echo "No retrain run with training-table artifact found among the 20 most recent successful runs."
          else
            echo "Selected retrain run: $SELECTED"
          fi
          echo "run_id=$SELECTED" >> "$GITHUB_OUTPUT"

      - name: Fail fast when no artifact and fallback disabled
        if: steps.find_retrain.outputs.run_id == '' && github.event.inputs.allow_local_build_fallback != 'true'
        run: |
          echo "::error::No retrain run with training-table artifact found. Trigger retrain.yml first."
          exit 1

      - name: Download training-table from selected retrain run
        id: fetch_table
        if: steps.find_retrain.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: training-table
          path: data
          run-id: ${{ steps.find_retrain.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check whether training table was downloaded
        id: have_table
        run: |
          if [ -s data/training_table.parquet ]; then
            echo "status=present" >> "$GITHUB_OUTPUT"
            echo "Training table present (size: $(stat -c%s data/training_table.parquet) bytes)"
          else
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "Training table missing."
          fi

      - name: Install dependencies (only for local build fallback)
        if: steps.have_table.outputs.status == 'missing' && github.event.inputs.allow_local_build_fallback == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build training table locally (explicit fallback)
        if: steps.have_table.outputs.status == 'missing' && github.event.inputs.allow_local_build_fallback == 'true'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/train.py --build-table-only

      - name: Verify training table is present and substantial (>10 MB)
        run: |
          set -euo pipefail
          if [ ! -f data/training_table.parquet ]; then
            echo "::error::data/training_table.parquet is missing after build-table job."
            exit 1
          fi
          SIZE=$(stat -c%s data/training_table.parquet)
          MIN=$((10 * 1024 * 1024))
          if [ "$SIZE" -lt "$MIN" ]; then
            echo "::error::training_table.parquet too small ($SIZE bytes) — expected >10 MB. Likely a corrupt or truncated artifact."
            exit 1
          fi
          echo "Training table OK: $SIZE bytes"

      - name: Upload training table for downstream Phase 8 jobs
        uses: actions/upload-artifact@v4
        with:
          name: training-table
          path: data/training_table.parquet
          if-no-files-found: error
          retention-days: 7

  # ─── B1. PMF calibration — per-fold matrix ───────────────────────────────
  # Each fold runs on its own GitHub-hosted runner in parallel. Observed
  # local single-fold wall-clock 26.5 min on an M-series Mac (2026-04-22
  # diagnostic); GitHub runners are ~1.5x slower, and the previous serial
  # run exceeded 88 min for a single fold before timing out. 120 min per
  # matrix job gives safe margin while preserving the point of the
  # refactor: 6 folds in parallel rather than serial.
  calibrate-fold:
    needs: build-table
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        fold: [1, 2, 3, 4, 5, 6]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo (origin/main)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download training table from build-table job
        uses: actions/download-artifact@v4
        with:
          name: training-table
          path: data

      - name: Run PMF calibration for fold ${{ matrix.fold }}
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          mkdir -p artifacts
          ARGS="--fold-index ${{ matrix.fold }} \
                --max-folds ${{ github.event.inputs.max_folds }} \
                --emit-fold-oof artifacts/fold_${{ matrix.fold }}.parquet \
                --skip-final-fit"
          if [ "${{ github.event.inputs.core_props_only }}" = "true" ]; then
            ARGS="$ARGS --core-props-only"
          fi
          python scripts/calibrate_pmf.py $ARGS

      - name: Upload fold ${{ matrix.fold }} OOF artifact
        uses: actions/upload-artifact@v4
        with:
          name: fold-${{ matrix.fold }}-oof
          path: artifacts/fold_${{ matrix.fold }}.parquet
          if-no-files-found: error
          retention-days: 14

  # ─── B2. Aggregate per-fold OOFs + fit final calibrators ─────────────────
  aggregate-calibration:
    needs: calibrate-fold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo (origin/main)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download all fold OOF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fold-*-oof
          path: artifacts/folds_raw

      - name: Flatten fold artifacts into a single directory
        # download-artifact lays each artifact out at
        # artifacts/folds_raw/fold-N-oof/fold_N.parquet. Collect the
        # parquets into a flat directory so aggregate mode sees every
        # fold_*.parquet in one glob.
        run: |
          mkdir -p artifacts/folds
          find artifacts/folds_raw -name 'fold_*.parquet' -exec cp -v '{}' artifacts/folds/ \;
          ls -la artifacts/folds/

      - name: Aggregate + fit final PMF calibrators
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          python scripts/calibrate_pmf.py \
            --aggregate-mode \
            --aggregate-oofs artifacts/folds/

      - name: Upload final calibration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmf-calibration
          path: |
            artifacts/models/pmf_cal_*.pkl
            data/oof_pmfs.parquet
            artifacts/docs/pmf_calibration_run.md
          if-no-files-found: warn
          retention-days: 30

  # ─── C. Diagnostics + market-relative evaluation ─────────────────────────
  diagnostics:
    needs: [build-table, aggregate-calibration]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo (origin/main)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download training table from build-table job
        uses: actions/download-artifact@v4
        with:
          name: training-table
          path: data

      - name: Download calibration outputs from calibrate job
        uses: actions/download-artifact@v4
        with:
          name: pmf-calibration
          # Unpack into repo root: pkls go under artifacts/models/, oof
          # parquet under data/, markdown under artifacts/docs/.
          path: .

      - name: Run diagnostics
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          ARGS="--run-date $RUN_DATE"
          if [ "${{ github.event.inputs.core_props_only }}" = "true" ]; then
            ARGS="$ARGS --core-props-only"
          fi
          python scripts/run_diagnostics.py $ARGS

      - name: Run market-relative evaluation
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          # The matched market-vs-model comparison is computed inside
          # scripts/run_diagnostics.py via market_logscore_lift on the
          # OOF de-vigged over/under probs. The helpers in
          # src/nba_props_model/evaluation/market_baseline.py expose
          # devigged_main_line / market_implied_cdf_from_alt_lines /
          # market_pmf_from_cdf for alt-line ladder reconstruction.
          # The diagnostics step above has already produced the matched
          # section — this step is a no-op guard in case a future split
          # wants a dedicated entry point.
          echo "Market-relative eval embedded in run_diagnostics output above."

      - name: Upload Phase 8 outputs
        uses: actions/upload-artifact@v4
        with:
          name: phase8-outputs
          path: |
            artifacts/docs/diagnostics_*.md
            artifacts/docs/pmf_calibration_run.md
            artifacts/models/pmf_cal_*.pkl
            data/oof_pmfs.parquet
          if-no-files-found: warn
          retention-days: 30

      - name: Commit Phase 8 artifacts back to origin/main
        run: |
          git config user.name  "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          git add artifacts/models/pmf_cal_*.pkl 2>/dev/null || true
          git add artifacts/docs/ 2>/dev/null || true
          git add data/oof_pmfs.parquet 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Phase 8: PMF calibration + diagnostics + market eval"
          git config http.postBuffer 524288000
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep 30
          done
