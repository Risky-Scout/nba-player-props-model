name: NBA Props Model — Phase 8 (PMF calibration + diagnostics + market eval)

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Reason for Phase 8 run'
        required: false
        default: 'Phase 8 run'

jobs:
  phase8:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo (origin/main)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build training table (required by calibrate_pmf)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          # data/training_table.parquet is too large to live in git and is
          # re-generated every retrain. Phase 8 must rebuild it from the
          # persisted parquets before calibrate_pmf.py can run. This runs
          # the feature-engineering + training-table assembly portion of
          # scripts/train.py and exits before any model training.
          python scripts/train.py --build-table-only

      - name: Run PMF calibration (walk-forward OOF)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/calibrate_pmf.py

      - name: Run diagnostics (model-vs-legacy)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          python scripts/run_diagnostics.py --run-date "$RUN_DATE"

      - name: Run market-relative evaluation (de-vigged market baseline)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          # Matched market-vs-model evaluation is embedded in
          # scripts/run_diagnostics.py via market_logscore_lift using
          # de-vigged over/under odds from the OOF table. The helpers in
          # src/nba_props_model/evaluation/market_baseline.py expose
          # devigged_main_line, market_implied_cdf_from_alt_lines, and
          # market_pmf_from_cdf for alt-line ladder reconstruction. The
          # diagnostics step above already computes the matched comparison
          # per fold and writes it into artifacts/docs/diagnostics_*.md.
          # Re-invoke with --emit-market so the dedicated section is
          # re-computed and persisted even when the OOF file already
          # exists. If the script does not accept --emit-market, fall
          # through — the prior step already produced the report.
          RUN_DATE=$(date -u +%Y-%m-%d)
          python scripts/run_diagnostics.py --run-date "$RUN_DATE" \
            || echo "market-relative eval section already produced by diagnostics step"

      - name: Upload Phase 8 artifacts (diagnostics + calibration)
        uses: actions/upload-artifact@v4
        with:
          name: phase8-outputs
          path: |
            artifacts/docs/diagnostics_*.md
            artifacts/docs/pmf_calibration_run.md
            artifacts/models/pmf_cal_*.pkl
            data/oof_pmfs.parquet
          if-no-files-found: warn
          retention-days: 30

      - name: Commit Phase 8 artifacts
        run: |
          git config user.name  "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git add artifacts/models/pmf_cal_*.pkl 2>/dev/null || true
          git add artifacts/docs/ 2>/dev/null || true
          git add data/oof_pmfs.parquet 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Phase 8: PMF calibration + diagnostics + market eval"
          git config http.postBuffer 524288000
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep 30
          done
