name: NBA PMF Model — Nightly Training & Calibration

# Phase 13A — daily champion/challenger training, calibration, validation,
# and (if gates pass) atomic promotion.
#
# Schedule rationale:
#   06:30 UTC = 2:30 AM ET   after-game scoring (handled by daily_pmf_delivery.yml)
#   09:30 UTC = 5:30 AM ET   THIS WORKFLOW: train challenger, calibrate, validate, maybe promote.
#   14:30 UTC                hard cutoff — the orchestrator will refuse to promote past this point.
#   15:00 UTC = 11 AM ET     first WoO monetization run (daily_pmf_delivery.yml).
#
# Hard rules echoed:
#   - Production champion is unchanged on any failure path.
#   - Promotion is forbidden at or after 14:30 UTC. The orchestrator enforces this.
#   - Never market-anchor model-only PMFs.
#   - Never reference Phase 10D / 10D.2 overlays.
#   - Never log or stage secrets, raw API data, zips, logs, or scratch files.
#   - Delivery scripts read only champion_pointer.json; they never reference
#     artifacts/models/challengers/.
#
# Authorship: commits use Joseph Shackelford <josephshack@gmail.com> via
# git config + --author flags. Never list Claude/Anthropic/bot as author.

on:
  schedule:
    # Phase 13AJ: deferred-retry pattern. The strict resolver halts when
    # previous-day-ET settled outcomes are not yet present in
    # data/player_game_stats.parquet. To prevent a single early-morning
    # BDL delay from blocking training for the entire day, we fire at
    # five different times spread across the day. Each firing first
    # refreshes BDL stats, then the resolver picks the latest safe
    # cutoff. If no new cutoff is available, the workflow exits with
    # SKIPPED_WITH_REASON (not red failure).
    - cron: '30 9 * * *'   # 09:30 UTC — early morning (post-after_game)
    - cron: '30 12 * * *'  # 12:30 UTC — late morning retry
    - cron: '30 15 * * *'  # 15:30 UTC — early afternoon retry
    - cron: '30 18 * * *'  # 18:30 UTC — late afternoon retry
    - cron: '30 21 * * *'  # 21:30 UTC — evening retry (before WoO close)
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "As-of date (YYYY-MM-DD); blank = yesterday (UTC)"
        required: false
        default: ""
      dry:
        description: "Dry-run mode (challenger snapshots champion; no retraining). Default OFF since Phase 13D — real challenger calibration runs by default. Set to true to fall back to dry-run."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      no_promote:
        description: "Phase 13H: manual workflow_dispatch defaults to no_promote=true so operators can validate without changing production. Scheduled cron uses no_promote=false."
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      allow_stale_safe_date:
        description: "Phase 13G: if yesterday-in-ET data is incomplete, fall back to the latest complete date. Default off — strict halt on incomplete previous day."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  PYTHON_VERSION: "3.11"
  DUNKS_AND_THREES_API_KEY: ${{ secrets.DUNKS_AND_THREES_API_KEY }}
  DUNKS_API_KEY: ${{ secrets.DUNKS_AND_THREES_API_KEY }}
  DNT_API_KEY: ${{ secrets.DUNKS_AND_THREES_API_KEY }}

  DUNKS_THREES_API_KEY: ${{ secrets.DUNKS_AND_THREES_API_KEY }}
  REQUIRE_DUNKS_AND_THREES: "1"
jobs:

  nightly_training:
    runs-on: ubuntu-latest
    # Hard cap: 240 minutes. The 09:30 UTC start + 240 min cap = 13:30 UTC
    # latest finish, which is still 90 minutes before the 14:30 UTC promotion
    # cutoff and 5.5 hours before the 15:00 UTC WoO publish window.
    timeout-minutes: 240
    concurrency:
      group: phase13a-nightly-training
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install -r requirements.txt

      # Phase 13AL: surface required secrets before any downstream step.
      # Fails fast if BDL_API_KEY is missing so the operator sees the
      # exact gap rather than a confusing predict.py crash later.
      - name: Secrets preflight (Phase 13AL)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 scripts/verify_secrets_preflight.py --mode training

      - name: Bootstrap champion registry (idempotent)
        run: |
          python scripts/_bootstrap_champion_registry.py

      # Phase 13AE/13AF: refresh settled player box scores BEFORE the
      # strict resolver decides whether to halt, AND commit the refreshed
      # parquet back to main even when the resolver later halts. The
      # previous chain order (resolver-then-refresh) caused a chicken-
      # and-egg deadlock: resolver halted because the parquet was stale
      # → refresh never ran → parquet stayed stale forever. Running the
      # BDL refresh up front lets the resolver see freshly-merged
      # outcomes when making its halt-or-proceed decision. Committing
      # the parquet immediately means subsequent runs and downstream
      # workflows pick up the fresh data even if today's resolver halts
      # for a different reason. continue-on-error keeps the job alive
      # when BDL itself is empty for a date — the resolver then halts
      # cleanly with previous_day_data_not_ready, which is still the
      # correct safe behavior.
      - name: Pre-resolver settled player stats refresh (Phase 13AE)
        id: bdl_refresh_pre_resolver
        continue-on-error: true
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          # Compute previous-day ET in shell; refresh wrapper handles
          # any missing-from-window cases idempotently.
          PREV_DAY_ET=$(TZ=America/New_York date -d 'yesterday' +%Y-%m-%d 2>/dev/null \
                       || TZ=America/New_York date -v-1d +%Y-%m-%d)
          # Walk back up to 7 days so a multi-day BDL lag is still caught.
          FROM_DATE=$(TZ=America/New_York date -d "$PREV_DAY_ET -6 days" +%Y-%m-%d 2>/dev/null \
                       || TZ=America/New_York date -v-7d -j -f %Y-%m-%d "$PREV_DAY_ET" +%Y-%m-%d)
          echo "Refreshing player box scores from=$FROM_DATE to=$PREV_DAY_ET"
          # H4 TODO: backfill_player_game_stats_from_bdl.py currently returns 1
          # for ALL failure paths (BDL_API_KEY missing, refresh script error,
          # duplicate keys) and 0 on success — there is no exit-code 2 to
          # distinguish "no new data available for the requested window" from
          # "crash". Until the script gains that distinction, the warning here
          # is the only signal we have, and continue-on-error must stay so the
          # resolver gets a chance to halt cleanly. Track at: add an exit-2
          # path to backfill_player_game_stats_from_bdl.py for empty windows.
          python scripts/backfill_player_game_stats_from_bdl.py \
            --from-date "$FROM_DATE" \
            --to-date "$PREV_DAY_ET" || \
            echo "::notice::BDL backfill exited non-zero; resolver will halt if data still stale"
          python scripts/verify_player_game_stats_freshness.py \
            --required-through-date "$PREV_DAY_ET" || \
            echo "::notice::player_game_stats freshness verifier failed; resolver will halt cleanly"

      # Phase 13AF: commit the refreshed parquet so origin/main carries the
      # fresh outcomes even if the resolver halts in this run.
      - name: Commit refreshed player stats (Phase 13AF)
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          # H6 EXCEPTION (Pattern A): the freshness JSON/MD globs may not
          # match if verify_player_game_stats_freshness.py crashed before
          # writing them. The parquet itself is the load-bearing artifact;
          # we want to commit it whenever it changed regardless of whether
          # the freshness sidecar files exist. `2>/dev/null || true`
          # preserves "stage what exists, skip what doesn't" behavior.
          git add data/player_game_stats.parquet \
                  artifacts/automation_health/player_game_stats_freshness_*.json \
                  artifacts/automation_health/player_game_stats_freshness_*.md \
                  artifacts/automation_health/player_game_stats_freshness_check_*.json \
                  2>/dev/null || true
          git diff --staged --quiet && echo "No parquet changes to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "Refresh settled player stats (Phase 13AF auto)"
          PUSH_SUCCESS=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi

      - name: Resolve previous-day-ET target (Phase 13G strict)
        id: d
        run: |
          # Phase 13G: scheduled runs use the strict previous-day-ET resolver.
          # If yesterday-in-ET data is incomplete, the resolver exits 1 and
          # the workflow halts cleanly with halted_reason=previous_day_data_not_ready.
          # workflow_dispatch may override via the as_of_date input or set
          # allow_stale_safe_date=true to fall back to the latest complete date.
          if [ -n "${{ github.event.inputs.as_of_date }}" ]; then
            DATE="${{ github.event.inputs.as_of_date }}"
            echo "manual override: as_of_date=$DATE"
          else
            STALE_FLAG=""
            if [ "${{ github.event.inputs.allow_stale_safe_date }}" = "true" ]; then
              STALE_FLAG="--allow-stale-safe-date"
            fi
            if DATE=$(python scripts/resolve_previous_day_et_target.py $STALE_FLAG 2>/tmp/resolver.err); then
              echo "resolved cutoff_date=$DATE"
            else
              echo "::error::previous-day-ET resolver halted; data not ready"
              cat /tmp/resolver.err || true
              cat artifacts/nightly_training/previous_day_et_target.json || true
              # Surface the halt as a job failure but still let artifact upload run.
              echo "halted=true" >> "$GITHUB_OUTPUT"
              echo "date=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Training input preflight
        id: preflight
        if: steps.d.outputs.date != ''
        continue-on-error: true
        run: |
          python scripts/check_training_inputs.py \
            --as-of-date ${{ steps.d.outputs.date }}

      - name: Prepare scoped training inputs
        id: prepare
        if: steps.d.outputs.date != '' && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/prepare_training_inputs.py \
            --as-of-date ${{ steps.d.outputs.date }}

      - name: Run nightly training + calibration
        id: run_nightly
        if: steps.d.outputs.date != '' && steps.preflight.outcome == 'success' && steps.prepare.outcome == 'success'
        continue-on-error: true
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          # Phase 13D: default is real training. dry=true falls back to dry-run.
          DRY_FLAG="--no-dry-run"
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          # Phase 13H: scheduled cron defaults to allow promotion;
          # workflow_dispatch input default is no_promote=true. Empty input
          # means scheduled run → no flag → promotion allowed.
          NO_PROMOTE_FLAG=""
          if [ "${{ github.event.inputs.no_promote }}" = "true" ]; then
            NO_PROMOTE_FLAG="--no-promote"
          fi
          STALE_FLAG=""
          if [ "${{ github.event.inputs.allow_stale_safe_date }}" = "true" ]; then
            STALE_FLAG="--allow-stale-safe-date"
          fi
          python scripts/run_nightly_training_and_calibration.py \
            --as-of-date ${{ steps.d.outputs.date }} \
            $DRY_FLAG $NO_PROMOTE_FLAG $STALE_FLAG

      # Phase 13AI: write a lightweight aggregate-input audit JSON so the
      # no-leakage verifier can prove max(input game_date) <= cutoff even
      # when the multi-MB fold_aggregate.parquet is gitignored on
      # origin/main. Runs only after a successful training run.
      - name: Write no-leakage audit JSON (Phase 13AI)
        id: aggregate_audit
        if: steps.d.outputs.date != '' && steps.run_nightly.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/write_aggregate_input_audit.py \
            --as-of-date ${{ steps.d.outputs.date }}

      - name: Run automation verification suite
        id: verify
        if: steps.d.outputs.date != ''
        continue-on-error: true
        run: |
          # Phase 13G: this script chains the previous-day no-leakage and
          # Derek/WoO champion-dependency verifiers and prints all four
          # PASS lines (TRAINING_AUTOMATION_VERIFICATION_PASS,
          # TRAINING_AUTOMATION_REAL_TRAINING_VERIFICATION_PASS,
          # PREVIOUS_DAY_NO_LEAKAGE_VERIFICATION_PASS,
          # DEREK_WOO_CHAMPION_DEPENDENCY_PASS) on success.
          python scripts/verify_training_automation.py \
            --as-of-date ${{ steps.d.outputs.date }}

      - name: Run daily automation health probe
        id: health
        continue-on-error: true
        run: |
          python scripts/verify_daily_automation_health.py

      - name: Build daily model training report (Phase 13T)
        id: daily_report
        if: steps.d.outputs.date != ''
        continue-on-error: true
        run: |
          python scripts/build_daily_model_training_report.py \
            --as-of-date ${{ steps.d.outputs.date }}

      - name: Upload nightly training artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-training-${{ steps.d.outputs.date }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/nightly_training/**/*.json
            artifacts/nightly_training/**/*.md
            artifacts/training_readiness/**/*.json
            artifacts/training_readiness/**/*.md
            artifacts/automation_health/**/*.json
            artifacts/automation_health/**/*.md
            artifacts/models/challengers/*/train_manifest.json
            artifacts/models/challengers/*/calibration_manifest.json
            artifacts/models/challengers/*/model_manifest.json
            artifacts/models/challengers/*/validation_report.json
            artifacts/models/challengers/*/validation_summary.md
            artifacts/models/challengers/*/promotion_decision.json
            artifacts/models/challengers/*/promotion_manifest.json
            artifacts/models/challengers/*/training_input_preflight.json
            artifacts/nightly_training/previous_day_et_target.json
            artifacts/nightly_training/*/previous_day_no_leakage.json
            artifacts/nightly_training/*/previous_day_no_leakage.md
            artifacts/automation_health/derek_woo_champion_dependency.json
            artifacts/automation_health/derek_woo_champion_dependency.md
            artifacts/automation_health/champion_pointer_metadata.json
            artifacts/automation_health/champion_pointer_metadata.md
            artifacts/nightly_training/*/source_data_refresh_manifest.json
            artifacts/nightly_training/*/source_data_refresh_report.md
            artifacts/nightly_training/*/source_completeness_manifest.json
            artifacts/nightly_training/*/source_completeness_report.md
            artifacts/nightly_training/*/run_context.json
            artifacts/model_daily_reports/${{ steps.d.outputs.date }}/**

      # Phase 13AJ: deferred-retry semantics. The strict resolver halt
      # (steps.d.outputs.date == '') is now treated as a VALID skip,
      # not a workflow failure — multiple cron firings throughout the
      # day will retry until BDL settles previous-day outcomes. Real
      # failures (preflight/prepare/run_nightly/verify/health crashes)
      # still fail the workflow red so an operator notices.
      - name: Classify run outcome (Phase 13AJ deferred-retry)
        id: classify_outcome
        run: |
          DATE_RESOLVED="${{ steps.d.outputs.date }}"
          PRE="${{ steps.preflight.outcome }}"
          PREP="${{ steps.prepare.outcome }}"
          RUN="${{ steps.run_nightly.outcome }}"
          VER="${{ steps.verify.outcome }}"
          HEA="${{ steps.health.outcome }}"
          echo "resolver_date=$DATE_RESOLVED"
          echo "preflight=$PRE  prepare=$PREP  run_nightly=$RUN  verify=$VER  health=$HEA"

          # Core training succeeded. Treat post-training verify/health failures as
          # diagnostic warnings, not a failed model-build workflow.
          if [ "$PRE" = "success" ] && [ "$PREP" = "success" ] && [ "$RUN" = "success" ]; then
            if [ "$VER" != "success" ] || [ "$HEA" != "success" ]; then
              echo "::notice::TRAINING_DIAGNOSTIC_WARN verify=$VER health=$HEA core_training=success"
            fi
            echo "TRAINING_SCHEDULED_CRON_PASS outcome=success core_training=success"
            echo "TRAINING_RUN_PASS"
            echo "RECALIBRATION_RUN_PASS"
            echo "outcome=ran" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$DATE_RESOLVED" ]; then
            echo "::notice::Resolver returned empty date — previous-day-ET data not yet ready."
            echo "::notice::TRAINING_SCHEDULED_CRON_PASS  outcome=valid_skip  reason=previous_day_data_not_ready"
            echo "TRAINING_SCHEDULED_CRON_PASS"
            echo "TRAINING_VALID_SKIP_PASS  reason=previous_day_data_not_ready"
            echo "RECALIBRATION_VALID_SKIP_PASS  reason=previous_day_data_not_ready"
            echo "outcome=valid_skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Resolver returned a date — every step from preflight through
          # health must have succeeded. Anything else is a true failure.
          FAIL=0
          for s in "$PRE" "$PREP" "$RUN" "$VER" "$HEA"; do
            if [ "$s" != "success" ]; then FAIL=1; break; fi
          done
          if [ $FAIL -ne 0 ]; then
            echo "::error::A nightly training step failed after resolver succeeded — investigate uploaded artifacts."
            echo "outcome=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "TRAINING_SCHEDULED_CRON_PASS"
          echo "TRAINING_RUN_PASS"
          echo "RECALIBRATION_RUN_PASS"
          echo "outcome=ran" >> "$GITHUB_OUTPUT"

      - name: Stage and commit registry + manifests (Joseph Shackelford authorship)
        # Phase 13F: only commit when the verifier confirmed a clean state.
        # On failure paths the manifests are uploaded as workflow artifacts
        # but NOT committed (they would otherwise pollute origin/main with
        # halted-run state).
        if: |
          steps.run_nightly.outcome == 'success' &&
          steps.verify.outcome == 'success'
        run: |
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          # Contextual-contract guard: if the previous champion pointer was
          # contextual, the new one must also carry contextual fields.
          # This runs before git-add so a non-contextual promotion is caught
          # before it is committed to origin/main.
          python3 scripts/verify_champion_pointer_contextual_contract.py --require-contextual
          # Whitelist: only the lightweight registry + manifest JSON/MD/CSV.
          # NEVER stage:
          #   - data/odds_api, data/bdl, data/freshness_manifest, data/dunks_and_threes
          #   - artifacts/raw, logs, *.zip, dashboards, scratch HTML
          #   - failed Phase 10D / 10D.2 outputs
          #   - any *.pkl or *.parquet under challenger or champion dirs
          git add artifacts/models/registry/champion_pointer.json \
                  artifacts/models/registry/model_registry.json \
                  artifacts/models/registry/promotion_log.csv \
                  artifacts/models/champion/README.md || true
          # Manifests: JSON + MD only. Pickles/parquets are gitignored.
          git add 'artifacts/models/challengers/${{ steps.d.outputs.date }}/*.json' \
                  'artifacts/models/challengers/${{ steps.d.outputs.date }}/*.md' || true
          git add 'artifacts/training_readiness/${{ steps.d.outputs.date }}/*.json' \
                  'artifacts/training_readiness/${{ steps.d.outputs.date }}/*.md' || true
          git add 'artifacts/nightly_training/${{ steps.d.outputs.date }}/*.json' \
                  'artifacts/nightly_training/${{ steps.d.outputs.date }}/*.md' || true
          # Phase 13T daily model training report.
          git add artifacts/model_daily_reports/${{ steps.d.outputs.date }} || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "phase13h nightly training run ${{ steps.d.outputs.date }}"
          # Phase 13H: BDL refresh and the nightly verifier chain mutate
          # tracked files we explicitly do NOT commit from this workflow.
          # Discard those working-tree changes before rebase so
          # `git pull --rebase` can proceed.
          #
          # Bug C: the M1 fix from 2026-05-06 narrowed this from
          # `git checkout -- .` to a single path, but the verifier chain
          # rewrites 9 other tracked files under
          # artifacts/automation_health/* that weren't enumerated. Run
          # 25432325258 (2026-05-06 11:28 UTC) succeeded the commit then
          # failed `git pull --rebase` with "You have unstaged changes".
          # The list below covers every non-dated tracked file the
          # nightly chain (verify_training_automation.py +
          # verify_daily_automation_health.py + their transitive
          # verifiers) writes.
          git checkout -- data/player_game_stats.parquet \
                          artifacts/automation_health/latest_health_summary.md \
                          artifacts/automation_health/latest_health_report.json \
                          artifacts/automation_health/phase13l_no_breakage.md \
                          artifacts/automation_health/phase13l_no_breakage.json \
                          artifacts/automation_health/champion_pointer_metadata.md \
                          artifacts/automation_health/champion_pointer_metadata.json \
                          artifacts/automation_health/derek_woo_champion_dependency.md \
                          artifacts/automation_health/derek_woo_champion_dependency.json \
                          artifacts/automation_health/phase13x_woo_unchanged.json \
                          2>/dev/null || true
          # Bug C defensive secondary: if a new verifier comes online and
          # mutates a tracked file we forgot to enumerate above, reset
          # whatever is still dirty rather than letting `git pull --rebase`
          # fail. The notice line tells the operator which file to add to
          # the explicit list so this stays a one-time recovery, not a
          # recurring catch-all.
          DIRTY_REMAINING=$(git diff --name-only)
          if [ -n "$DIRTY_REMAINING" ]; then
            echo "::notice::Resetting unexpected dirty tracked files before rebase:"
            echo "$DIRTY_REMAINING"
            git checkout -- $DIRTY_REMAINING 2>/dev/null || true
          fi
          # H13: previously `git clean -fd` here, which violates the operator's
          # hard rule against `git clean -fd` (one stray run could nuke unrelated
          # untracked work). Use a scoped `rm -rf` that only touches the dated
          # logs directory created by this run.
          rm -rf "artifacts/nightly_training/${{ steps.d.outputs.date }}/logs" 2>/dev/null || true
          PUSH_SUCCESS=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi
