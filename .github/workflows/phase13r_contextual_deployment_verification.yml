name: NBA Player Props — Manual Contextual Training Step 4 (Deployment Verification)

# Hardens and proves the Phase 13Q contextual PMF engine is real,
# wired, and safe to deploy. Each verifier step is hard-gated: a
# verifier failure fails the job immediately. Promote + commit run
# only when every verifier has passed.
#
# Hard rules:
#   - Author for every commit: Joseph Shackelford <josephshack@gmail.com>.
#   - No edits to wizard_of_odds/, derek_forward_feed/,
#     pmf_model_review_package/, canonical_source/.
#   - Auto-commit ONLY artifacts/phase13r/, augmented contextual
#     challenger files, champion_pointer.json, and v_phase13r_*
#     pointer backups.

on:
  # H1B chain — auto-fire after phase13q succeeds (parallel with
  # phase13s). Manual dispatch remains available.
  workflow_run:
    workflows: ["Phase 13Q — Contextual PMF Engine (train + validate, no-promote)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      challenger_dir:
        description: "Optional: path to a specific contextual challenger dir."
        required: false
        default: ""
      force_promote:
        description: "Force re-augment champion_pointer (overwrite existing contextual block)."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      allow_future_trained_through:
        description: "Allow promotion when trained_through_date is in the future. Manual escape hatch — leave at 'false' for normal runs."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  PYTHON_VERSION: "3.11"

jobs:
  phase13r_contextual_deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # H1B chain gate.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    concurrency:
      group: phase13r-contextual-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - name: H1B — Verify upstream output present (workflow_run only)
        if: github.event_name == 'workflow_run'
        run: |
          set -e
          # Upstream is phase13q which commits
          # "phase13q: contextual challenger <date>".
          UPSTREAM_PATTERN="^phase13q: "
          if ! git log --grep="$UPSTREAM_PATTERN" --since="24 hours ago" --format="%h" | head -1 | grep -q .; then
            echo "::error::No upstream commit matching '$UPSTREAM_PATTERN' in last 24h on origin/main"
            echo "Recent commits:"
            git log -5 --oneline
            exit 1
          fi
          LATEST=$(git log --grep="$UPSTREAM_PATTERN" --since="24 hours ago" -1 --format="%h %ai %s")
          echo "::notice::Upstream output verified: $LATEST"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Phase 13R started
        run: |
          echo "PHASE13R_DEPLOYMENT_STARTED"
          git rev-parse HEAD
          ls artifacts/models/challengers/ || true

      - name: Phase 13Q state audit
        run: python scripts/_phase13r_write_state_audit.py

      - name: Verify contextual feature lists
        run: python scripts/verify_contextual_feature_lists.py

      - name: Verify contextual predict path
        run: python scripts/verify_contextual_predict_path.py

      - name: Verify contextual PMF sensitivity (6 cases)
        run: python scripts/verify_contextual_pmf_sensitivity.py

      - name: Phase 13Q no-leakage
        run: python scripts/verify_phase13q_no_leakage.py

      - name: Phase 13L no-breakage
        run: python scripts/verify_phase13l_no_breakage.py

      # R-5: explicit `if: success()` (already implicit) so the gate is
      # visible to anyone reading the file — promotion must NEVER run if
      # any upstream verifier failed.
      - name: Promote contextual challenger
        if: success()
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.challenger_dir }}" ]; then
            ARGS="$ARGS --challenger-dir ${{ github.event.inputs.challenger_dir }}"
          fi
          if [ "${{ github.event.inputs.force_promote }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.inputs.allow_future_trained_through }}" = "true" ]; then
            ARGS="$ARGS --allow-future-trained-through"
          fi
          python scripts/promote_contextual_challenger.py $ARGS

      - name: Verify deployment + Derek contextual outputs
        run: python scripts/verify_phase13r_deployment.py

      - name: Upload Phase 13R artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13r-contextual-deployment
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/phase13r/**
            artifacts/models/registry/champion_pointer.json
            artifacts/models/champion/v_phase13r_*/**

      # R-6: explicit `if: success()` so the commit gate is visible —
      # promotion artifacts must never land on origin/main if any
      # upstream verifier failed.
      - name: Commit Phase 13R artifacts (Joseph Shackelford authorship)
        if: success()
        run: |
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          # promotion_log.csv added during M1 investigation: previously
          # promote_contextual_challenger.py appended a row to this
          # tracked file but it was being silently discarded by the
          # `git checkout -- .` below. Phase 13R promotions now actually
          # show up in the promotion log on origin/main.
          if ! git add artifacts/phase13r \
                       artifacts/models/registry/champion_pointer.json \
                       artifacts/models/registry/promotion_log.csv \
                       artifacts/models/champion/v_phase13r_* \
                       artifacts/models/challengers/*_contextual/promotion_decision.json \
                       artifacts/models/challengers/*_contextual/promotion_manifest.json; then
            echo "::error::git add failed for one or more Phase 13R paths"
            exit 1
          fi
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "phase13r: deploy contextual lineup injury PMF engine"
          # M1: scope the working-tree reset to verifier-rewritten tracked
          # files we explicitly do NOT commit from Phase 13R (they are
          # regenerated and committed by nightly_training_calibration).
          # promotion_log.csv was previously also being discarded here —
          # see git add list above for the fix.
          git checkout -- artifacts/automation_health/phase13l_no_breakage.md \
                          artifacts/automation_health/phase13l_no_breakage.json \
                          2>/dev/null || true
          PUSH_SUCCESS=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi
