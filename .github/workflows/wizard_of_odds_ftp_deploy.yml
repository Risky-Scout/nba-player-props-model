name: Wizard of Odds — FTP Deploy
run-name: "WoO FTP Deploy | ${{ github.event_name == 'workflow_dispatch' && (inputs.delivery_date != '' && inputs.delivery_date || 'auto-date') || 'scheduled' }}"

# Phase 12B/12D/12E/12F/13AM — publish public_export/wizard_of_odds/ to
# the WoO FTP portal after the daily PMF delivery has produced a public
# snapshot. Phase 12F added the missing `pip install` step. Phase 13AM
# replaces the old monolithic build_wizard_of_odds_public_export.py +
# verify_wizard_of_odds_public_export.py with the four-step pipeline:
#
#   1. scripts/publish_woo_public_export.py --date <date>
#      writes affiliate_dashboard.json + pmf_research.json under
#      public_export/wizard_of_odds/<date>/, /latest/, and the root.
#   2. scripts/build_woo_dashboard.py --date <date>
#      renders the two self-contained HTML pages from the JSON via
#      predictions/_template_*.html. Emits WOO_DASHBOARD_BUILD_PASS.
#   3. scripts/verify_woo_dashboard_render_contract.py --date <date>
#      static render-contract verifier; gates the deploy.
#      Emits WOO_DASHBOARD_RENDER_CONTRACT_PASS.
#   4. scripts/verify_woo_public_export_contract.py --date <date>
#      JSON contract verifier (PMF tail-bucket convention,
#      non-empty rows, etc.). Emits WOO_PUBLIC_EXPORT_CONTRACT_PASS.
#
# Only after all three PASS lines emit do we copy the rendered HTML
# pages into public_export/wizard_of_odds/ (so the FTP step uploads
# them along with the JSON tree) and run the FTP deploy.
#
# Effective post-Phase-12D-amend deploy schedule:
#   - woo_morning_monetization        (15:00 UTC)
#   - woo_afternoon_refresh           (18:00 / 20:00 UTC)
#   - derek_pre_tipoff_refresh every 15 min  (22:25 UTC → 03:10 UTC)
#       (legacy alias: derek_near_lineup)
#   - close_lock                      (03:25 UTC)
#   - after_game                      (06:30 UTC, harmless re-upload)
#
# Triggers:
#   - workflow_dispatch (manual)
#   - workflow_run "completed" of "NBA PMF Delivery — Daily Pipeline"
#
# Hard rules:
#   - Credentials read only from GitHub Actions secrets, never echoed.
#   - WOO_FTP_PASSWORD is masked by the runner; no `echo`, `set -x`, or
#     printenv on it.
#   - FTPS-first, with plain-FTP fallback enabled by default because the
#     target host (vsFTPd 3.0.5) does not advertise AUTH TLS. Toggle the
#     `allow_plain` input to "false" if FTPS is later enabled server-side.
#   - Never stages/uploads anything outside public_export/wizard_of_odds/.

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Connect/login/cwd then exit (no upload)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      allow_plain:
        description: "Allow plain-FTP fallback if FTPS fails (target is vsFTPd, default true)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      walk_only:
        description: "Walk local files only; do not connect or upload"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  workflow_run:
    workflows: ["NBA PMF Delivery — Daily Pipeline"]
    types: [completed]

# Phase 13AN-H1: queue concurrent FTP deploys so two simultaneous
# triggers (e.g. workflow_run from PMF delivery completion at the same
# time as a manual workflow_dispatch) don't race on the FTP server.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Phase 13AN-G: opt actions into Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      # Phase 12F/13AM — pandas + pyarrow are required by both the old
      # monetization_view writer (still emitted by the daily-delivery
      # pipeline) AND publish_woo_public_export.py.
      - name: Install python deps
        run: |
          pip install -r requirements.txt
          pip install pyyaml

      - name: Resolve delivery date (America/New_York)
        id: d
        # Phase 13AM — ET-anchored slate so the deploy targets the same
        # date the operator reads in the daily PMF delivery audit.
        run: |
          ET_DATE=$(TZ=America/New_York date +%Y-%m-%d)
          echo "date=$ET_DATE" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy_date=$ET_DATE via America/New_York"

      - name: Predictions readiness gate (Phase 13AM)
        id: predict_gate
        # Same valid-skip gate the PMF Delivery jobs use. workflow_run
        # firings happen after PMF Delivery succeeds, so predictions
        # will be present in the standard flow. Manual dispatches
        # before the predict cron just emit WAITING_FOR_PREDICTIONS_VALID_SKIP
        # exit 0 GREEN and the downstream steps skip cleanly. The
        # deploy is configured with --no-run-predict so a manual
        # dispatch at 02:00 ET never tries to fabricate predictions.
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          python3 scripts/predictions_readiness_gate.py \
            --date "${{ steps.d.outputs.date }}" \
            --predict-cron-hour-utc 13 \
            --mode "ftp_deploy" \
            --no-run-predict

      - name: Preflight — verify required FTP secrets are set
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          WOO_FTP_HOST: ${{ secrets.WOO_FTP_HOST }}
          WOO_FTP_USER: ${{ secrets.WOO_FTP_USER }}
          WOO_FTP_PASSWORD: ${{ secrets.WOO_FTP_PASSWORD }}
          WOO_FTP_REMOTE_DIR: ${{ secrets.WOO_FTP_REMOTE_DIR }}
        run: |
          # Never echo the values themselves; only report presence and
          # length so the masked-secrets policy is honoured.
          set -u
          missing=""
          for v in WOO_FTP_HOST WOO_FTP_USER WOO_FTP_PASSWORD WOO_FTP_REMOTE_DIR; do
            val="${!v}"
            if [ -z "$val" ]; then
              missing="$missing $v"
              echo "  $v: MISSING"
            else
              echo "  $v: present (len=${#val})"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Required GitHub secrets are empty:$missing"
            if echo "$missing" | grep -q WOO_FTP_REMOTE_DIR; then
              # U2: the deployed WoO portal serves these pages at
              # /tools/odds-scanner/predictions/ (e.g. nba-props.html,
              # nba-pmf-research.html) per the URLs the operator publishes.
              # Older operator notes referenced /odds-scanner/predictions/.
              # The actual remote-directory path depends on the FTP host's
              # docroot; if you change it here, also update the audit notes.
              echo "::error::Missing WOO_FTP_REMOTE_DIR secret; set it to your FTP target directory (typically /tools/odds-scanner/predictions/ or /odds-scanner/predictions/ depending on deployed setup)"
            fi
            exit 1
          fi

      # ── Phase 13AM WoO build/verify pipeline ────────────────────────
      # The four steps below MUST run in order. The deploy step is
      # gated behind their success; if any fails, no FTP upload happens.

      - name: 1/4 Publish WoO public export JSON (Phase 13AM)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          python3 scripts/publish_woo_public_export.py --date "${{ steps.d.outputs.date }}"

      - name: 2/4 Build WoO dashboard HTML pages (Phase 13AM)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          python3 scripts/build_woo_dashboard.py --date "${{ steps.d.outputs.date }}"

      - name: 3/4 Verify WoO dashboard render contract (Phase 13AM)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          python3 scripts/verify_woo_dashboard_render_contract.py --date "${{ steps.d.outputs.date }}"

      - name: 4/4 Verify WoO public export contract (Phase 13AM)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        run: |
          python3 scripts/verify_woo_public_export_contract.py --date "${{ steps.d.outputs.date }}"

      - name: Stage rendered HTML pages for FTP upload (Phase 13AM)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        # Copy the rendered HTML into public_export/wizard_of_odds/ so
        # the existing recursive FTP deploy picks them up. Templates
        # (_template_*.html) live ONLY in predictions/ and are never
        # copied into public_export/, so they never reach the FTP root.
        run: |
          cp -v predictions/nba-props.html        public_export/wizard_of_odds/nba-props.html
          cp -v predictions/nba-pmf-research.html public_export/wizard_of_odds/nba-pmf-research.html
          # Confirm we are NOT staging templates by accident.
          if ls public_export/wizard_of_odds/_template_*.html 2>/dev/null; then
            echo "::error::templates leaked into public_export/wizard_of_odds/"
            exit 1
          fi
          # M4: content-based freshness check. The previous mtime check
          # measured runner write time (always "fresh" right after `cp -v`)
          # and never caught a stale build. The HTML pages are rendered
          # FROM the source-of-truth JSON files written by
          # publish_woo_public_export.py — those JSONs carry the slate
          # `date` at the top level (see scripts/publish_woo_public_export.py
          # line ~254). Verifying that field matches the resolved deploy
          # date proves the content is for the right slate.
          DEPLOY_DATE='${{ steps.d.outputs.date }}'
          for f in public_export/wizard_of_odds/nba-props.html \
                   public_export/wizard_of_odds/nba-pmf-research.html; do
            if [ ! -s "$f" ]; then
              echo "::error::$f missing or empty"
              exit 1
            fi
            echo "  $f size=$(wc -c < $f)"
          done
          for j in public_export/wizard_of_odds/affiliate_dashboard.json \
                   public_export/wizard_of_odds/pmf_research.json; do
            if [ ! -s "$j" ]; then
              echo "::error::$j missing or empty"
              exit 1
            fi
            DATE_IN_JSON=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('date',''))" "$j")
            if [ "$DATE_IN_JSON" != "$DEPLOY_DATE" ]; then
              echo "::error::$j carries date='$DATE_IN_JSON' but deploy_date='$DEPLOY_DATE' — stale or mis-built export"
              exit 1
            fi
            echo "  $j date=$DATE_IN_JSON OK"
          done

      - name: Pre-deploy verifier — workflow contract (Phase 13AM)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        # Static workflow audit; ensures THIS yaml + the daily ones use
        # the new pipeline (and not the legacy build_wizard_of_odds_*.py).
        # Required to emit WOO_DEPLOY_WORKFLOW_CONTRACT_PASS.
        run: |
          python3 scripts/verify_woo_deploy_workflow_contract.py


      - name: Verify corrected PMF delivery before FTP deploy
        run: |
          python scripts/verify_corrected_pmf_delivery.py \
            --date "${{ steps.d.outputs.date }}" \
          --skip-derek-snapshots

      - name: FTP deploy (FTPS, with optional plain fallback)
        if: steps.predict_gate.outputs.should_proceed == 'true'
        env:
          WOO_FTP_HOST: ${{ secrets.WOO_FTP_HOST }}
          WOO_FTP_USER: ${{ secrets.WOO_FTP_USER }}
          WOO_FTP_PASSWORD: ${{ secrets.WOO_FTP_PASSWORD }}
          WOO_FTP_REMOTE_DIR: ${{ secrets.WOO_FTP_REMOTE_DIR }}
        run: |
          # Defaults: allow_plain=true (vsFTPd target does not advertise
          # AUTH TLS); check_only=false; walk_only=false. workflow_run
          # firings have no `github.event.inputs.*` so they inherit the
          # defaults below.
          ALLOW_PLAIN="${{ github.event.inputs.allow_plain }}"
          if [ -z "$ALLOW_PLAIN" ]; then ALLOW_PLAIN="true"; fi
          CHECK_ONLY="${{ github.event.inputs.check_only }}"
          if [ -z "$CHECK_ONLY" ]; then CHECK_ONLY="false"; fi
          WALK_ONLY="${{ github.event.inputs.walk_only }}"
          if [ -z "$WALK_ONLY" ]; then WALK_ONLY="false"; fi

          FLAGS=""
          if [ "$CHECK_ONLY" = "true" ]; then
            FLAGS="$FLAGS --check-connection"
          fi
          if [ "$WALK_ONLY" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "$ALLOW_PLAIN" = "true" ]; then
            FLAGS="$FLAGS --allow-plain"
          fi
          echo "deploy mode: check_only=$CHECK_ONLY walk_only=$WALK_ONLY allow_plain=$ALLOW_PLAIN"
          python scripts/deploy_wizard_of_odds_ftp.py $FLAGS
