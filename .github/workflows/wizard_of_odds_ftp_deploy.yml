name: Wizard of Odds — FTP Deploy

# Phase 12B/12D/12E/12F — publish public_export/wizard_of_odds/ to the
# WoO FTP portal after the daily PMF delivery has produced a public
# snapshot. Phase 12F adds the missing `pip install` step that caused
# `build_wizard_of_odds_public_export.py` to silently skip the
# monetization_view files (pandas was missing on the runner), plus a
# secrets preflight check and friendlier workflow_dispatch input names.
#
# Effective post-Phase-12D-amend deploy schedule:
#   - woo_morning_monetization        (15:00 UTC)
#   - woo_afternoon_refresh           (18:00 / 20:00 UTC)
#   - derek_near_lineup every 15 min  (22:25 UTC → 03:10 UTC)
#   - close_lock                      (03:25 UTC)
#   - after_game                      (06:30 UTC, harmless re-upload)
#
# Triggers:
#   - workflow_dispatch (manual)
#   - workflow_run "completed" of "NBA PMF Delivery — Daily Pipeline"
#
# Hard rules:
#   - Credentials read only from GitHub Actions secrets, never echoed.
#   - WOO_FTP_PASSWORD is masked by the runner; no `echo`, `set -x`, or
#     printenv on it.
#   - FTPS-first, with plain-FTP fallback enabled by default because the
#     target host (vsFTPd 3.0.5) does not advertise AUTH TLS. Toggle the
#     `allow_plain` input to "false" if FTPS is later enabled server-side.
#   - Never stages/uploads anything outside public_export/wizard_of_odds/.

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Connect/login/cwd then exit (no upload)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      allow_plain:
        description: "Allow plain-FTP fallback if FTPS fails (target is vsFTPd, default true)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      walk_only:
        description: "Walk local files only; do not connect or upload"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  workflow_run:
    workflows: ["NBA PMF Delivery — Daily Pipeline"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      # Phase 12F — root-cause fix for the silent monetization_view
      # skip. build_wizard_of_odds_public_export.py imports pandas
      # inside _write_monetization_view; the daily delivery workflow
      # installs these but the FTP-deploy workflow used to skip
      # `pip install`, so the build silently dropped the canonical
      # monetization files and the verifier failed downstream.
      - name: Install python deps
        run: pip install pandas pyarrow numpy

      - name: Preflight — verify required FTP secrets are set
        env:
          WOO_FTP_HOST: ${{ secrets.WOO_FTP_HOST }}
          WOO_FTP_USER: ${{ secrets.WOO_FTP_USER }}
          WOO_FTP_PASSWORD: ${{ secrets.WOO_FTP_PASSWORD }}
          WOO_FTP_REMOTE_DIR: ${{ secrets.WOO_FTP_REMOTE_DIR }}
        run: |
          # Never echo the values themselves; only report presence and
          # length so the masked-secrets policy is honoured.
          set -u
          missing=""
          for v in WOO_FTP_HOST WOO_FTP_USER WOO_FTP_PASSWORD WOO_FTP_REMOTE_DIR; do
            val="${!v}"
            if [ -z "$val" ]; then
              missing="$missing $v"
              echo "  $v: MISSING"
            else
              echo "  $v: present (len=${#val})"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Required GitHub secrets are empty:$missing"
            if echo "$missing" | grep -q WOO_FTP_REMOTE_DIR; then
              echo "::error::Missing WOO_FTP_REMOTE_DIR secret; expected /odds-scanner/predictions/"
            fi
            exit 1
          fi

      - name: Build public export folder
        run: |
          python scripts/build_wizard_of_odds_public_export.py --all-available

      - name: Verify public export folder
        run: |
          python scripts/verify_wizard_of_odds_public_export.py

      - name: FTP deploy (FTPS, with optional plain fallback)
        env:
          WOO_FTP_HOST: ${{ secrets.WOO_FTP_HOST }}
          WOO_FTP_USER: ${{ secrets.WOO_FTP_USER }}
          WOO_FTP_PASSWORD: ${{ secrets.WOO_FTP_PASSWORD }}
          WOO_FTP_REMOTE_DIR: ${{ secrets.WOO_FTP_REMOTE_DIR }}
        run: |
          # Defaults: allow_plain=true (vsFTPd target does not advertise
          # AUTH TLS); check_only=false; walk_only=false. workflow_run
          # firings have no `github.event.inputs.*` so they inherit the
          # defaults below.
          ALLOW_PLAIN="${{ github.event.inputs.allow_plain }}"
          if [ -z "$ALLOW_PLAIN" ]; then ALLOW_PLAIN="true"; fi
          CHECK_ONLY="${{ github.event.inputs.check_only }}"
          if [ -z "$CHECK_ONLY" ]; then CHECK_ONLY="false"; fi
          WALK_ONLY="${{ github.event.inputs.walk_only }}"
          if [ -z "$WALK_ONLY" ]; then WALK_ONLY="false"; fi

          FLAGS=""
          if [ "$CHECK_ONLY" = "true" ]; then
            FLAGS="$FLAGS --check-connection"
          fi
          if [ "$WALK_ONLY" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "$ALLOW_PLAIN" = "true" ]; then
            FLAGS="$FLAGS --allow-plain"
          fi
          echo "deploy mode: check_only=$CHECK_ONLY walk_only=$WALK_ONLY allow_plain=$ALLOW_PLAIN"
          python scripts/deploy_wizard_of_odds_ftp.py $FLAGS
