name: NBA Props Model — Retrain

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Reason for retrain'
        required: false
        default: 'Minutes model clean retrain'

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install lightgbm scikit-learn pandas numpy requests pyarrow joblib scipy

      - name: Run full retrain
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: python train_v12.py

      - name: Commit model cache to repo
        run: |
          git config user.name  "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git pull --rebase origin main
          git add model_cache/ -f
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Retrain $(date -u +%Y-%m-%d): ${{ github.event.inputs.note }}"
          git push origin main
