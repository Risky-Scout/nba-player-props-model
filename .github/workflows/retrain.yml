name: NBA Props Model — Retrain

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Reason for retrain'
        required: false
        default: 'Scheduled retrain'

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full retrain
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/train.py

      - name: Run Platt calibration
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          python scripts/calibrate.py || echo "Calibration skipped — insufficient graded data"

      - name: Commit retrained artifacts
        run: |
          git config user.name  "Props Bot"
          git config user.email "props-bot@wizardofodds.com"
          git rm --cached data/training_table.parquet 2>/dev/null || true
          git add artifacts/models/ -f
          git add data/ -f
          git rm --cached data/training_table.parquet 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Retrain $(date -u +%Y-%m-%d): ${{ github.event.inputs.note }}"
          git config http.postBuffer 524288000
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep 30
          done
