name: NBA Props Model — Retrain

on:
  schedule:
    # 07:00 UTC = 03:00 ET (EDT) / 02:00 ET (EST). Daily retrain at the
    # start of the H1B chain. retrain.yml has no upstream gate — it is
    # the first workflow in the chain. The 07:00 UTC choice gives BDL
    # ~1 hour of buffer past late-finishing games (NBA games end
    # 10:30–11:30 PM ET = 02:30–03:30 UTC; BDL ingestion takes ~1-2 hr,
    # so 07:00 UTC clears most-but-not-all late games). Train.py has
    # no explicit freshness gate — adding a BDL-readiness pre-flight is
    # tracked as a future fix.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      note:
        description: 'Reason for retrain'
        required: false
        default: 'Scheduled retrain'

# Phase 13AN-H1: serialize concurrent retrains so two manual
# workflow_dispatch firings don't race on git push of model artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    # L4 (RT-8): full retrain wall-clock is well under 3 hours; the
    # previous 360-minute cap masked stuck runs. 180 minutes still leaves
    # safe margin for cold-cache + slow-runner days.
    timeout-minutes: 180

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full retrain
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/train.py

      # RT-7: catch a corrupt or truncated training table NOW, before
      # calibrate.py tries to use it and before we upload it as the
      # artifact Phase 8 consumes. A truncated table would otherwise
      # propagate to Phase 8 calibration runs hours later.
      #
      # The training table is LONG format: one row per
      # (game_date, player_id, stat) with the observed value in the
      # `actual` column. Stat values for pts/reb/ast/etc. live as rows
      # in the `stat` column, not as separate columns. The integrity
      # check verifies (a) row-count floor, (b) the four structural
      # columns are present, and (c) each active-production stat per
      # the operator contract (pts, reb, ast) has enough rows.
      # fg3m/tov/stl/blk may also be present in the table but are
      # blocked from publishing — they are intentionally NOT required
      # here so the gate matches what downstream actually consumes.
      - name: Verify training table integrity
        run: |
          python3 - <<'PY'
          import pandas as pd, sys
          df = pd.read_parquet('data/training_table.parquet')
          if len(df) < 500_000:
              sys.exit(f"Training table too small: {len(df)} rows, expected >500k")
          required_cols = ['game_date', 'player_id', 'stat', 'actual']
          missing = [c for c in required_cols if c not in df.columns]
          if missing:
              sys.exit(f"Missing required structural columns: {missing}")
          active_stats = ['pts', 'reb', 'ast']
          counts = df['stat'].astype(str).value_counts()
          too_sparse = [s for s in active_stats if int(counts.get(s, 0)) < 50_000]
          if too_sparse:
              sys.exit(
                  f"Active production stats missing or too sparse "
                  f"(<50k rows): {too_sparse}"
              )
          print(f"OK: {len(df)} rows; active stats:")
          for s in active_stats:
              print(f"  {s}: {int(counts.get(s, 0))} rows")
          PY

      - name: Run Platt calibration
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          # RT-2 TODO: scripts/calibrate.py currently exits 0 in BOTH the
          # success case AND the no-graded-data case (it logs a warning
          # and returns). Real crashes exit non-zero. There is no exit-2
          # path that would let us distinguish "insufficient data" from
          # "crash". The previous `|| echo "Calibration skipped"` swallow
          # was misleading: it fired only on crashes (which we want to
          # surface), never on the actual skip case (which already exits 0
          # silently). Track at: add an exit-2 path to calibrate.py for
          # the no-graded-data branch so we can echo a notice line again.
          python scripts/calibrate.py

      - name: Upload training-table artifact for Phase 8 handoff
        # Phase 8 downloads this artifact instead of rebuilding the table
        # (rebuild takes 60–120 min). Uploaded BEFORE the commit step so
        # a) the file is available even if the commit is skipped, and
        # b) Phase 8 does not need any commit to pick it up.
        uses: actions/upload-artifact@v4
        with:
          name: training-table
          path: data/training_table.parquet
          if-no-files-found: error
          retention-days: 30

      - name: Commit retrained artifacts
        run: |
          git config user.name  "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          # RT-4: the convoluted `git rm --cached` + `git add data/ -f` +
          # `git rm --cached` again pattern is intentional and load-bearing.
          # `data/training_table.parquet` is gitignored because it's
          # multi-GB and Phase 8 picks it up via the upload-artifact above
          # rather than from origin/main. `git add data/ -f` force-stages
          # everything in data/ (bypassing the gitignore) so the smaller
          # training byproducts are committed. The post-add `git rm
          # --cached training_table.parquet` then unstages the huge parquet
          # so it never lands on origin/main. The pre-add `git rm --cached`
          # is a no-op when nothing is staged but is kept defensively in
          # case a previous step left it in the index. Investigation note:
          # could not determine which specific files in data/ are needed
          # downstream; leaving the existing pattern intact rather than
          # narrowing it and risking a silent drop.
          git rm --cached data/training_table.parquet 2>/dev/null || true
          git add artifacts/models/ -f
          git add data/ -f
          git rm --cached data/training_table.parquet 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "Retrain $(date -u +%Y-%m-%d): ${{ github.event.inputs.note }}"
          git config http.postBuffer 524288000
          PUSH_SUCCESS=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 30
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 5 attempts"
            exit 1
          fi
