name: NBA Player Props — Manual Contextual Training Step 5 (Direct Lineup Model)

# Builds the no-leakage direct-lineup training dataset, trains the
# Phase 13S Ridge minutes / per-stat rate adjustment models that
# directly consume official lineup features (current_starter,
# confirmed_starter, lineup composition, player×lineup interactions),
# verifies feature lists + 6-case PMF sensitivity, recalibrates +
# validates, promotes when gates pass, wires every prediction path,
# and emits Derek interpretability outputs.
#
# Hard rules:
#   - Author for every commit: Joseph Shackelford <josephshack@gmail.com>.
#   - WoO default predict.py path is preserved byte-for-byte.
#   - No edits to wizard_of_odds/, derek_forward_feed/,
#     pmf_model_review_package/, canonical_source/.
#   - Auto-commit ONLY artifacts/phase13s/, the new contextual
#     challenger directory, champion_pointer.json, v_phase13s_*
#     pointer backups.

on:
  # H1B chain — auto-fire after phase13q succeeds (parallel with
  # phase13r). Manual dispatch remains available. The existing
  # promote_if_pass + force_promote inputs gate auto-promotion to
  # only happen when the validation gates pass.
  workflow_run:
    workflows: ["Phase 13Q — Contextual PMF Engine (train + validate, no-promote)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "YYYY-MM-DD (train through this date inclusive). Defaults to yesterday UTC."
        required: false
        default: ""
      dry_run:
        description: "Skip writing model artifacts; produce manifest only"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      promote_if_pass:
        description: "Promote the contextual challenger if validation gates pass"
        required: false
        default: "true"
        type: choice
        options: ["false", "true"]
      allow_future_trained_through:
        description: "Allow promotion when trained_through_date is in the future. Manual escape hatch — leave 'false' for normal runs."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_promote:
        description: "Force overwrite of existing champion_pointer.json (bypass the existing-pointer guard)."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  PYTHON_VERSION: "3.11"

jobs:
  phase13s_direct_lineup_contextual_pmf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # H1B chain gate.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    concurrency:
      group: phase13s-direct-lineup-contextual
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - name: H1B — Verify upstream output present (workflow_run only)
        if: github.event_name == 'workflow_run'
        run: |
          set -e
          # Upstream is phase13q which commits
          # "phase13q: contextual challenger <date>".
          UPSTREAM_PATTERN="^phase13q: "
          if ! git log --grep="$UPSTREAM_PATTERN" --since="24 hours ago" --format="%h" | head -1 | grep -q .; then
            echo "::error::No upstream commit matching '$UPSTREAM_PATTERN' in last 24h on origin/main"
            echo "Recent commits:"
            git log -5 --oneline
            exit 1
          fi
          LATEST=$(git log --grep="$UPSTREAM_PATTERN" --since="24 hours ago" -1 --format="%h %ai %s")
          echo "::notice::Upstream output verified: $LATEST"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Resolve as-of date (America/New_York)
        id: d
        run: |
          if [ -n "${{ github.event.inputs.as_of_date }}" ]; then
            echo "date=${{ github.event.inputs.as_of_date }}" >> "$GITHUB_OUTPUT"
          else
            ET_PREV=$(TZ=America/New_York date -d 'yesterday' +%Y-%m-%d 2>/dev/null \
                       || TZ=America/New_York date -v-1d +%Y-%m-%d)
            echo "date=$ET_PREV" >> "$GITHUB_OUTPUT"
          fi

      - name: Phase 13S started
        run: |
          echo "PHASE13S_DEPLOYMENT_STARTED  as_of=${{ steps.d.outputs.date }}"
          git rev-parse HEAD

      - name: Phase 13R baseline audit
        run: python scripts/_phase13s_write_baseline_audit.py

      - name: Build direct-lineup training dataset
        run: |
          python scripts/build_direct_lineup_training_dataset.py \
            --as-of-date ${{ steps.d.outputs.date }}

      - name: Train direct-lineup contextual challenger
        run: |
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi
          python scripts/train_direct_lineup_contextual_challenger.py \
            --as-of-date ${{ steps.d.outputs.date }} $DRY

      - name: Verify direct-lineup feature lists
        run: python scripts/verify_direct_lineup_feature_lists.py

      - name: Verify direct-lineup PMF sensitivity (6 cases)
        run: python scripts/verify_direct_lineup_pmf_sensitivity.py

      - name: Recalibrate + validate
        run: python scripts/verify_phase13s_validation_gates.py

      - name: Phase 13S no-leakage
        run: python scripts/verify_phase13s_no_leakage.py

      - name: Phase 13L no-breakage
        run: python scripts/verify_phase13l_no_breakage.py

      # H12: combine the explicit `promote_if_pass != 'false'` check with
      # the implicit success() so a verifier failure can never reach the
      # promote step even when the operator left promote_if_pass=true.
      # H11: --force is no longer hardcoded; gated behind force_promote
      # input (default false) so a normal run cannot accidentally overwrite
      # an existing champion_pointer.json.
      - name: Promote direct-lineup challenger
        if: success() && github.event.inputs.promote_if_pass != 'false'
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.allow_future_trained_through }}" = "true" ]; then
            ARGS="$ARGS --allow-future-trained-through"
          fi
          if [ "${{ github.event.inputs.force_promote }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python scripts/promote_direct_lineup_challenger.py $ARGS

      - name: Verify all predict paths + Derek interpretability outputs
        run: python scripts/verify_phase13s_deployment.py

      - name: Phase 13R contextual baseline (regression)
        run: |
          python scripts/verify_contextual_feature_lists.py
          python scripts/verify_contextual_predict_path.py
          python scripts/verify_contextual_pmf_sensitivity.py
          python scripts/verify_phase13q_no_leakage.py

      - name: Derek after-game scoring (pending hook)
        run: python scripts/run_phase13s_after_game_scoring.py --delivery-date ${{ steps.d.outputs.date }}

      - name: Upload Phase 13S artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13s-direct-lineup-contextual
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/phase13s/**
            artifacts/models/registry/champion_pointer.json
            artifacts/models/champion/v_phase13s_*/**
            artifacts/models/challengers/*_direct_lineup_contextual/**

      - name: Commit Phase 13S artifacts (Joseph Shackelford authorship)
        if: success()
        run: |
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          # promotion_log.csv added during M1 investigation (same bug as
          # phase13r): promote_direct_lineup_challenger.py appends a row
          # to this tracked file, but `git checkout -- .` was discarding
          # it. Phase 13S promotions now actually show up in the
          # promotion log on origin/main.
          if ! git add artifacts/phase13s \
                       artifacts/models/registry/champion_pointer.json \
                       artifacts/models/registry/promotion_log.csv \
                       artifacts/models/champion/v_phase13s_* \
                       artifacts/models/challengers/*_direct_lineup_contextual/promotion_decision.json \
                       artifacts/models/challengers/*_direct_lineup_contextual/promotion_manifest.json; then
            echo "::error::git add failed for one or more Phase 13S paths"
            exit 1
          fi
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "phase13s: train direct lineup injury PMF drivers"
          # M1: scope the working-tree reset to (a) BDL/build-mutated data
          # parquets we explicitly do NOT commit from this workflow, and
          # (b) phase13l_no_breakage.{md,json} which are regenerated and
          # committed by nightly_training_calibration. promotion_log.csv
          # was previously also being discarded here — see git add list.
          git checkout -- data/player_game_stats.parquet \
                          data/live_context_features.parquet \
                          artifacts/automation_health/phase13l_no_breakage.md \
                          artifacts/automation_health/phase13l_no_breakage.json \
                          2>/dev/null || true
          PUSH_SUCCESS=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi
