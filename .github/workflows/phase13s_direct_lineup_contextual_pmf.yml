name: Phase 13S — Direct Lineup Contextual PMF Driver

# Builds the no-leakage direct-lineup training dataset, trains the
# Phase 13S Ridge minutes / per-stat rate adjustment models that
# directly consume official lineup features (current_starter,
# confirmed_starter, lineup composition, player×lineup interactions),
# verifies feature lists + 6-case PMF sensitivity, recalibrates +
# validates, promotes when gates pass, wires every prediction path,
# and emits Derek interpretability outputs.
#
# Hard rules:
#   - Author for every commit: Joseph Shackelford <josephshack@gmail.com>.
#   - WoO default predict.py path is preserved byte-for-byte.
#   - No edits to wizard_of_odds/, derek_forward_feed/,
#     pmf_model_review_package/, canonical_source/.
#   - Auto-commit ONLY artifacts/phase13s/, the new contextual
#     challenger directory, champion_pointer.json, v_phase13s_*
#     pointer backups.

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "YYYY-MM-DD (train through this date inclusive). Defaults to yesterday UTC."
        required: false
        default: ""
      dry_run:
        description: "Skip writing model artifacts; produce manifest only"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      promote_if_pass:
        description: "Promote the contextual challenger if validation gates pass"
        required: false
        default: "true"
        type: choice
        options: ["false", "true"]
      allow_future_trained_through:
        description: "Allow promotion when trained_through_date is in the future"
        required: false
        default: "true"
        type: choice
        options: ["false", "true"]

env:
  PYTHON_VERSION: "3.11"

jobs:
  phase13s_direct_lineup_contextual_pmf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: phase13s-direct-lineup-contextual
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install pandas pyarrow numpy joblib scikit-learn requests pyyaml

      - name: Resolve as-of date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.as_of_date }}" ]; then
            echo "date=${{ github.event.inputs.as_of_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u -d 'yesterday' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Phase 13S started
        run: |
          echo "PHASE13S_DEPLOYMENT_STARTED  as_of=${{ steps.d.outputs.date }}"
          git rev-parse HEAD

      - name: Phase 13R baseline audit
        run: python scripts/_phase13s_write_baseline_audit.py

      - name: Build direct-lineup training dataset
        run: |
          python scripts/build_direct_lineup_training_dataset.py \
            --as-of-date ${{ steps.d.outputs.date }}

      - name: Train direct-lineup contextual challenger
        run: |
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi
          python scripts/train_direct_lineup_contextual_challenger.py \
            --as-of-date ${{ steps.d.outputs.date }} $DRY

      - name: Verify direct-lineup feature lists
        run: python scripts/verify_direct_lineup_feature_lists.py

      - name: Verify direct-lineup PMF sensitivity (6 cases)
        run: python scripts/verify_direct_lineup_pmf_sensitivity.py

      - name: Recalibrate + validate
        run: python scripts/verify_phase13s_validation_gates.py

      - name: Phase 13S no-leakage
        run: python scripts/verify_phase13s_no_leakage.py

      - name: Phase 13L no-breakage
        run: python scripts/verify_phase13l_no_breakage.py

      - name: Promote direct-lineup challenger
        if: ${{ github.event.inputs.promote_if_pass != 'false' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.allow_future_trained_through }}" = "true" ]; then
            ARGS="$ARGS --allow-future-trained-through"
          fi
          python scripts/promote_direct_lineup_challenger.py $ARGS --force

      - name: Verify all predict paths + Derek interpretability outputs
        run: python scripts/verify_phase13s_deployment.py

      - name: Phase 13R contextual baseline (regression)
        run: |
          python scripts/verify_contextual_feature_lists.py
          python scripts/verify_contextual_predict_path.py
          python scripts/verify_contextual_pmf_sensitivity.py
          python scripts/verify_phase13q_no_leakage.py

      - name: Derek after-game scoring (pending hook)
        run: python scripts/run_phase13s_after_game_scoring.py --delivery-date ${{ steps.d.outputs.date }}

      - name: Upload Phase 13S artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13s-direct-lineup-contextual
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/phase13s/**
            artifacts/models/registry/champion_pointer.json
            artifacts/models/champion/v_phase13s_*/**
            artifacts/models/challengers/*_direct_lineup_contextual/**

      - name: Commit Phase 13S artifacts (Joseph Shackelford authorship)
        run: |
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          git add artifacts/phase13s \
                  artifacts/models/registry/champion_pointer.json \
                  artifacts/models/champion/v_phase13s_* \
                  artifacts/models/challengers/*_direct_lineup_contextual/promotion_decision.json \
                  artifacts/models/challengers/*_direct_lineup_contextual/promotion_manifest.json \
                  || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "phase13s: train direct lineup injury PMF drivers"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done
