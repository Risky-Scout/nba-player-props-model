name: Derek — Per-Game Live PMF Snapshots (T-25 / Close-Lock)

# Phase 13L. Derek-only per-game live snapshots. Independent of WoO and
# nightly training/calibration. Never modifies wizard_of_odds/ or
# pmf_model_review_package/ outputs.
#
# Hard rules echoed by every job:
#   - Champion comes only from artifacts/models/registry/champion_pointer.json.
#   - PMFs must be recomputed for live snapshots (predict.py invocation
#     during the run, OR --allow-backfill-test for testing on a non-today date).
#   - Confirmed-lineup status is recorded honestly. Phase 13L does NOT
#     wire a confirmed-lineup source; manifests carry
#     lineup_confirmed=false / lineup_blocker="no confirmed lineup source wired".
#   - No post-tip data is used in pre-game snapshots.
#   - Derek-only outputs land in deliveries/<date>/derek_game_snapshots/<game_id>/<snapshot_type>/.
#   - Commit author: Joseph Shackelford <josephshack@gmail.com>.

on:
  schedule:
    # Phase 13T — expanded UTC window so playoff matinee tips (~16:00
    # UTC for early afternoon games on weekends) and late-night games
    # (~04:00 UTC for West Coast tips) all fall inside dispatch
    # coverage. Each cron firing checks the schedule and ONLY invokes
    # the runner for games whose T-25 / close-lock target is actually
    # due — no-op pending state is honest and silent at the workflow
    # level.
    - cron: '0,10,20,30,40,50 16,17,18,19,20,21,22,23,0,1,2,3,4 * * *'
  workflow_dispatch:
    inputs:
      delivery_date:
        description: "YYYY-MM-DD; blank = today UTC"
        required: false
        default: ""
      snapshot_type:
        description: "Which snapshot to dispatch (both = t25 + close_lock; all = current_live + t25 + close_lock)"
        required: false
        default: "all"
        type: choice
        options: ["current_live", "t_minus_25", "close_lock", "both", "all"]
      allow_backfill_test:
        description: "Skip wall-clock window check (for manual testing)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      max_games:
        description: "Limit games dispatched (testing)"
        required: false
        default: ""
      force:
        description: "Overwrite existing snapshot folders (use to re-emit corrected manifests)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  PYTHON_VERSION: "3.11"

jobs:
  derek_live_snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: derek-live-snapshots-${{ github.event.inputs.delivery_date || 'today' }}-${{ github.event.inputs.snapshot_type || 't_minus_25' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install python deps
        run: pip install -r requirements.txt

      # Phase 13AL: secrets preflight — fail fast if BDL is missing.
      - name: Secrets preflight (Phase 13AL)
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 scripts/verify_secrets_preflight.py --mode daily

      - name: Resolve delivery date (America/New_York)
        id: d
        run: |
          if [ -n "${{ github.event.inputs.delivery_date }}" ]; then
            echo "date=${{ github.event.inputs.delivery_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve snapshot type
        id: s
        run: |
          # workflow_dispatch input wins; cron schedule fans out across all.
          INPUT_TYPE="${{ github.event.inputs.snapshot_type }}"
          if [ -z "$INPUT_TYPE" ]; then
            INPUT_TYPE="all"
          fi
          echo "type=$INPUT_TYPE" >> "$GITHUB_OUTPUT"

      - name: Resolve game start times (Phase 13U)
        id: resolve_start_times
        continue-on-error: true
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/resolve_game_start_times.py --delivery-date ${{ steps.d.outputs.date }}

      - name: Enrich predictions with real game_start_time (Phase 13U)
        id: enrich_predictions
        continue-on-error: true
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/enrich_predictions_game_start_times.py --delivery-date ${{ steps.d.outputs.date }}

      - name: Verify slate completeness (Phase 13U)
        id: verify_slate
        continue-on-error: true
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/verify_derek_slate_completeness.py --delivery-date ${{ steps.d.outputs.date }}

      - name: Dispatch current_live (Phase 13U)
        id: dispatch_current_live
        if: steps.s.outputs.type == 'current_live' || steps.s.outputs.type == 'all'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          STALE_FLAG=""
          if [ "${{ github.event.inputs.allow_backfill_test }}" = "true" ]; then
            STALE_FLAG="--allow-backfill-test"
          fi
          MAX_FLAG=""
          if [ -n "${{ github.event.inputs.max_games }}" ]; then
            MAX_FLAG="--max-games ${{ github.event.inputs.max_games }}"
          fi
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/dispatch_derek_live_game_snapshots.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --snapshot-type current_live \
            $STALE_FLAG $MAX_FLAG $FORCE_FLAG

      - name: Dispatch t_minus_25
        id: dispatch_t25
        if: steps.s.outputs.type == 't_minus_25' || steps.s.outputs.type == 'both' || steps.s.outputs.type == 'all'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          STALE_FLAG=""
          if [ "${{ github.event.inputs.allow_backfill_test }}" = "true" ]; then
            STALE_FLAG="--allow-backfill-test"
          fi
          MAX_FLAG=""
          if [ -n "${{ github.event.inputs.max_games }}" ]; then
            MAX_FLAG="--max-games ${{ github.event.inputs.max_games }}"
          fi
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/dispatch_derek_live_game_snapshots.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --snapshot-type t_minus_25 \
            $STALE_FLAG $MAX_FLAG $FORCE_FLAG

      - name: Dispatch close_lock
        id: dispatch_cl
        if: steps.s.outputs.type == 'close_lock' || steps.s.outputs.type == 'both' || steps.s.outputs.type == 'all'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          STALE_FLAG=""
          if [ "${{ github.event.inputs.allow_backfill_test }}" = "true" ]; then
            STALE_FLAG="--allow-backfill-test"
          fi
          MAX_FLAG=""
          if [ -n "${{ github.event.inputs.max_games }}" ]; then
            MAX_FLAG="--max-games ${{ github.event.inputs.max_games }}"
          fi
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/dispatch_derek_live_game_snapshots.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --snapshot-type close_lock \
            $STALE_FLAG $MAX_FLAG $FORCE_FLAG

      - name: Verify Derek live API readiness
        id: verify_api_readiness
        continue-on-error: true
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/verify_derek_live_api_readiness.py

      - name: Verify predict.py Derek-mode CLI + lineup-context fixture
        id: verify_predict_lineup
        continue-on-error: true
        run: |
          python scripts/verify_predict_lineup_context.py

      - name: Verify Derek live champion model ready (production-live gate)
        id: verify_champion
        continue-on-error: true
        # Backfill / demo runs do NOT require the champion-readiness gate;
        # the runner skips it internally when --allow-backfill-test is set.
        # This step still runs the verifier for visibility but does not
        # block the workflow when allow_backfill_test is true.
        run: |
          python scripts/verify_derek_live_champion_ready.py \
            --delivery-date ${{ steps.d.outputs.date }}

      - name: Build snapshot comparison + input change report
        id: build_comparison
        continue-on-error: true
        run: |
          python scripts/build_derek_snapshot_comparison.py \
            --delivery-date ${{ steps.d.outputs.date }} || true

      - name: Verify Derek live snapshots
        id: verify_derek
        continue-on-error: true
        run: |
          python scripts/verify_derek_live_snapshots.py \
            --delivery-date ${{ steps.d.outputs.date }}

      - name: Verify BDL fetch proof (Phase 13W)
        id: verify_bdl_fetch
        continue-on-error: true
        run: |
          python scripts/verify_bdl_fetch_proof_for_derek.py \
            --delivery-date ${{ steps.d.outputs.date }}

      - name: Audit contextual delta variation (Phase 13W)
        id: audit_delta
        continue-on-error: true
        run: |
          python scripts/audit_contextual_delta_variation.py \
            --delivery-date ${{ steps.d.outputs.date }}

      - name: Build Derek delivery README (Phase 13W)
        id: build_readme
        continue-on-error: true
        run: |
          python scripts/build_derek_delivery_readme.py \
            --delivery-date ${{ steps.d.outputs.date }}

      - name: Audit Derek edge root-cause (Phase 13X)
        id: audit_edge_rootcause
        continue-on-error: true
        run: |
          python scripts/audit_derek_edge_root_cause.py \
            --delivery-date ${{ steps.d.outputs.date }}

      - name: Audit Derek edge calibration buckets (Phase 13X)
        id: audit_edge_calibration
        continue-on-error: true
        run: |
          AS_OF=$(python -c "import json,pathlib;p=pathlib.Path('artifacts/models/registry/champion_pointer.json');d=json.loads(p.read_text()) if p.exists() else {};print(d.get('contextual_trained_through_date') or d.get('trained_through_date') or '${{ steps.d.outputs.date }}')")
          python scripts/audit_derek_calibration_for_edge_buckets.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --as-of-date "$AS_OF"

      - name: Apply Derek edge publishability columns (Phase 13X)
        id: apply_edge_publishability
        continue-on-error: true
        run: |
          python scripts/apply_derek_edge_publishability.py \
            --delivery-date ${{ steps.d.outputs.date }}

      - name: Append edge reasonability to Derek reports (Phase 13X)
        id: append_edge_reports
        continue-on-error: true
        run: |
          python scripts/append_phase13x_edge_section_to_reports.py \
            --delivery-date ${{ steps.d.outputs.date }}

      - name: Rebuild Derek delivery README with Phase 13X notes
        id: rebuild_readme
        continue-on-error: true
        run: |
          python scripts/build_derek_delivery_readme.py \
            --delivery-date ${{ steps.d.outputs.date }}

      - name: Polish Derek reports with team-name labels (Phase 13Z)
        id: polish_reports
        continue-on-error: true
        run: |
          python scripts/render_derek_human_reports.py \
            --delivery-date ${{ steps.d.outputs.date }}

      - name: Repair Derek long-form outcome PMF files (Phase 13AB)
        id: repair_outcome_long
        continue-on-error: true
        run: |
          python scripts/repair_derek_outcome_level_probabilities.py \
            --delivery-date ${{ steps.d.outputs.date }} \
            --all-snapshots

      - name: Verify Derek long-form outcome PMF files (Phase 13AB)
        id: verify_outcome_long
        continue-on-error: true
        run: |
          python scripts/verify_derek_outcome_level_probabilities.py \
            --delivery-date ${{ steps.d.outputs.date }}

      - name: Verify Wizard of Odds untouched (Phase 13X)
        id: verify_woo_unchanged
        continue-on-error: true
        run: |
          python scripts/verify_phase13x_woo_unchanged.py

      - name: Verify Derek production-live E2E (Phase 13T)
        id: verify_e2e
        continue-on-error: true
        run: |
          python scripts/verify_derek_production_live_e2e.py \
            --delivery-date ${{ steps.d.outputs.date }}

      - name: Verify Phase 13L no-breakage
        id: verify_no_break
        continue-on-error: true
        run: |
          python scripts/verify_phase13l_no_breakage.py

      - name: Verify daily retrain / recalibration (Phase 13W)
        id: verify_retrain_recal
        continue-on-error: true
        run: |
          AS_OF=$(python -c "import json,pathlib;p=pathlib.Path('artifacts/models/registry/champion_pointer.json');d=json.loads(p.read_text()) if p.exists() else {};print(d.get('contextual_trained_through_date') or d.get('trained_through_date') or '${{ steps.d.outputs.date }}')")
          python scripts/verify_daily_retrain_recalibration.py --as-of-date "$AS_OF"

      - name: Build daily model training report (Phase 13U)
        id: daily_report
        continue-on-error: true
        run: |
          # Use the active champion's trained_through_date for the
          # report, falling back to delivery_date when missing.
          AS_OF=$(python -c "import json,pathlib;p=pathlib.Path('artifacts/models/registry/champion_pointer.json');d=json.loads(p.read_text()) if p.exists() else {};print(d.get('contextual_trained_through_date') or d.get('trained_through_date') or '${{ steps.d.outputs.date }}')")
          python scripts/build_daily_model_training_report.py --as-of-date "$AS_OF"

      - name: Score Derek snapshots after games (pending if outcomes absent)
        id: after_game_scoring
        continue-on-error: true
        run: |
          python scripts/score_derek_live_snapshots_after_game.py \
            --delivery-date ${{ steps.d.outputs.date }} || true

      - name: Build rolling Derek snapshot benchmark (28-day window)
        id: rolling_benchmark
        continue-on-error: true
        run: |
          python scripts/build_rolling_derek_snapshot_benchmark.py \
            --as-of-date ${{ steps.d.outputs.date }} --window-days 28 || true

      - name: Upload Derek live snapshot artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: derek-live-snapshots-${{ steps.d.outputs.date }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            deliveries/${{ steps.d.outputs.date }}/derek_game_snapshots/**
            artifacts/derek_live_snapshots/${{ steps.d.outputs.date }}/**
            artifacts/live_lineups/${{ steps.d.outputs.date }}/**
            artifacts/automation_health/derek_live_snapshots_${{ steps.d.outputs.date }}.*
            artifacts/automation_health/derek_live_champion_ready_${{ steps.d.outputs.date }}.*
            artifacts/automation_health/derek_live_api_readiness.*
            artifacts/automation_health/phase13l_no_breakage.*

      - name: Upload Phase 13T E2E artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: derek-production-live-e2e-${{ steps.d.outputs.date }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/automation_health/derek_production_live_e2e_${{ steps.d.outputs.date }}.*

      - name: Stage and commit Derek-only files (Joseph Shackelford authorship)
        # Phase 13U — commit gate requires every attempted dispatch to have
        # succeeded. For each dispatch: either it wasn't required by the
        # selected `type` (skipped is OK), or it ran and succeeded.
        if: |
          (steps.s.outputs.type != 'current_live' && steps.s.outputs.type != 'all' || steps.dispatch_current_live.outcome == 'success') &&
          (steps.s.outputs.type != 't_minus_25' && steps.s.outputs.type != 'both' && steps.s.outputs.type != 'all' || steps.dispatch_t25.outcome == 'success') &&
          (steps.s.outputs.type != 'close_lock' && steps.s.outputs.type != 'both' && steps.s.outputs.type != 'all' || steps.dispatch_cl.outcome == 'success')
        run: |
          git config user.name "Joseph Shackelford"
          git config user.email "josephshack@gmail.com"
          AS_OF=$(python -c "import json,pathlib;p=pathlib.Path('artifacts/models/registry/champion_pointer.json');d=json.loads(p.read_text()) if p.exists() else {};print(d.get('contextual_trained_through_date') or d.get('trained_through_date') or '${{ steps.d.outputs.date }}')")
          if ! git add deliveries/${{ steps.d.outputs.date }}/derek_game_snapshots \
                       deliveries/${{ steps.d.outputs.date }}/README.md \
                       artifacts/derek_live_snapshots/${{ steps.d.outputs.date }} \
                       artifacts/live_lineups/${{ steps.d.outputs.date }} \
                       artifacts/live_schedule/${{ steps.d.outputs.date }} \
                       artifacts/automation_health/derek_live_snapshots_${{ steps.d.outputs.date }}.json \
                       artifacts/automation_health/derek_live_snapshots_${{ steps.d.outputs.date }}.md \
                       artifacts/automation_health/derek_live_champion_ready_${{ steps.d.outputs.date }}.json \
                       artifacts/automation_health/derek_live_champion_ready_${{ steps.d.outputs.date }}.md \
                       artifacts/automation_health/derek_slate_completeness_${{ steps.d.outputs.date }}.json \
                       artifacts/automation_health/derek_slate_completeness_${{ steps.d.outputs.date }}.md \
                       artifacts/automation_health/derek_production_live_e2e_${{ steps.d.outputs.date }}.json \
                       artifacts/automation_health/derek_production_live_e2e_${{ steps.d.outputs.date }}.md \
                       artifacts/automation_health/bdl_fetch_proof_${{ steps.d.outputs.date }}.json \
                       artifacts/automation_health/bdl_fetch_proof_${{ steps.d.outputs.date }}.md \
                       artifacts/automation_health/contextual_delta_variation_${{ steps.d.outputs.date }}.json \
                       artifacts/automation_health/contextual_delta_variation_${{ steps.d.outputs.date }}.md \
                       artifacts/automation_health/derek_edge_root_cause_${{ steps.d.outputs.date }}.json \
                       artifacts/automation_health/derek_edge_root_cause_${{ steps.d.outputs.date }}.md \
                       artifacts/automation_health/derek_edge_calibration_${{ steps.d.outputs.date }}.json \
                       artifacts/automation_health/derek_edge_calibration_${{ steps.d.outputs.date }}.md \
                       artifacts/automation_health/phase13x_woo_unchanged.json \
                       artifacts/phase13z \
                       artifacts/automation_health/daily_retrain_recalibration_$AS_OF.json \
                       artifacts/automation_health/phase13l_no_breakage.json \
                       artifacts/automation_health/phase13l_no_breakage.md \
                       artifacts/model_daily_reports/$AS_OF; then
            echo "::error::git add failed for one or more paths"
            exit 1
          fi
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit \
              --author="Joseph Shackelford <josephshack@gmail.com>" \
              -m "phase13u: Derek live snapshots + daily model report ${{ steps.d.outputs.date }}"
          git checkout -- data/player_game_stats.parquet 2>/dev/null || true
          PUSH_SUCCESS=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSH_SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "1" ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi

      - name: Fail workflow if any required step failed
        # Phase 13T — verify_derek and verify_e2e both treat "no games"
        # as PENDING (exit 0). The workflow only fails when a verifier
        # genuinely reports FAILED, no_break regresses, or the E2E
        # check finds overdue-missing snapshots.
        #
        # `if: always()` is required so this consolidator runs even after
        # one of the now-hard-failing dispatchers (H3) terminates the job
        # — without it, a dispatch failure would skip this step and the
        # operator log wouldn't show the consolidated outcome line.
        # `outcome == 'failure'` (not `!= 'success'`) is used for dispatchers
        # so that skipped dispatches (type didn't include them) don't
        # falsely trigger the consolidator.
        if: ${{ always() && (
            steps.verify_derek.outcome != 'success' ||
            steps.verify_e2e.outcome != 'success' ||
            steps.verify_no_break.outcome != 'success' ||
            steps.dispatch_current_live.outcome == 'failure' ||
            steps.dispatch_t25.outcome == 'failure' ||
            steps.dispatch_cl.outcome == 'failure'
          ) }}
        run: |
          echo "::error::A Derek live snapshot dispatcher or verifier failed. See uploaded artifacts."
          echo "dispatch_current_live=${{ steps.dispatch_current_live.outcome }}"
          echo "dispatch_t25=${{ steps.dispatch_t25.outcome }}"
          echo "dispatch_cl=${{ steps.dispatch_cl.outcome }}"
          echo "verify_derek=${{ steps.verify_derek.outcome }}"
          echo "verify_e2e=${{ steps.verify_e2e.outcome }}"
          echo "verify_no_break=${{ steps.verify_no_break.outcome }}"
          exit 1
